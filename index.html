<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>字笺 · ZiJian</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app" data-theme="classic">
    <header class="app-header">
      <button id="btn-back" class="btn-back hidden" title="返回">‹</button>
      <div class="header-center">
        <div id="header-avatar" class="header-avatar hidden" title="双击拍一拍"></div>
        <h1 id="page-title">聊天</h1>
      </div>
      <div class="header-right"></div>
    </header>

    <main class="app-main">
      <section id="page-chat" class="page active">
        <div id="chat-list-view">
          <div id="chat-list" class="chat-list"></div>
          <div id="chat-list-empty" class="empty-state">
            <div class="empty-icon">💬</div>
            <p>选择联系人开始聊天</p>
            <p class="hint">字卡会以纸笺形式回复</p>
          </div>
        </div>
        <div id="chat-detail-view" class="hidden">
          <div id="message-list" class="message-list"></div>
          <div id="quote-bar" class="quote-bar hidden">
            <div class="quote-bar-content">
              <span class="quote-bar-label">引用</span>
              <span id="quote-bar-text" class="quote-bar-text"></span>
            </div>
            <button id="quote-bar-close" class="quote-bar-close">✕</button>
          </div>
          <div id="attach-panel" class="attach-panel hidden">
            <button class="attach-btn" data-action="transfer"><span class="attach-icon">💸</span><span>转账</span></button>
            <button class="attach-btn" data-action="redpacket"><span class="attach-icon">🧧</span><span>红包</span></button>
          </div>
          <div class="composer">
            <button id="btn-attach" class="btn-attach">+</button>
            <textarea id="msg-input" placeholder="说点什么..." rows="1"></textarea>
            <button id="btn-send" class="btn-send">发送</button>
          </div>
        </div>
      </section>

      <section id="page-contacts" class="page">
        <div class="contacts-layout">
          <div class="contacts-list" id="contacts-list"></div>
          <div class="cards-panel" id="cards-panel">
            <div class="empty-state small"><p>选择一位联系人查看字卡库</p></div>
          </div>
        </div>
      </section>

      <section id="page-music" class="page">
        <div class="music-page">
          <div class="music-page-toolbar">
            <button class="btn-primary" id="btn-import-song">＋ 导入歌曲</button>
          </div>
          <div id="song-list" class="song-list"></div>
          <div id="song-list-empty" class="empty-state">
            <div class="empty-icon">🎵</div>
            <p>还没有歌曲</p>
            <p class="hint">导入直链音频（mp3/m4a 等），可填歌词 LRC</p>
          </div>
        </div>
      </section>

      <section id="page-me" class="page">
        <div class="me-content">
          <div class="avatar-large" style="background:#3D9A62">昕</div>
          <h2>昕</h2>
          <p class="subtitle">字笺 · 纸上心意</p>
          <div class="balance-card">
            <div class="balance-label">我的星币</div>
            <div class="balance-value"><span id="user-balance">888</span><span class="balance-unit">★</span></div>
            <button class="btn-sm" id="btn-edit-balance">修改余额</button>
          </div>
          <div class="theme-section">
            <div class="section-label">主题皮肤</div>
            <div class="theme-grid" id="theme-grid">
              <button class="theme-card active" data-theme="classic"><div class="theme-preview classic-preview"></div><span>经典绿</span></button>
              <button class="theme-card" data-theme="dark"><div class="theme-preview dark-preview"></div><span>暗夜黑</span></button>
              <button class="theme-card" data-theme="cream"><div class="theme-preview cream-preview"></div><span>奶油白</span></button>
              <button class="theme-card" data-theme="lavender"><div class="theme-preview lavender-preview"></div><span>淡紫</span></button>
            </div>
          </div>
          <div class="stats">
            <div class="stat-item"><span class="stat-num" id="stat-contacts">0</span><span class="stat-label">联系人</span></div>
            <div class="stat-item"><span class="stat-num" id="stat-cards">0</span><span class="stat-label">字卡</span></div>
            <div class="stat-item"><span class="stat-num" id="stat-songs">0</span><span class="stat-label">歌曲</span></div>
          </div>
          <button class="btn-outline" id="btn-reset-data">重置示例数据</button>
        </div>
      </section>
    </main>

    <nav class="tab-bar">
      <button class="tab-item active" data-page="chat"><span class="tab-icon">💬</span><span class="tab-label">聊天</span></button>
      <button class="tab-item" data-page="contacts"><span class="tab-icon">📇</span><span class="tab-label">联系人</span></button>
      <button class="tab-item" data-page="music"><span class="tab-icon">🎵</span><span class="tab-label">音乐</span></button>
      <button class="tab-item" data-page="me"><span class="tab-icon">👤</span><span class="tab-label">我</span></button>
    </nav>
  </div>

  <div id="listen-page" class="listen-page hidden">
    <div class="listen-top">
      <button id="listen-back" class="listen-back">‹</button>
      <div class="listen-with" id="listen-with-name">一起听</div>
      <div class="listen-spacer"></div>
    </div>
    <div class="listen-cover-wrap">
      <div class="listen-cover-ring"><div id="listen-cover" class="listen-cover"></div></div>
    </div>
    <div class="listen-meta">
      <div id="listen-title" class="listen-title">歌名</div>
      <div id="listen-artist" class="listen-artist">歌手</div>
    </div>
    <div class="listen-lyrics-wrap"><div id="listen-lyrics" class="listen-lyrics"><div class="lyric-line">暂无歌词</div></div></div>
    <div class="listen-progress-wrap">
      <span id="listen-cur">0:00</span>
      <input type="range" id="listen-seek" class="listen-seek" min="0" max="100" value="0" step="0.1" />
      <span id="listen-dur">0:00</span>
    </div>
    <div class="listen-controls">
      <button id="listen-play" class="listen-play-btn">▶</button>
    </div>
    <div id="listen-toast" class="listen-toast hidden"></div>
    <audio id="listen-audio" preload="metadata"></audio>
  </div>

  <div id="pick-contact-overlay" class="modal-overlay hidden">
    <div class="modal">
      <h3>选择一起听的联系人</h3>
      <div id="pick-contact-list" class="pick-contact-list"></div>
      <div class="modal-actions"><button class="btn-ghost" id="pick-contact-cancel">取消</button></div>
    </div>
  </div>

  <div id="msg-action-menu" class="msg-action-menu hidden"><button data-action="quote">引用</button></div>

  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal modal-wide">
      <h3 id="modal-title">导入歌曲</h3>
      <div id="modal-body"></div>
      <div class="modal-actions">
        <button class="btn-ghost" id="modal-cancel">取消</button>
        <button class="btn-primary" id="modal-confirm">确定</button>
      </div>
    </div>
  </div>

  <input type="file" id="file-avatar" accept="image/*" class="hidden" />
  <input type="file" id="file-bg" accept="image/*" class="hidden" />
  <script src="app.js"></script>
</body>
</html>
