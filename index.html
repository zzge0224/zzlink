<style>

*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#eee8ff,transparent 35%),var(--bg);color:var(--ink);font:15px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #b9adff;outline-offset:2px}.app{max-width:1440px;height:100dvh;min-height:650px;margin:auto;padding:18px;display:grid;grid-template-columns:250px minmax(320px,1fr) 300px;gap:16px}.panel{background:#ffffffd9;border:1px solid #fff;border-radius:24px;box-shadow:var(--shadow);min-height:0;overflow:hidden}.sidebar{display:flex;flex-direction:column;padding:22px 15px}.brand{display:flex;align-items:center;gap:11px;padding:0 8px 24px}.logo{width:42px;height:42px;border-radius:15px;background:linear-gradient(145deg,#a89af5,#6f60c5);display:grid;place-items:center;color:#fff;font-size:22px;box-shadow:0 8px 20px #8172d844}.brand h1{font-size:18px;margin:0}.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:1px}.nav-label{font-size:11px;color:#a5a0b5;letter-spacing:1.5px;padding:8px 12px}.nav{display:flex;flex-direction:column;gap:5px}.nav button{display:flex;align-items:center;gap:11px;text-align:left;padding:12px;border-radius:13px;background:transparent;color:#77728c}.nav button.active,.nav button:hover{background:#f0edff;color:#5f51ba}.nav .ico{font-size:18px;width:23px;text-align:center}.sidebar-bottom{margin-top:auto}.tip{background:linear-gradient(140deg,#f0edff,#fff5fa);padding:15px;border-radius:17px;color:#716b8b;font-size:12px}.tip strong{display:block;color:#5c50a9;font-size:13px;margin-bottom:5px}.profile-mini{display:flex;align-items:center;gap:10px;padding:15px 8px 0}.avatar{width:38px;height:38px;flex:0 0 38px;border-radius:14px;background:linear-gradient(135deg,#e9c9e8,#b7b1f4);display:grid;place-items:center;font-size:20px}.profile-mini strong{font-size:13px}.profile-mini small{display:block;color:var(--muted);font-size:11px}.main{display:flex;flex-direction:column;position:relative;background:#fcfbff}.topbar{height:78px;flex:0 0 78px;padding:17px 23px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.eyebrow{font-size:11px;letter-spacing:1.4px;color:var(--accent);font-weight:700}.topbar h2{font-size:19px;margin:2px 0 0}.top-actions{display:flex;gap:8px}.icon-btn{width:37px;height:37px;border-radius:12px;background:#f4f1fc;color:#7d73b4}.chat-scroll{flex:1;overflow:auto;padding:24px clamp(14px,4vw,48px);background:linear-gradient(#fcfbffed,#fcfbffed),radial-gradient(#d9d2f8 1px,transparent 1px);background-size:auto,18px 18px}.date-pill{margin:0 auto 22px;width:max-content;padding:5px 12px;border-radius:99px;background:#f0edf8;color:#aaa3bd;font-size:11px}.message-row{display:flex;align-items:flex-end;gap:9px;margin:17px 0;animation:rise .25s ease}.message-row.mine{justify-content:flex-end}.message-row .avatar{width:31px;height:31px;flex-basis:31px;border-radius:11px;font-size:16px}.bubble-wrap{max-width:min(76%,520px)}.sender{font-size:11px;color:#a19bb3;margin:0 0 4px 3px}.bubble{padding:11px 14px;border-radius:5px 17px 17px 17px;background:var(--theirs);box-shadow:0 4px 14px #32265b0a;white-space:pre-wrap;overflow-wrap:anywhere}.mine .bubble{background:var(--mine);border-radius:17px 5px 17px 17px}.time{font-size:10px;color:#b4aec4;margin-top:4px;padding:0 3px}.mine .time{text-align:right}.typing{font-size:12px;color:#9991b6;padding:0 0 8px 40px;display:none}.composer{padding:15px 20px 19px;border-top:1px solid var(--line);background:#fff}.composer-tools{display:flex;gap:7px;margin-bottom:9px}.tool-chip{font-size:11px;padding:5px 10px;background:#f5f2fd;border-radius:8px;color:#9186c6}.compose-box{display:flex;align-items:flex-end;gap:10px}.compose-box textarea{resize:none;max-height:110px;min-height:45px;flex:1;border:1px solid #ebe6f6;background:#faf9fe;border-radius:15px;padding:12px 14px;color:var(--ink)}.send{height:45px;padding:0 19px;border-radius:14px;background:linear-gradient(135deg,#9c8ded,#7565ce);color:#fff;box-shadow:0 6px 15px #8172d844;font-weight:600}.rightbar{display:flex;flex-direction:column;padding:20px 17px;gap:18px;overflow:auto}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.section-head h3{margin:0;font-size:14px}.subtle{font-size:11px;color:var(--muted)}.contact-list{display:flex;flex-direction:column;gap:7px}.contact{display:flex;align-items:center;gap:10px;padding:10px;border-radius:15px;cursor:pointer;border:1px solid transparent}.contact.active,.contact:hover{background:#f5f2ff;border-color:#e9e3ff}.contact .avatar{width:39px;height:39px;flex-basis:39px}.contact-info{min-width:0;flex:1}.contact-info strong{display:block;font-size:13px}.contact-info small{display:block;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status-dot{width:7px;height:7px;border-radius:50%;background:#9ad9bb}.mini-btn{background:#f1edff;color:#7769c6;border-radius:9px;padding:6px 9px;font-size:12px}.divider{height:1px;background:var(--line)}.music-card{border-radius:18px;background:linear-gradient(145deg,#302b50,#6f61a6);padding:16px;color:#fff;position:relative;overflow:hidden}.music-card:after{content:"♫";position:absolute;font-size:110px;right:3px;bottom:-39px;color:#ffffff12}.music-card h3{margin:0;font-size:14px;position:relative;z-index:1}.music-card p{font-size:11px;color:#d3cdef;margin:4px 0 12px;position:relative;z-index:1}.music-controls{display:flex;align-items:center;gap:10px;position:relative;z-index:1}.music-controls button{background:#ffffff20;color:#fff;border-radius:10px;width:31px;height:31px}.music-controls span{font-size:11px;color:#e5defe}.track-list{margin-top:10px;display:flex;flex-direction:column;gap:5px}.track{display:flex;align-items:center;gap:8px;font-size:11px;padding:7px 8px;border-radius:9px;color:#827b9b}.track.active{background:#f2efff;color:#6657bb}.track .track-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.track .duration{font-variant-numeric:tabular-nums}.page{display:none;flex:1;overflow:auto;padding:26px}.page.active{display:block}.page h2{margin:0 0 5px;font-size:23px}.page-intro{color:var(--muted);font-size:13px;margin:0 0 24px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:15px}.card h3{font-size:15px;margin:0 0 12px}.field{display:flex;flex-direction:column;gap:7px;margin:12px 0}.field label{font-size:12px;color:#77718e}.field input,.field textarea,.field select{width:100%;border:1px solid #e9e4f3;background:#fcfbff;border-radius:11px;padding:10px 12px;color:var(--ink)}.field textarea{min-height:100px;resize:vertical}.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.primary{background:#8172d8;color:white;border-radius:11px;padding:10px 15px}.secondary{background:#f1edfc;color:#7768c3;border-radius:11px;padding:10px 15px}.danger{background:#fff0f0;color:#c35f69;border-radius:10px;padding:7px 10px;font-size:12px}.list-item{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #f1edf7}.list-item:last-child{border:0}.list-item .grow{flex:1;min-width:0}.list-item strong{font-size:13px;display:block}.list-item small{font-size:11px;color:var(--muted)}.empty{padding:20px;text-align:center;color:#aaa3bc;font-size:12px}.range-line{display:grid;grid-template-columns:1fr 75px;align-items:center;gap:12px}.range-line input{width:100%;accent-color:var(--accent)}.note{font-size:11px;color:#9690a8;line-height:1.7}.toast{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);padding:9px 15px;border-radius:12px;background:#34304d;color:white;font-size:12px;box-shadow:var(--shadow);display:none;z-index:5;white-space:nowrap}.mobile-menu{display:none}
@keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:1100px){.app{grid-template-columns:210px minmax(300px,1fr);}.rightbar{display:none}.app.show-right{grid-template-columns:210px minmax(300px,1fr) 280px}.show-right .rightbar{display:flex}}
@media(max-width:720px){.app{height:100dvh;min-height:0;padding:0;display:block}.panel{border-radius:0;border:0;height:100dvh}.sidebar{display:none}.main{height:100dvh}.topbar{height:68px;flex-basis:68px;padding:12px 16px}.chat-scroll{padding:20px 14px}.bubble-wrap{max-width:82%}.composer{padding:12px}.rightbar{display:none!important}.page{padding:20px 15px}.mobile-menu{display:inline-grid;place-items:center}.top-actions .desktop-only{display:none}.field-row{grid-template-columns:1fr}.app.page-mode .main-chat{display:none}.app.page-mode .page{display:block;height:100dvh}.app.page-mode .topbar{display:none}.app.page-mode .mobile-page-head{display:flex}.mobile-page-head{display:none;padding:14px 16px;border-bottom:1px solid var(--line);align-items:center;gap:12px}.mobile-page-head button{background:#f1edff;color:#7768c3;border-radius:10px;padding:7px 10px}}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar panel">
    <div class="brand"><div class="logo">✦</div><div><h1>星笺</h1><small>YOUR WORD UNIVERSE</small></div></div>
    <div class="nav-label">工作台 WORKSPACE</div>
    <nav class="nav">
      <button class="active" data-page="chat"><span class="ico">▤</span>聊天</button>
      <button data-page="contacts"><span class="ico">♙</span>联系人</button>
      <button data-page="cards"><span class="ico">✧</span>字卡库</button>
      <button data-page="music"><span class="ico">♫</span>一起听歌</button>
      <button data-page="settings"><span class="ico">⚙</span>设置</button>
      <button data-page="profile"><span class="ico">☻</span>我的主页</button>
    </nav>
    <div class="sidebar-bottom"><div class="tip"><strong>✦ 给灵感一点回声</strong>把喜欢的句子放进字卡库，让每一次对话都遇见一点随机惊喜。</div><div class="profile-mini"><div class="avatar">🐈‍⬛</div><div><strong id="sidebarUser">昕</strong><small>今天也要好好生活</small></div></div></div>
  </aside>
  <main class="main panel">
    <header class="topbar"><div style="display:flex;align-items:center;gap:10px"><button class="icon-btn mobile-menu" id="mobileBack" title="菜单">☰</button><div><div class="eyebrow" id="topEyebrow">YOUR LITTLE UNIVERSE</div><h2 id="topTitle">和 黎宸 聊天</h2></div></div><div class="top-actions"><button class="icon-btn desktop-only" id="toggleRight" title="显示侧栏">☷</button><button class="icon-btn" id="clearChat" title="清空当前聊天">↺</button></div></header>
    <section class="main-chat" id="chatView" style="display:flex;flex:1;min-height:0;flex-direction:column">
      <div class="chat-scroll" id="chatMessages"><div class="date-pill">今天 · 星笺时刻</div></div>
      <div class="typing" id="typing">对方正在输入…</div>
      <div class="composer"><div class="composer-tools"><span class="tool-chip">✦ 字卡随机回复</span><span class="tool-chip" id="replyCountHint">1–2 条回复</span></div><div class="compose-box"><textarea id="messageInput" rows="1" placeholder="说点什么吧…（Enter 发送，Shift+Enter 换行）"></textarea><button class="send" id="sendBtn">发送 ↗</button></div></div>
    </section>
    <section class="page" id="pageView"></section>
    <div class="toast" id="toast"></div>
  </main>
  <aside class="rightbar panel" id="rightbar">
    <section><div class="section-head"><h3>联系人</h3><button class="mini-btn" id="addContactQuick">＋ 添加</button></div><div class="contact-list" id="contactList"></div></section>
    <div class="divider"></div>
    <section><div class="section-head"><h3>一起听歌</h3><button class="mini-btn" data-goto="music">打开</button></div><div class="music-card"><h3 id="musicNowTitle">晚风与星星</h3><p id="musicNowArtist">星笺音乐角 · 示例曲目</p><div class="music-controls"><button id="prevTrack" aria-label="上一首">|◀</button><button id="playTrack" aria-label="播放">▶</button><button id="nextTrack" aria-label="下一首">▶|</button><span id="musicTime">00:00 / 03:28</span></div></div><div class="track-list" id="miniTracks"></div><p class="note">提示：GitHub Pages 是静态托管，网易云歌单解析与音源播放需可用的第三方 API 或官方授权音源。这里先提供歌单管理与播放器界面。</p></section>
  </aside>
</div>
<script>
(() => {
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const STORAGE_KEY = 'xingjian-app-v1';
const defaults = {
 user:{name:'昕',bio:'把喜欢的句子，收藏成星星。',avatar:'🐈‍⬛'},
 contacts:[
  {id:'chen',name:'黎宸',avatar:'🌙',desc:'恒星不落，记忆相随',cards:['我在。慢慢说，我听着。','你不必把每件事都解释得很清楚。','今天也辛苦了，给自己一点时间。','恒星不落，记忆相随。','先别急着否定自己，再给自己一次机会。','如果累了，就靠一会儿。','你那些奇奇怪怪的想法，我愿意听。','不是做不到，只是还需要一点时间。']},
  {id:'mori',name:'森屿',avatar:'🌿',desc:'收集日常的微小快乐',cards:['今天有没有遇到一件小小的好事？','风吹过来的时候，感觉世界也慢了下来。','记得喝水，也记得休息。','生活不是每一天都要有答案。']},
  {id:'luna',name:'月见',avatar:'🐈',desc:'夜晚也有温柔的回声',cards:['晚安不是结束，是明天见。','今晚的月亮很适合许愿。','把烦恼写下来，它就不再那么庞大。']}
 ],
 cards:[
  {id:1,category:'温柔',text:'我在。慢慢说，我听着。'},
  {id:2,category:'温柔',text:'你不必把每件事都解释得很清楚。'},
  {id:3,category:'鼓励',text:'先别急着否定自己，再给自己一次机会。'},
  {id:4,category:'日常',text:'今天也要记得吃饭，别只顾着忙。'},
  {id:5,category:'浪漫',text:'恒星不落，记忆相随。'},
  {id:6,category:'陪伴',text:'如果累了，就靠一会儿。'},
  {id:7,category:'俏皮',text:'报告！你的专属小猫已上线。'},
  {id:8,category:'思考',text:'有些答案不必今天就找到。'},
  {id:9,category:'鼓励',text:'不是做不到，只是还需要一点时间。'},
  {id:10,category:'陪伴',text:'你那些奇奇怪怪的想法，我愿意听。'}
 ],
 settings:{minReplies:1,maxReplies:2,minDelay:500,maxDelay:1500,showTime:true},
 chats:{}, music:{playlistUrl:'',mode:'顺序',index:0,tracks:[{name:'晚风与星星',artist:'星笺示例曲目',duration:208},{name:'月亮邮差',artist:'星笺示例曲目',duration:184},{name:'蓝色恒星',artist:'星笺示例曲目',duration:231}]}
};
let state;
try{state={...defaults,...JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}')};state.user={...defaults.user,...state.user};state.settings={...defaults.settings,...state.settings};state.music={...defaults.music,...state.music};if(!state.contacts?.length)state.contacts=defaults.contacts;if(!state.cards)state.cards=defaults.cards;if(!state.chats)state.chats={};}catch(e){state=structuredClone(defaults)}
let currentContact=state.contacts[0]?.id||'chen', activePage='chat', typingTimer=null, toastTimer=null, fakePlaying=false, elapsed=0, ticker=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}
function contact(){return state.contacts.find(c=>c.id===currentContact)||state.contacts[0]}
function chat(){if(!state.chats[currentContact])state.chats[currentContact]=[{id:crypto.randomUUID?.()||String(Date.now()),from:'them',text:'欢迎来到星笺。你可以把喜欢的话收进字卡库，再来试试随机聊天。',time:Date.now()}];return state.chats[currentContact]}
function toast(msg){const t=$('#toast');t.textContent=msg;t.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.style.display='none',2300)}
function timeText(ts){return new Date(ts).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})}
function renderChat(){const c=contact();if(!c)return;$('#topTitle').textContent='和 '+c.name+' 聊天';$('#topEyebrow').textContent='YOUR LITTLE UNIVERSE';$('#replyCountHint').textContent=state.settings.minReplies+'–'+state.settings.maxReplies+' 条回复';const wrap=$('#chatMessages');wrap.innerHTML='<div class="date-pill">今天 · 星笺时刻</div>'+chat().map(m=>`<div class="message-row ${m.from==='me'?'mine':''}">${m.from==='me'?'':`<div class="avatar">${esc(c.avatar||'✦')}</div>`}<div class="bubble-wrap">${m.from==='me'?'':`<div class="sender">${esc(c.name)}</div>`}<div class="bubble">${esc(m.text)}</div>${state.settings.showTime?`<div class="time">${timeText(m.time)}</div>`:''}</div>${m.from==='me'?`<div class="avatar" style="background:linear-gradient(135deg,#c9c0f6,#f2cfe6)">${esc(state.user.avatar||'☻')}</div>`:''}</div>`).join('');wrap.scrollTop=wrap.scrollHeight}
function renderContacts(){const html=state.contacts.map(c=>`<div class="contact ${c.id===currentContact?'active':''}" data-contact="${esc(c.id)}"><div class="avatar">${esc(c.avatar||'✦')}</div><div class="contact-info"><strong>${esc(c.name)}</strong><small>${esc(c.desc||'字卡联系人')}</small></div><span class="status-dot"></span></div>`).join('')||'<div class="empty">还没有联系人，添加一个吧。</div>';$('#contactList').innerHTML=html;$('#contactList').querySelectorAll('[data-contact]').forEach(el=>el.onclick=()=>{currentContact=el.dataset.contact;renderContacts();renderChat();if(innerWidth<720)showPage('chat')})}
function showPage(page){activePage=page;$$('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#app').classList.toggle('page-mode',page!=='chat');$('#chatView').style.display=page==='chat'?'flex':'none';$('#pageView').classList.toggle('active',page!=='chat');if(page==='chat'){renderChat();$('#topTitle').textContent='和 '+(contact()?.name||'联系人')+' 聊天';return}renderPage()}
function renderPage(){const root=$('#pageView');const title={contacts:'联系人',cards:'字卡库',music:'一起听歌',settings:'设置',profile:'我的主页'}[activePage]||'星笺';$('#topTitle').textContent=title;$('#topEyebrow').textContent='MAKE IT YOURS';if(activePage==='contacts')root.innerHTML=`<h2>联系人</h2><p class="page-intro">管理你的聊天对象，每位联系人都可以拥有自己的字卡回复。</p><div class="card"><h3>添加联系人</h3><div class="field-row"><div class="field"><label>昵称</label><input id="newName" placeholder="例如：黎宸"></div><div class="field"><label>头像 Emoji</label><input id="newAvatar" value="🌙" maxlength="4"></div></div><div class="field"><label>个性签名</label><input id="newDesc" placeholder="写一句简介"></div><button class="primary" id="createContact">＋ 创建联系人</button></div><div class="card"><h3>我的联系人（${state.contacts.length}）</h3>${state.contacts.map(c=>`<div class="list-item"><div class="avatar">${esc(c.avatar||'✦')}</div><div class="grow"><strong>${esc(c.name)}</strong><small>${esc(c.desc||'暂无签名')}</small></div><button class="secondary" data-chat="${esc(c.id)}">聊天</button><button class="danger" data-delete="${esc(c.id)}">删除</button></div>`).join('')||'<div class="empty">暂无联系人</div>'}</div>`;
else if(activePage==='cards')root.innerHTML=`<h2>字卡库</h2><p class="page-intro">添加短句并分类。聊天时会从当前联系人的专属字卡与公共字卡中随机抽取。</p><div class="card"><h3>添加一张字卡</h3><div class="field-row"><div class="field"><label>分类</label><input id="cardCategory" placeholder="温柔 / 日常 / 鼓励" value="温柔"></div><div class="field"><label>应用范围</label><select id="cardScope"><option value="global">公共字卡</option>${state.contacts.map(c=>`<option value="${esc(c.id)}">${esc(c.name)} 专属</option>`).join('')}</select></div></div><div class="field"><label>字卡内容</label><textarea id="cardText" placeholder="写下一句想让对方随机说出的话…"></textarea></div><button class="primary" id="addCard">保存字卡</button></div><div class="card"><div class="section-head"><h3>已收录字卡（${state.cards.length}）</h3><span class="subtle">保存在当前浏览器</span></div>${state.cards.map(c=>`<div class="list-item"><div class="grow"><small>${esc(c.category||'未分类')} · ${c.scope?esc(state.contacts.find(x=>x.id===c.scope)?.name||'已删除联系人'):'公共字卡'}</small><strong>${esc(c.text)}</strong></div><button class="danger" data-card-delete="${c.id}">删除</button></div>`).join('')||'<div class="empty">字卡库空空的，添加第一张吧。</div>'}</div>`;
else if(activePage==='settings')root.innerHTML=`<h2>聊天设置</h2><p class="page-intro">调整随机回复数量、回复间隔与聊天显示。</p><div class="card"><h3>随机回复条数</h3><div class="field-row"><div class="field"><label>每次最少回复条数</label><input id="minReplies" type="number" min="1" max="10" value="${state.settings.minReplies}"></div><div class="field"><label>每次最多回复条数</label><input id="maxReplies" type="number" min="1" max="10" value="${state.settings.maxReplies}"></div></div><p class="note">最多 10 条。系统会在最少与最多之间随机决定本次回复条数。</p></div><div class="card"><h3>回复速度</h3><div class="field-row"><div class="field"><label>最快回复时间（毫秒）</label><input id="minDelay" type="number" min="0" max="60000" step="100" value="${state.settings.minDelay}"></div><div class="field"><label>最慢回复时间（毫秒）</label><input id="maxDelay" type="number" min="0" max="60000" step="100" value="${state.settings.maxDelay}"></div></div><p class="note">例如 500–1500 毫秒表示在 0.5 到 1.5 秒间随机等待。</p></div><div class="card"><h3>显示选项</h3><label style="display:flex;gap:9px;align-items:center;font-size:13px"><input id="showTime" type="checkbox" ${state.settings.showTime?'checked':''}> 显示消息时间</label><p></p><button class="primary" id="saveSettings">保存设置</button></div><div class="card"><h3>数据备份</h3><p class="note">导出字卡、联系人和设置为 JSON 文件。清除浏览器数据会导致本地内容丢失，请定期备份。</p><button class="secondary" id="exportData">导出 JSON 备份</button> <button class="secondary" id="importDataBtn">导入备份</button><input type="file" id="importData" accept="application/json" hidden></div>`;
else if(activePage==='music')root.innerHTML=`<h2>一起听歌</h2><p class="page-intro">整理想一起听的歌单。歌单链接导入在纯静态网页中受到跨域与平台接口限制。</p><div class="card"><h3>导入网易云歌单</h3><div class="field"><label>网易云歌单链接</label><input id="playlistUrl" value="${esc(state.music.playlistUrl||'')}" placeholder="粘贴 https://music.163.com/#/playlist?id=..."></div><button class="primary" id="importPlaylist">识别歌单链接</button><p class="note" id="importResult">当前为前端演示：会识别并保存链接，但不会绕过网易云的登录、版权、跨域或接口限制。若要自动读取歌名和播放音源，需要部署合规后端/API。</p></div><div class="card"><h3>播放器</h3><div class="music-card"><h3 id="pageNowTitle">${esc(state.music.tracks[state.music.index]?.name||'暂无歌曲')}</h3><p id="pageNowArtist">${esc(state.music.tracks[state.music.index]?.artist||'')}</p><div class="music-controls"><button id="pagePrev">|◀</button><button id="pagePlay">▶</button><button id="pageNext">▶|</button><span id="pageMusicTime">${formatTime(elapsed)} / ${formatTime(state.music.tracks[state.music.index]?.duration||0)}</span></div></div><div class="field-row"><div class="field"><label>播放模式</label><select id="playMode"><option ${state.music.mode==='顺序'?'selected':''}>顺序</option><option ${state.music.mode==='随机'?'selected':''}>随机</option><option ${state.music.mode==='单曲循环'?'selected':''}>单曲循环</option></select></div><div class="field"><label>添加曲目（演示）</label><input id="trackName" placeholder="歌名"></div></div><div class="field"><label>歌手（可选）</label><input id="trackArtist" placeholder="歌手名"></div><button class="secondary" id="addTrack">＋ 添加曲目</button><div id="fullTracks" style="margin-top:12px"></div><p class="note">当前歌曲列表是本地曲目清单。要播放真实音乐，请接入你有权使用的音源 URL 或官方 SDK；仅有歌单链接不等于可播放音源。</p></div>`;
else if(activePage==='profile')root.innerHTML=`<h2>我的主页</h2><p class="page-intro">把这里变成你喜欢的样子。</p><div class="card"><h3>个人资料</h3><div class="field-row"><div class="field"><label>昵称</label><input id="profileName" value="${esc(state.user.name)}"></div><div class="field"><label>头像 Emoji</label><input id="profileAvatar" value="${esc(state.user.avatar)}" maxlength="4"></div></div><div class="field"><label>个性签名</label><textarea id="profileBio">${esc(state.user.bio)}</textarea></div><button class="primary" id="saveProfile">保存资料</button></div><div class="card"><h3>关于星笺</h3><p class="note">星笺是一个由字卡驱动的轻量聊天网页。联系人、字卡、聊天记录和设置默认保存在此浏览器的 localStorage 中。它不会自动同步到其他设备。</p></div>`;
wirePage();renderMiniMusic()}
function wirePage(){const on=(id,fn)=>{const el=$('#'+id);if(el)el.onclick=fn};
on('createContact',()=>{const name=$('#newName').value.trim();if(!name)return toast('先给联系人起个昵称吧');const c={id:'c'+Date.now(),name,avatar:$('#newAvatar').value.trim()||'✦',desc:$('#newDesc').value.trim(),cards:[]};state.contacts.push(c);currentContact=c.id;save();renderContacts();renderPage();toast('联系人已创建')});
$$('[data-chat]').forEach(b=>b.onclick=()=>{currentContact=b.dataset.chat;renderContacts();showPage('chat')});
$$('[data-delete]').forEach(b=>b.onclick=()=>{const id=b.dataset.delete,c=state.contacts.find(x=>x.id===id);if(!c)return;if(!confirm(`确定删除联系人「${c.name}」？其聊天记录也会从本地数据中删除。`))return;state.contacts=state.contacts.filter(x=>x.id!==id);delete state.chats[id];if(currentContact===id)currentContact=state.contacts[0]?.id||'';save();renderContacts();renderPage();toast('联系人已删除')});
on('addCard',()=>{const text=$('#cardText').value.trim();if(!text)return toast('字卡内容不能为空');state.cards.unshift({id:Date.now(),category:$('#cardCategory').value.trim()||'未分类',text,scope:$('#cardScope').value==='global'?'':$('#cardScope').value});save();renderPage();toast('字卡已保存')});
$$('[data-card-delete]').forEach(b=>b.onclick=()=>{state.cards=state.cards.filter(c=>String(c.id)!==b.dataset.cardDelete);save();renderPage();toast('字卡已删除')});
on('saveSettings',()=>{let min=Math.max(1,Math.min(10,parseInt($('#minReplies').value)||1)),max=Math.max(1,Math.min(10,parseInt($('#maxReplies').value)||1));if(min>max)[min,max]=[max,min];let d1=Math.max(0,Math.min(60000,parseInt($('#minDelay').value)||0)),d2=Math.max(0,Math.min(60000,parseInt($('#maxDelay').value)||0));state.settings={minReplies:min,maxReplies:max,minDelay:Math.min(d1,d2),maxDelay:Math.max(d1,d2),showTime:$('#showTime').checked};save();renderPage();renderChat();toast('设置已保存')});
on('exportData',()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='xingjian-backup.json';a.click();URL.revokeObjectURL(a.href)});
on('importDataBtn',()=>$('#importData').click());on('importData',()=>{});const imp=$('#importData');if(imp)imp.onchange=async()=>{try{const data=JSON.parse(await imp.files[0].text());if(!data.contacts||!data.cards)throw Error();state={...defaults,...data};save();renderContacts();renderPage();toast('备份导入成功')}catch(e){toast('导入失败：文件格式不正确')}};
on('saveProfile',()=>{state.user.name=$('#profileName').value.trim()||'访客';state.user.avatar=$('#profileAvatar').value.trim()||'☻';state.user.bio=$('#profileBio').value.trim();$('#sidebarUser').textContent=state.user.name;save();toast('个人资料已保存')});
on('importPlaylist',()=>{const url=$('#playlistUrl').value.trim();if(!url)return toast('请先粘贴歌单链接');state.music.playlistUrl=url;save();let id=(url.match(/[?&]id=(\d+)/)||url.match(/playlist\/(\d+)/)||[])[1];$('#importResult').textContent=id?`已识别歌单 ID：${id}。链接已保存；静态网页暂时无法可靠读取该歌单曲目或音源。`:'链接已保存，但没有识别到常见的歌单 ID 格式。';toast('已保存歌单链接')});
on('addTrack',()=>{const name=$('#trackName').value.trim();if(!name)return toast('请填写歌名');state.music.tracks.push({name,artist:$('#trackArtist').value.trim()||'未知歌手',duration:0});save();renderPage();toast('曲目已添加')});
on('playMode',()=>{state.music.mode=$('#playMode').value;save();toast('播放模式：'+state.music.mode)});
$$('#pagePrev,#pageNext,#pagePlay').forEach(b=>b.onclick=()=>{if(b.id==='pagePrev')stepTrack(-1);else if(b.id==='pageNext')stepTrack(1);else togglePlay();renderPage()});
$$('[data-delete-track]').forEach(b=>b.onclick=()=>{state.music.tracks.splice(Number(b.dataset.deleteTrack),1);state.music.index=Math.max(0,Math.min(state.music.index,state.music.tracks.length-1));save();renderPage()});
}
function formatTime(sec){sec=Math.max(0,Math.floor(sec||0));return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
function renderMiniMusic(){const tracks=state.music.tracks||[];const idx=Math.min(state.music.index||0,Math.max(0,tracks.length-1));state.music.index=idx;const t=tracks[idx];$('#musicNowTitle').textContent=t?.name||'暂无歌曲';$('#musicNowArtist').textContent=t?.artist||'添加曲目以开始';$('#musicTime').textContent=formatTime(elapsed)+' / '+formatTime(t?.duration||0);$('#miniTracks').innerHTML=tracks.slice(0,3).map((x,i)=>`<div class="track ${i===idx?'active':''}" data-mini-track="${i}"><span>♫</span><span class="track-name">${esc(x.name)}</span><span class="duration">${formatTime(x.duration)}</span></div>`).join('');$$('[data-mini-track]').forEach(el=>el.onclick=()=>{state.music.index=Number(el.dataset.miniTrack);elapsed=0;save();renderMiniMusic();renderPage()})}
function stepTrack(dir){const tracks=state.music.tracks;if(!tracks.length)return;if(state.music.mode==='单曲循环'){elapsed=0;return}if(state.music.mode==='随机'&&tracks.length>1){let n;do{n=Math.floor(Math.random()*tracks.length)}while(n===state.music.index);state.music.index=n}else state.music.index=(state.music.index+dir+tracks.length)%tracks.length;elapsed=0;save();renderMiniMusic()}
function togglePlay(){fakePlaying=!fakePlaying;$('#playTrack').textContent=fakePlaying?'Ⅱ':'▶';if(ticker)clearInterval(ticker);if(fakePlaying){ticker=setInterval(()=>{const t=state.music.tracks[state.music.index];if(!t)return;if(t.duration>0&&elapsed>=t.duration){if(state.music.mode==='单曲循环')elapsed=0;else stepTrack(1)}else elapsed++;renderMiniMusic();const pageTime=$('#pageMusicTime');if(pageTime)pageTime.textContent=formatTime(elapsed)+' / '+formatTime(state.music.tracks[state.music.index]?.duration||0)},1000)}}
function send(){const input=$('#messageInput'),text=input.value.trim();if(!text)return;chat().push({id:String(Date.now()),from:'me',text,time:Date.now()});input.value='';input.style.height='auto';save();renderChat();const typing=$('#typing');typing.style.display='block';const delay=state.settings.minDelay+Math.random()*(state.settings.maxDelay-state.settings.minDelay);clearTimeout(typingTimer);typingTimer=setTimeout(()=>{typing.style.display='none';const pool=[...state.cards.filter(c=>!c.scope||c.scope===currentContact).map(c=>c.text),...(contact()?.cards||[])];if(!pool.length)pool.push('我在听。','再多跟我说一点吧。');const min=state.settings.minReplies,max=state.settings.maxReplies,count=Math.floor(Math.random()*(max-min+1))+min;const chosen=[];for(let i=0;i<count;i++)chosen.push(pool[Math.floor(Math.random()*pool.length)]);chosen.forEach((reply,i)=>chat().push({id:String(Date.now()+i),from:'them',text:reply,time:Date.now()+i}));save();renderChat()},delay)}
$('#sendBtn').onclick=send;$('#messageInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});$('#messageInput').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,110)+'px'});
$('#clearChat').onclick=()=>{if(confirm('清空当前联系人的聊天记录？')){state.chats[currentContact]=[];save();renderChat();toast('聊天记录已清空')}};
$$('.nav button').forEach(b=>b.onclick=()=>showPage(b.dataset.page));$$('[data-goto]').forEach(b=>b.onclick=()=>showPage(b.dataset.goto));
$('#addContactQuick').onclick=()=>showPage('contacts');$('#toggleRight').onclick=()=>$('#app').classList.toggle('show-right');
$('#mobileBack').onclick=()=>{if(activePage!=='chat')showPage('chat');else showPage('contacts')};
$('#prevTrack').onclick=()=>{stepTrack(-1);renderMiniMusic()};$('#nextTrack').onclick=()=>{stepTrack(1);renderMiniMusic()};$('#playTrack').onclick=togglePlay;
$('#sidebarUser').textContent=state.user.name;renderContacts();renderChat();renderMiniMusic();save();
})();
</script>
</body>
</html>
