<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>字卡聊天站 V3</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%234CBF78'/%3E%3Cpath d='M20 30c0-9 5-15 12-15s12 6 12 15-5 15-12 15c-2 0-4-.4-5.6-1.1L20 46l1.6-6A13 13 0 0 1 20 30z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@600;700;900&family=Noto+Sans+SC:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#dfe6de;--panel:#f6f8f5;--panel-2:#eef2ec;--ink:#23332b;--ink-soft:#6b7a72;--ink-faint:#9aa89f;--green:#4cbf78;--green-deep:#2e9c5f;--green-soft:#bfe8cf;--accent:#e88f5a;--bubble-in:#fff;--line:rgba(35,51,43,.08);--shadow:0 18px 50px rgba(35,51,43,.18)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:"Noto Sans SC",-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:radial-gradient(1200px 800px at 85% -10%,rgba(76,191,120,.16),transparent 60%),radial-gradient(1000px 700px at -10% 110%,rgba(232,143,90,.14),transparent 55%),var(--bg);overflow:hidden}
.stage{height:100dvh;display:flex;align-items:center;justify-content:center}
.app{position:relative;width:100%;max-width:480px;height:100dvh;background:var(--panel);display:flex;flex-direction:column;box-shadow:var(--shadow);overflow:hidden}
@media(min-width:560px){body{padding:26px 16px}.stage{height:calc(100dvh - 52px)}.app{height:calc(100dvh - 52px);border-radius:28px}}

/* ===== 顶栏 ===== */
.topbar{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:14px 16px 12px;background:linear-gradient(180deg,#eef5ef,#f4f8f4);border-bottom:1px solid var(--line);position:relative;z-index:5}
.person{display:flex;align-items:center;gap:12px;min-width:0}
.avatar{width:44px;height:44px;border-radius:50%;flex:0 0 auto;overflow:hidden;box-shadow:0 4px 10px rgba(35,51,43,.12)}
.avatar svg{width:100%;height:100%;display:block}
.person-txt{min-width:0}
.person-name{font-family:"Noto Serif SC",serif;font-weight:700;font-size:17px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;box-shadow:0 0 0 3px rgba(76,191,120,.18)}
.person-sub{font-size:12px;color:var(--ink-soft);margin-top:1px;white-space:nowrap}
.page-title{font-family:"Noto Serif SC",serif;font-weight:700;font-size:18px}
.page-sub{font-size:12px;color:var(--ink-soft);margin-top:1px}
.top-actions{margin-left:auto;display:flex;gap:8px}
.iconbtn{width:40px;height:40px;border:none;background:transparent;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--ink);cursor:pointer;transition:.18s}
.iconbtn:active{background:rgba(76,191,120,.14);transform:scale(.92)}
.iconbtn svg{width:21px;height:21px}
.seg{display:flex;background:rgba(76,191,120,.1);border-radius:12px;padding:3px;gap:3px}
.seg button{border:none;background:transparent;color:var(--ink-soft);font-size:13px;padding:6px 16px;border-radius:9px;cursor:pointer}
.seg button.on{background:#fff;color:var(--green-deep);font-weight:600;box-shadow:0 1px 4px rgba(35,51,43,.12)}

/* ===== 视图 ===== */
.content{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;position:relative}
.view{display:none;flex-direction:column;height:100%;min-height:0}
.view.active{display:flex}

/* ===== 聊天 ===== */
.chat{flex:1 1 auto;overflow-y:auto;padding:16px 14px 8px;scroll-behavior:smooth;background:radial-gradient(600px 400px at 10% 0%,rgba(191,232,207,.4),transparent 60%),var(--panel-2)}
.day-tag{text-align:center;margin:6px 0 14px}.day-tag span{font-size:11px;color:var(--ink-soft);background:rgba(35,51,43,.06);padding:4px 12px;border-radius:999px}
.msg{display:flex;gap:10px;margin-bottom:14px;align-items:flex-end;animation:bubble .28s ease both}
@keyframes bubble{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.msg .mini-avatar{width:34px;height:34px;border-radius:50%;flex:0 0 auto;overflow:hidden;box-shadow:0 2px 6px rgba(35,51,43,.14)}.msg .mini-avatar svg{width:100%;height:100%;display:block}
.msg.me{flex-direction:row-reverse}.msg-row{max-width:76%;display:flex;flex-direction:column}
.msg-row .meta{font-size:10px;color:var(--ink-faint);margin:3px 6px 0;order:2}.msg.me .msg-row{align-items:flex-end}.msg.me .meta{text-align:right}
.bubble{position:relative;padding:10px 13px;border-radius:16px;font-size:15px;line-height:1.55;word-break:break-word;white-space:pre-wrap;box-shadow:0 2px 6px rgba(35,51,43,.06)}
.bubble::before{content:"";position:absolute;bottom:10px;width:9px;height:9px;transform:rotate(45deg)}
.msg.them .bubble{background:var(--bubble-in);border-top-left-radius:4px;order:1}.msg.them .bubble::before{left:-4px;background:var(--bubble-in)}
.msg.me .bubble{background:linear-gradient(135deg,var(--green),var(--green-deep));color:#fff;border-top-right-radius:4px;order:1}.msg.me .bubble::before{right:-4px;background:var(--green-deep)}
.cat-tag{font-size:10px;color:var(--green-deep);background:var(--green-soft);padding:1px 8px;border-radius:999px;margin:0 0 5px 2px;order:0;align-self:flex-start}.msg.me .cat-tag{align-self:flex-end;margin:0 2px 5px 0}
.typing .bubble{padding:11px 14px}.typing .dots{display:flex;gap:4px;align-items:center}.typing .dots i{width:7px;height:7px;border-radius:50%;background:var(--ink-soft);animation:bounce 1.2s infinite}.typing .dots i:nth-child(2){animation-delay:.18s}.typing .dots i:nth-child(3){animation-delay:.36s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-5px);opacity:1}}
.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--ink-soft);text-align:center;padding:0 30px}.empty .big{font-size:13px;line-height:1.9;max-width:300px}
.inputbar{flex:0 0 auto;padding:10px 12px calc(12px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);display:flex;align-items:flex-end;gap:8px}
.plus{flex:0 0 auto;width:40px;height:40px;border:none;border-radius:50%;background:var(--panel-2);color:var(--green-deep);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.18s}.plus:active{transform:scale(.92);background:var(--green-soft)}.plus svg{width:22px;height:22px}
.in-wrap{flex:1 1 auto;display:flex;align-items:flex-end;background:var(--panel-2);border-radius:22px;padding:6px 12px;min-height:44px}
.in-wrap textarea{flex:1;border:none;outline:none;background:transparent;resize:none;font-family:inherit;font-size:16px;line-height:1.5;color:var(--ink);max-height:120px;min-height:30px;padding:3px 0}
.send{flex:0 0 auto;height:40px;min-width:72px;border:none;border-radius:20px;background:linear-gradient(135deg,var(--green),var(--green-deep));color:#fff;font-size:14px;font-weight:600;cursor:pointer;transition:.18s;display:flex;align-items:center;justify-content:center}.send:active{transform:scale(.95)}.send:disabled{opacity:.45;cursor:not-allowed}

/* ===== 联系人 ===== */
.contacts{flex:1 1 auto;overflow-y:auto;padding:10px 14px 20px;background:var(--panel-2)}
.contact{display:flex;align-items:center;gap:13px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;cursor:pointer;transition:.16s;margin-bottom:10px}.contact:active{transform:scale(.98);background:#f4f8f4}
.contact .mini-avatar{width:46px;height:46px;border-radius:50%;overflow:hidden;box-shadow:0 3px 8px rgba(35,51,43,.13);flex:0 0 auto}.contact .mini-avatar svg{width:100%;height:100%;display:block}
.contact-info{flex:1;min-width:0}.contact-name{font-size:15px;font-weight:600}.contact-sub{font-size:12px;color:var(--ink-soft);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.contact-active{flex:0 0 auto;font-size:11px;color:var(--green-deep);background:var(--green-soft);padding:3px 10px;border-radius:999px}
.contact-go{flex:0 0 auto;color:var(--ink-faint)}

/* ===== 我：主页 ===== */
.me-scroll{flex:1 1 auto;overflow-y:auto;padding:10px 14px 24px;background:var(--panel-2)}
.profile-card{background:linear-gradient(135deg,#eef7f0,#f6f1ea);border:1px solid var(--line);border-radius:20px;padding:20px 18px;display:flex;align-items:center;gap:14px;margin-bottom:12px}
.profile-card .big-avatar{width:62px;height:62px;border-radius:50%;overflow:hidden;box-shadow:0 5px 14px rgba(35,51,43,.18);flex:0 0 auto}.profile-card .big-avatar svg{width:100%;height:100%;display:block}
.profile-name{font-family:"Noto Serif SC",serif;font-size:19px;font-weight:700}
.profile-bio{font-size:12px;color:var(--ink-soft);margin-top:4px;line-height:1.5}
.stats{display:flex;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 0;margin-bottom:12px}
.stat{flex:1;text-align:center}
.stat b{font-size:18px;font-family:"Noto Serif SC",serif;color:var(--green-deep);display:block}
.stat span{font-size:11px;color:var(--ink-soft)}
.menu{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:12px}
.menu-row{display:flex;align-items:center;gap:13px;padding:14px 16px;cursor:pointer;border-top:1px solid var(--line)}
.menu-row:first-child{border-top:none}
.menu-row:active{background:var(--panel-2)}
.menu-ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;flex:0 0 auto}
.menu-ic svg{width:19px;height:19px}
.menu-label{flex:1;font-size:14px}
.menu-sub{font-size:11px;color:var(--ink-faint)}
.menu-go{color:var(--ink-faint)}
.mode-badge{font-size:11px;color:var(--green-deep);background:var(--green-soft);padding:2px 9px;border-radius:999px}

/* ===== 设置 ===== */
.settings{flex:1 1 auto;overflow-y:auto;padding:10px 14px 24px;background:var(--panel-2)}
.card-group{background:#fff;border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden}
.cg-title{font-size:13px;color:var(--ink-soft);padding:12px 14px 6px}
.set-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}.set-row:first-child{border-top:none}
.set-label{flex:0 0 auto;font-size:14px}.set-hint{font-size:11px;color:var(--ink-faint);margin-top:2px}
.set-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex:0 0 auto}
.num{width:64px;border:1px solid var(--line);background:#fff;border-radius:10px;font-family:inherit;font-size:16px;text-align:center;padding:7px 6px;outline:none;color:var(--ink)}
.range-sep{color:var(--ink-faint);font-size:13px}
.color-dot{width:32px;height:32px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer;position:relative;overflow:hidden}.color-dot input{position:absolute;inset:0;opacity:0;cursor:pointer}
.set-text{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;font-family:inherit;font-size:16px;padding:9px 12px;outline:none;color:var(--ink)}
.btn-line{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:10px;color:var(--ink-soft);font-size:13px;padding:8px 12px;cursor:pointer}.btn-line:active{background:var(--panel-2)}

/* ===== 一起听歌 ===== */
.music{flex:1 1 auto;overflow-y:auto;padding:12px 14px 20px;background:var(--panel-2)}
.m-import{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px}
.m-import textarea{width:100%;border:none;outline:none;background:var(--panel-2);border-radius:10px;font-family:inherit;font-size:16px;padding:10px 12px;resize:none;min-height:74px;line-height:1.5;color:var(--ink)}
.m-hint{font-size:11px;color:var(--ink-faint);margin-top:6px}
.m-import-btn{margin-top:10px;display:flex;gap:8px}
.m-import-btn button{flex:1;border:none;border-radius:10px;padding:10px;font-size:14px;font-weight:600;cursor:pointer}
.m-do{background:linear-gradient(135deg,var(--green),var(--green-deep));color:#fff}
.m-clear{border:1px solid var(--line);background:#fff;color:var(--ink-soft)}
.m-vip-line{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.vip-toggle{border:1px solid var(--line);background:#fff;color:var(--ink-soft);font-size:13px;padding:7px 14px;border-radius:999px;cursor:pointer;transition:.15s;flex:0 0 auto}
.vip-toggle.on{background:linear-gradient(135deg,var(--green),var(--green-deep));border-color:var(--green);color:#fff;font-weight:600}
.m-vhint{font-size:11px;color:var(--ink-faint);flex:1;min-width:150px}
.track-vip{font-size:9px;color:#c2620f;background:#ffe6cc;padding:1px 6px;border-radius:6px;margin-left:7px;vertical-align:1px}
.queue{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:12px}
.q-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}
.q-head h3{font-size:14px;font-weight:600}
.q-modes{display:flex;gap:6px}
.q-modes button{border:1px solid var(--line);background:#fff;color:var(--ink-soft);font-size:12px;padding:5px 11px;border-radius:999px;cursor:pointer}.q-modes button.on{background:var(--green);border-color:var(--green);color:#fff}
.track{display:flex;align-items:center;gap:11px;padding:10px 14px;border-top:1px solid var(--line);cursor:pointer}
.track:first-child{border-top:none}.track:active{background:var(--panel-2)}
.track.cur{background:rgba(76,191,120,.08)}
.track-num{width:22px;height:22px;flex:0 0 auto;border-radius:8px;background:var(--panel-2);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--ink-soft)}
.track.cur .track-num{background:var(--green);color:#fff}
.track-info{flex:1;min-width:0}
.track-title{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track-artist{font-size:11px;color:var(--ink-soft);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track-dur{flex:0 0 auto;font-size:12px;color:var(--ink-soft)}
.track-del{flex:0 0 auto;width:28px;height:28px;border:none;background:transparent;color:var(--ink-faint);cursor:pointer;border-radius:8px;display:flex;align-items:center;justify-content:center}.track-del:active{color:var(--accent)}
.track-del svg{width:16px;height:16px}
/* 播放条 */
.m-now{flex:0 0 auto;background:#fff;border-top:1px solid var(--line);padding:10px 14px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
.m-now-title{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.m-now-artist{font-size:11px;color:var(--ink-soft)}
.progress{display:flex;align-items:center;gap:9px}
.progress .time{font-size:11px;color:var(--ink-soft);width:34px;text-align:center}
.pbar{flex:1;height:5px;background:var(--panel-2);border-radius:3px;overflow:hidden;cursor:pointer;position:relative}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--green-deep));border-radius:3px}
.controls{display:flex;align-items:center;justify-content:center;gap:26px;padding-top:4px}
.ctl{width:46px;height:46px;border:none;background:var(--panel-2);border-radius:50%;color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.16s}.ctl:active{transform:scale(.92);background:var(--green-soft)}
.ctl svg{width:22px;height:22px}
.ctl.main{width:60px;height:60px;background:linear-gradient(135deg,var(--green),var(--green-deep));color:#fff;box-shadow:0 6px 16px rgba(46,156,95,.35)}
.ctl.main svg{width:26px;height:26px}

/* ===== 底部导航 ===== */
.tabbar{flex:0 0 auto;display:flex;background:#fff;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border:none;background:transparent;color:var(--ink-faint);font-size:11px;cursor:pointer;border-radius:12px;transition:.16s}.tab svg{width:22px;height:22px}
.tab.on{color:var(--green-deep);font-weight:600;background:rgba(76,191,120,.08)}

/* ===== 字卡库抽屉 ===== */
.drawer{position:fixed;inset:auto 0 0 0;max-height:86dvh;background:var(--panel);border-radius:24px 24px 0 0;box-shadow:0 -10px 40px rgba(35,51,43,.25);transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;z-index:30;padding:10px 0 0}
.drawer.open{transform:none}
.drag{width:44px;height:5px;border-radius:3px;background:rgba(35,51,43,.14);margin:0 auto 4px}
.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:8px 18px 4px;gap:10px}
.drawer-head h2{font-family:"Noto Serif SC",serif;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drawer-head .count{font-size:12px;color:var(--ink-soft);font-family:"Noto Sans SC";white-space:nowrap}
.drawer-close{width:34px;height:34px;border:none;background:transparent;color:var(--ink-soft);cursor:pointer;border-radius:10px;display:flex;align-items:center;justify-content:center}.drawer-close:active{background:var(--panel-2)}.drawer-close svg{width:20px;height:20px}
.drawer-body{flex:1 1 auto;overflow-y:auto;padding:10px 16px 20px}
.d-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:#fff;color:var(--ink-soft);font-size:12px;padding:6px 12px;border-radius:999px;cursor:pointer;transition:.15s}.chip.on{background:var(--green);border-color:var(--green);color:#fff;font-weight:500}
.group{margin-bottom:16px}.group-title{font-size:12px;color:var(--ink-faint);margin-bottom:8px;display:flex;align-items:center;gap:8px}.group-title::after{content:"";flex:1;height:1px;background:var(--line)}
.cards{display:flex;flex-direction:column;gap:8px}
.card{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;animation:cardin .2s ease both}
@keyframes cardin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card .txt{flex:1;font-size:14px;line-height:1.5;min-width:0;word-break:break-word}
.card .del{flex:0 0 auto;width:30px;height:30px;border:none;background:transparent;color:var(--ink-faint);cursor:pointer;border-radius:8px;display:flex;align-items:center;justify-content:center}.card .del:active{background:rgba(232,143,90,.12);color:var(--accent)}.card .del svg{width:17px;height:17px}
.add-box{background:#fff;border:1.5px dashed rgba(76,191,120,.5);border-radius:14px;padding:12px}
.add-box textarea{width:100%;border:none;outline:none;background:var(--panel-2);border-radius:10px;font-family:inherit;font-size:16px;padding:10px 12px;resize:none;min-height:88px;line-height:1.5;color:var(--ink)}
.add-hint{font-size:11px;color:var(--ink-faint);margin-top:6px}
.add-meta{display:flex;gap:8px;align-items:center;margin-top:10px}
.add-meta select{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;font-family:inherit;font-size:14px;color:var(--ink);padding:9px 10px;outline:none}
.add-btn{border:none;border-radius:10px;background:linear-gradient(135deg,var(--green),var(--green-deep));color:#fff;font-size:14px;font-weight:600;padding:9px 18px;cursor:pointer;transition:.18s;white-space:nowrap}.add-btn:active{transform:scale(.95)}
.add-cat-add{flex:0 0 auto;width:40px;border:1px solid var(--line);background:#fff;border-radius:10px;color:var(--green-deep);cursor:pointer;font-size:20px}
.backdrop{position:fixed;inset:0;background:rgba(35,51,43,.34);opacity:0;pointer-events:none;transition:opacity .3s;z-index:20}.backdrop.show{opacity:1;pointer-events:auto}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(8px);background:rgba(35,51,43,.88);color:#fff;font-size:13px;padding:9px 16px;border-radius:12px;opacity:0;transition:.25s;z-index:40;pointer-events:none}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(min-width:560px){.drawer{inset:auto 0;left:auto;top:0;right:0;height:100%;max-height:100%;width:360px;border-radius:0 24px 24px 0}.drag{display:none}}
</style>
</head>
<body>
<div class="stage">
  <div class="app">
    <header class="topbar" id="topbar"></header>

    <main class="content">
      <!-- 聊天 -->
      <section class="view active" id="view-chat">
        <div class="chat" id="chat"></div>
        <footer class="inputbar">
          <button class="plus" id="btnPlus" aria-label="打开字卡库"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
          <div class="in-wrap"><textarea id="input" rows="1" placeholder="对字卡酱说点什么…" enterkeyhint="send"></textarea></div>
          <button class="send" id="btnSend">发送</button>
        </footer>
      </section>
      <!-- 联系人 -->
      <section class="view" id="view-contacts"><div class="contacts" id="contacts"></div></section>
      <!-- 我：主页/设置 -->
      <section class="view" id="view-me">
        <div class="me-scroll" id="meScroll"></div>
      </section>
      <!-- 一起听歌 -->
      <section class="view" id="view-music">
        <div class="music" id="music"></div>
        <div class="m-now" id="nowBar"></div>
      </section>
    </main>

    <nav class="tabbar" id="tabbar"></nav>
  </div>
</div>

<div class="backdrop" id="backdrop"></div>
<aside class="drawer" id="drawer" aria-label="字卡库">
  <div class="drag"></div>
  <div class="drawer-head">
    <h2 id="drawerTitle">我的字卡库</h2>
    <span class="count" id="cardCount">0 张字卡</span>
    <button class="drawer-close" id="btnClose" aria-label="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="drawer-body">
    <div class="d-actions" id="catChips"></div>
    <div id="groups"></div>
    <div class="add-box">
      <textarea id="newCard" rows="3" placeholder="在这里写一句字卡酱要回复的话…（每行一条，可一次粘贴多条）"></textarea>
      <div class="add-hint">每行视为一条字卡，可一次添加多条</div>
      <div class="add-meta">
        <select id="newCat"></select>
        <button class="add-cat-add" id="btnNewCat" aria-label="新建分类" title="新建分类">+</button>
        <button class="add-btn" id="btnAdd">添加字卡</button>
      </div>
    </div>
  </div>
</aside>
<div class="toast" id="toast"></div>

<script>
/* ================= 数据与持久化 ================= */
const LS_KEY = "zikaChatV3";
const SEED_PARTNERS = [
  {id:"zika",name:"字卡酱",sub:"随机回复 · 你的专属话搭子",c1:"#6bd08f",c2:"#2e9c5f",cards:{"开场问候":["你好呀，想我了吗？","嗨～终于等到你上线","今天过得怎么样？","见到你真开心～","嘘……我一直在这里等你哦"],"日常回应":["真的吗？好有意思！","嗯嗯，然后呢？","你说得对诶，我也是这么想的","哇，这听起来好棒！","哈哈，被你逗笑了","我也这么觉得！"],"小惊喜":["偷偷告诉你，我今天想你了","送你一颗小星星","你就是我的小幸运","现在，是只属于你的时刻～","世界那么大，还是想和你聊天"]}},
  {id:"happy",name:"快乐搭子",sub:"整天哈哈哈的损友",c1:"#7cc0ff",c2:"#3f8fe0",cards:{"打招呼":["嗨嗨嗨！来啦来啦","哟，终于想起我了？","大驾光临，有失远迎","来了来了，聊起来！"],"接话":["哈哈哈哈笑死我了","真的假的，这也太逗了","我笑到隔壁来敲门","懂你，接着唠！","你这是要笑飞我"],"整活":["今天要不要整点活？","赌一个，你能说赢我","打赌输了请奶茶","给你比个大拇指"]}},
  {id:"tender",name:"温柔知己",sub:"轻声细语的暖心人",c1:"#f3a6c0",c2:"#e069a0",cards:{"问候":["你今天好吗？想听听你的近况","忙一天了吧，先歇会儿","我一直都在，随时找我","想你了，就来说句话吧"],"关心":["累的时候就多休息，别硬撑","记得按时吃饭，照顾好自己","你做的已经很好了","在我这里，你可以不用逞强"],"晚安":["夜深了，早点睡","愿你有个好梦，晚安","明天也会顺利的","我在这儿陪你说到睡"]}}
];
const DEFAULT_SETTINGS = {delayMin:1,delayMax:3,countMin:1,countMax:1,userName:"我",myC1:"#f0a97a",myC2:"#e47a5a",userBio:"这是我能帮你查到任何东西的地方",excludeVip:false};

let partners,settings,onCatsMap,histories,activeId;
function load(){ try{ const s=JSON.parse(localStorage.getItem(LS_KEY)); if(s&&s.partners){ partners=s.partners; settings=Object.assign({},DEFAULT_SETTINGS,s.settings); onCatsMap=s.onCatsMap||{}; histories=s.histories||{}; activeId=s.activeId||partners[0].id; return; } }catch(e){} partners=JSON.parse(JSON.stringify(SEED_PARTNERS)); settings=Object.assign({},DEFAULT_SETTINGS); onCatsMap={};histories={};activeId=partners[0].id; }
function save(){ localStorage.setItem(LS_KEY,JSON.stringify({partners,settings,onCatsMap,histories,activeId})); }
function partnerById(id){return partners.find(p=>p.id===id)}
function activePartner(){return partnerById(activeId)}
function catsOf(p){return Object.keys(p.cards)}
function onCats(id){if(!onCatsMap[id])onCatsMap[id]=catsOf(partnerById(id));return onCatsMap[id]}

/* ================= 工具 ================= */
function timeNow(){const d=new Date();return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}
function rand(a,b){return a+Math.random()*(b-a)}
function randInt(a,b){a=Math.ceil(a);b=Math.floor(b);return Math.floor(Math.random()*(b-a+1))+a}
function esc(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function avatarSvg(c1,c2){return '<svg viewBox="0 0 64 64"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="'+c1+'"/><stop offset="1" stop-color="'+c2+'"/></linearGradient></defs><rect width="64" height="64" fill="url(#g)"/><circle cx="32" cy="26" r="9" fill="#fff" opacity=".95"/><path d="M14 52c2-10 10-15 18-15s16 5 18 15z" fill="#fff" opacity=".95"/></svg>'}
let toastTimer;function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("show"),2200)}

/* ================= 路由 ================= */
const VIEWS={chat:"view-chat",contacts:"view-contacts",me:"view-me",music:"view-music"};
let meView="profile";
function route(){
  const raw=location.hash.replace(/^#\/?/,"");const parts=raw.split("/").filter(Boolean);
  const tab=VIEWS[parts[0]]?parts[0]:(parts[0]==="me"?"me":"chat");
  if(tab==="me") meView = parts[1]==="settings"?"settings":"profile";
  Object.values(VIEWS).forEach(id=>document.getElementById(id).classList.toggle("active",id===VIEWS[tab]));
  renderTopbar();renderTabbar();
  if(tab==="chat")renderChat();
  if(tab==="contacts")renderContacts();
  if(tab==="me")renderMe();
  if(tab==="music")renderMusic();
  if(tab==="chat")document.getElementById("chat").scrollTop=document.getElementById("chat").scrollHeight;
}
window.addEventListener("hashchange",route);
function go(tab){ location.hash="/"+tab; }

/* ================= 顶栏 ================= */
function renderTopbar(){
  const t=document.getElementById("topbar");
  const raw=location.hash.replace(/^#\/?/,"");const parts=raw.split("/").filter(Boolean);const tab=VIEWS[parts[0]]?parts[0]:"chat";
  if(tab==="chat"){
    const p=activePartner();
    t.innerHTML='<div class="person"><div class="avatar">'+avatarSvg(p.c1,p.c2)+'</div><div class="person-txt"><div class="person-name"><span class="status-dot"></span>'+esc(p.name)+'</div><div class="person-sub">'+esc(p.sub)+'</div></div></div><div class="top-actions"><button class="iconbtn" id="btnMusic" aria-label="一起听歌" title="一起听歌"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V6l10-2v11"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="15" r="2.5"/></svg></button><button class="iconbtn" id="btnClear" aria-label="清空对话" title="清空对话"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M9 7V5h6v2M7 7l1 12h8l1-12M10 11v5M14 11v5"/></svg></button><button class="iconbtn" id="btnOpen" aria-label="字卡库" title="字卡库"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h7v14H4zM13 5h7v8h-7z"/></svg></button></div>';
    t.querySelector("#btnMusic").addEventListener("click",()=>go("music"));
    t.querySelector("#btnClear").addEventListener("click",()=>{histories[activeId]=[];save();renderChat();toast("对话已清空")});
    t.querySelector("#btnOpen").addEventListener("click",openDrawer);
  }else if(tab==="contacts"){
    t.innerHTML='<div class="person-txt"><div class="page-title">联系人</div><div class="page-sub">选择要聊天的人</div></div>';
  }else if(tab==="music"){
    t.innerHTML='<div class="person-txt"><div class="page-title">一起听歌</div><div class="page-sub">导入网易云歌曲 / 歌单</div></div><div class="top-actions"><button class="iconbtn" id="btnBack" aria-label="返回"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button></div>';
    t.querySelector("#btnBack").addEventListener("click",()=>{ if(histories[activeId]&&histories[activeId].length) go("chat"); else go("me"); });
  }else{
    t.innerHTML='<div class="person-txt"><div class="page-title">我</div><div class="page-sub" style="margin-top:4px"><div class="seg" id="seg"><button data-v="profile" class="'+(meView==="profile"?"on":"")+'">主页</button><button data-v="settings" class="'+(meView==="settings"?"on":"")+'">设置</button></div></div></div>';
    t.querySelectorAll("#seg button").forEach(b=>b.addEventListener("click",()=>{ meView=b.dataset.v; location.hash="/me/"+(meView==="settings"?"settings":""); route(); }));
  }
}

/* ================= 底部导航 ================= */
function renderTabbar(){
  const bar=document.getElementById("tabbar");const raw=location.hash.replace(/^#\/?/,"");const parts=raw.split("/").filter(Boolean);const tab=VIEWS[parts[0]]?parts[0]:"chat";
  const tabs=[
    {id:"chat",label:"聊天",icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v12H9l-5 4z"/></svg>'},
    {id:"contacts",label:"联系人",icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.4"/><path d="M3.5 19c.8-3.4 3-5 5.5-5s4.7 1.6 5.5 5M16 5.5a3 3 0 0 1 0 5.6M17 14c1.7.7 2.7 2.2 3.2 4.4"/></svg>'},
    {id:"me",label:"我",icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c1-4.2 3.7-6 7-6s6 1.8 7 6"/></svg>'}
  ];
  bar.innerHTML=tabs.map(t=>'<button class="tab'+(tab===t.id?" on":"")+'" data-v="'+t.id+'">'+t.icon+'<span>'+t.label+'</span></button>').join("");
  bar.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{ go(b.dataset.v); route(); }));
}

/* ================= 聊天 ================= */
const chatEl=document.getElementById("chat");
function renderChat(){
  chatEl.innerHTML='';
  const d=document.createElement("div");d.className="day-tag";d.innerHTML='<span>今天</span>';chatEl.appendChild(d);
  const list=histories[activeId]||[];
  if(list.length===0){const p=activePartner();const e=document.createElement("div");e.className="empty";e.innerHTML='<div style="font-family:Noto Serif SC,serif;font-size:15px;color:var(--ink)">开始和 '+esc(p.name)+' 聊天吧</div><div class="big">在下方输入一句话发送，'+esc(p.name)+' 会从它的字卡库里随机抽卡回复你。<br>点右上角打开「字卡库」增删属于它的句子。</div>';chatEl.appendChild(e);return;}
  list.forEach(m=>{const p=partnerById(m.pid)||activePartner();const row=document.createElement("div");row.className="msg "+m.side;
    const av=document.createElement("div");av.className="mini-avatar";av.innerHTML=m.side==="me"?avatarSvg(settings.myC1,settings.myC2):avatarSvg(p.c1,p.c2);
    const col=document.createElement("div");col.className="msg-row";
    if(m.cat&&m.side==="them"){const t=document.createElement("span");t.className="cat-tag";t.textContent=m.cat;col.appendChild(t)}
    const b=document.createElement("div");b.className="bubble";b.textContent=m.text;
    const meta=document.createElement("span");meta.className="meta";meta.textContent=m.time;
    col.appendChild(b);col.appendChild(meta);row.appendChild(av);row.appendChild(col);chatEl.appendChild(row)});
}
function scrollBottom(){requestAnimationFrame(()=>{chatEl.scrollTop=chatEl.scrollHeight})}
function showTyping(){const row=document.createElement("div");row.className="msg them typing";row.id="typing";const p=activePartner();const av=document.createElement("div");av.className="mini-avatar";av.innerHTML=avatarSvg(p.c1,p.c2);const col=document.createElement("div");col.className="msg-row";const b=document.createElement("div");b.className="bubble";b.innerHTML='<span class="dots"><i></i><i></i><i></i></span>';col.appendChild(b);row.appendChild(av);row.appendChild(col);chatEl.appendChild(row);scrollBottom()}
function hideTyping(){const t=document.getElementById("typing");if(t)t.remove()}
let lastPick={};
function pickCard(pid){const p=partnerById(pid);const on=onCats(pid);const pool=[];Object.keys(p.cards).forEach(c=>{if(on.indexOf(c)>=0)p.cards[c].forEach(w=>pool.push({text:w,cat:c}))});if(pool.length===0)return{text:"（这个人的字卡库还没有可用的句子，去字卡库添几句吧）",cat:null};let pick=pool[Math.floor(Math.random()*pool.length)];let g=0;while(pick.text===(lastPick[pid]||null)&&pool.length>1&&g<8){pick=pool[Math.floor(Math.random()*pool.length)];g++}lastPick[pid]=pick.text;return pick}
let busy=false;
function send(text){
  if(busy)return;busy=true;if(!histories[activeId])histories[activeId]=[];histories[activeId].push({side:"me",text,time:timeNow()});renderChat();scrollBottom();save();
  const el=document.getElementById("input");if(el)el.value="";autoGrow();updateSend();
  showTyping();
  const delay=rand(settings.delayMin,settings.delayMax)*1000;const count=randInt(settings.countMin,settings.countMax);
  setTimeout(()=>{hideTyping();let i=0;const sendOne=()=>{if(i>=count){busy=false;save();return}const p=pickCard(activeId);histories[activeId].push({side:"them",text:p.text,cat:p.cat,time:timeNow()});renderChat();scrollBottom();i++;if(i<count)setTimeout(sendOne,350+Math.random()*300);else{busy=false;save()}};sendOne();},delay);
}
const input=document.getElementById("input"),sendBtn=document.getElementById("btnSend");
function autoGrow(){input.style.height="auto";input.style.height=Math.min(input.scrollHeight,120)+"px"}
function canSend(){return input.value.trim().length>0&&!busy}
function updateSend(){sendBtn.disabled=!canSend()}
input.addEventListener("input",()=>{updateSend();autoGrow()});
input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();if(canSend())send(input.value.trim())}});
sendBtn.addEventListener("click",()=>{if(canSend())send(input.value.trim())});

/* ================= 联系人 ================= */
function renderContacts(){
  const el=document.getElementById("contacts");el.innerHTML="";
  partners.forEach(p=>{const r=document.createElement("div");r.className="contact";r.dataset.pid=p.id;
    const av=document.createElement("div");av.className="mini-avatar";av.innerHTML=avatarSvg(p.c1,p.c2);
    const info=document.createElement("div");info.className="contact-info";
    const nm=document.createElement("div");nm.className="contact-name";nm.textContent=p.name;
    const sub=document.createElement("div");sub.className="contact-sub";sub.textContent=p.sub+" · "+(histories[p.id]||[]).length+" 条消息";
    info.appendChild(nm);info.appendChild(sub);
    const badge=document.createElement("span");
    if(p.id===activeId){badge.className="contact-active";badge.textContent="正在聊天"}else{badge.className="contact-go";badge.innerHTML='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>'}
    r.appendChild(av);r.appendChild(info);r.appendChild(badge);
    r.addEventListener("click",()=>{activeId=p.id;save();go("chat");route()});el.appendChild(r)});
}

/* ================= 我：主页 & 设置 ================= */
function totalCards(){let n=0;partners.forEach(p=>Object.values(p.cards).forEach(a=>n+=a.length));return n}
function totalMsg(){let n=0;partners.forEach(p=>n+=(histories[p.id]||[]).length);return n}
function menuIc(bg,svg){return '<span class="menu-ic" style="background:'+bg+'">'+svg+'</span>'}
function renderMe(){
  const el=document.getElementById("meScroll");el.innerHTML="";
  if(meView==="profile"){
    const card=document.createElement("div");card.className="profile-card";
    card.innerHTML='<div class="big-avatar">'+avatarSvg(settings.myC1,settings.myC2)+'</div><div style="flex:1;min-width:0"><div class="profile-name">'+esc(settings.userName)+'</div><div class="profile-bio">'+esc(settings.userBio||"")+'</div></div>';
    const st=document.createElement("div");st.className="stats";
    st.innerHTML='<div class="stat"><b>'+partners.length+'</b><span>联系人</span></div><div class="stat"><b>'+totalMsg()+'</b><span>消息</span></div><div class="stat"><b>'+totalCards()+'</b><span>字卡</span></div>';
    const menu=document.createElement("div");menu.className="menu";
    menu.innerHTML=
      '<div class="menu-row" data-a="music">'+menuIc("linear-gradient(135deg,#7cc0ff,#3f8fe0)",'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V6l10-2v11"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="15" r="2.5"/></svg>')+'<div class="menu-label">一起听歌</div><div class="menu-sub" id="musicBadge">歌单 '+playlist.length+' 首</div><span class="menu-go"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></span></div>'+
      '<div class="menu-row" data-a="edit">'+menuIc("linear-gradient(135deg,#f3a6c0,#e069a0)",'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>')+'<div class="menu-label">编辑资料</div><div class="menu-sub">修改昵称、头像、个性签名</div><span class="menu-go"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></span></div>'+
      '<div class="menu-row" data-a="settings">'+menuIc("linear-gradient(135deg,#b7a7f0,#7b68d8)",'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3.9a7 7 0 0 0-2-1.2L14.3 3h-4.6L9 5.6a7 7 0 0 0-2 1.2l-2.3-.9-2 3.4 2 1.5A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.5 2 3.4 2.3-.9a7 7 0 0 0 2 1.2l.9 2.6h4.6l.9-2.6a7 7 0 0 0 2-1.2l2.3.9 2-3.4-2-1.5c.1-.4.1-.8.1-1.2z"/></svg>')+'<div class="menu-label">设置</div><div class="menu-sub">回复速度、条数、字卡</div><span class="menu-go"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></span></div>'+
      '<div class="menu-row" data-a="reset">'+menuIc("linear-gradient(135deg,#e88f5a,#d96a3f)",'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V5h6v2M7 7l1 12h8l1-12M10 11v5M14 11v5"/></svg>')+'<div class="menu-label">清空所有数据</div><div class="menu-sub">恢复出厂设置</div><span class="menu-go"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></span></div>';
    const ver=document.createElement("div");ver.style.cssText="text-align:center;font-size:11px;color:var(--ink-faint);padding:6px 0 2px";ver.textContent="版本 V3 · 多页面 + 一起听歌";
    el.appendChild(card);el.appendChild(st);el.appendChild(menu);el.appendChild(ver);
    menu.querySelector('[data-a="music"]').addEventListener("click",()=>go("music"));
    menu.querySelector('[data-a="edit"]').addEventListener("click",()=>{editProfile()});
    menu.querySelector('[data-a="settings"]').addEventListener("click",()=>{meView="settings";location.hash="/me/settings";route()});
    menu.querySelector('[data-a="reset"]').addEventListener("click",()=>{if(!confirm("将清空所有联系人字卡、对话与设置，确定吗？"))return;localStorage.removeItem(LS_KEY);load();musicReset();route();openDrawer();renderAll();toast("已恢复默认")});
  }else{
    renderSettingsInto(el);
  }
}
function editProfile(){
  const name=prompt("我的昵称：",settings.userName);if(name===null)return;if(name.trim())settings.userName=name.trim().slice(0,14);
  const bio=prompt("个性签名：",settings.userBio||"");if(bio!==null)settings.userBio=bio.slice(0,40);
  save();renderMe();toast("资料已更新");
}

/* ===== 设置 ===== */
let setEls={};
function renderSettingsInto(el){
  el.innerHTML='';
  el.appendChild(groupEl("回复速度",'<div class="set-row"><div class="set-label">最快回复<span class="set-hint" style="display:block">对方最快要等几秒</span></div><div class="set-right"><input class="num" id="st-delayMin" type="number" min="0.3" max="30" step="0.1" value="'+settings.delayMin+'"><span class="range-sep">秒</span></div></div><div class="set-row"><div class="set-label">最慢回复<span class="set-hint" style="display:block">对方最慢等几秒</span></div><div class="set-right"><input class="num" id="st-delayMax" type="number" min="0.3" max="30" step="0.1" value="'+settings.delayMax+'"><span class="range-sep">秒</span></div></div><div class="set-row"><div class="set-label">最少条数<span class="set-hint" style="display:block">一次最少回几句</span></div><div class="set-right"><input class="num" id="st-countMin" type="number" min="1" max="10" step="1" value="'+settings.countMin+'"><span class="range-sep">条</span></div></div><div class="set-row"><div class="set-label">最多条数<span class="set-hint" style="display:block">一次最多回几句</span></div><div class="set-right"><input class="num" id="st-countMax" type="number" min="1" max="10" step="1" value="'+settings.countMax+'"><span class="range-sep">条</span></div></div>'));
  el.appendChild(groupEl("我的资料",'<div class="set-row"><div class="set-label">我的昵称</div><div class="set-right" style="width:120px"><input class="set-text" id="st-name" value="'+esc(settings.userName)+'"></div></div><div class="set-row"><div class="set-label">个性签名</div><div class="set-right" style="width:150px"><input class="set-text" id="st-bio" value="'+esc(settings.userBio||"")+'"></div></div><div class="set-row"><div class="set-label">头像配色</div><div class="set-right"><label class="color-dot" style="background:'+settings.myC1+'"><input type="color" id="st-c1" value="'+settings.myC1+'"></label><label class="color-dot" style="background:'+settings.myC2+'"><input type="color" id="st-c2" value="'+settings.myC2+'"></label></div></div>'));
  el.appendChild(groupEl("字卡库",'<div class="set-row"><div class="set-label">当前对象<span class="set-hint" style="display:block">字卡库归属</span></div><div class="set-right"><span style="font-size:13px;color:var(--green-deep);font-weight:600">'+esc(activePartner().name)+'</span></div></div>'));
  setEls={delayMin:el.querySelector("#st-delayMin"),delayMax:el.querySelector("#st-delayMax"),countMin:el.querySelector("#st-countMin"),countMax:el.querySelector("#st-countMax"),name:el.querySelector("#st-name"),bio:el.querySelector("#st-bio"),c1:el.querySelector("#st-c1"),c2:el.querySelector("#st-c2")};
  Object.values(setEls).forEach(x=>{x.addEventListener("change",applySettings);x.addEventListener("input",e=>{if(e.target.type==="color")applySettings()})});
}
function groupEl(title,html){const g=document.createElement("div");g.className="card-group";const t=document.createElement("div");t.className="cg-title";t.textContent=title;const b=document.createElement("div");b.innerHTML=html;g.appendChild(t);g.appendChild(b);return g}
function applySettings(){
  let dm=parseFloat(setEls.delayMin.value)||1,dx=parseFloat(setEls.delayMax.value)||3,cn=parseInt(setEls.countMin.value)||1,cx=parseInt(setEls.countMax.value)||1;
  dm=Math.max(0.3,Math.min(30,dm));dx=Math.max(0.3,Math.min(30,dx));cn=Math.max(1,Math.min(10,cn));cx=Math.max(1,Math.min(10,cx));
  if(dm>dx)dm=dx;if(cn>cx)cn=cx;
  settings.delayMin=dm;settings.delayMax=dx;settings.countMin=cn;settings.countMax=cx;
  settings.userName=setEls.name.value.trim()||"我";settings.userBio=setEls.bio.value.slice(0,40);settings.myC1=setEls.c1.value;settings.myC2=setEls.c2.value;
  setEls.delayMin.value=dm;setEls.delayMax.value=dx;setEls.countMin.value=cn;setEls.countMax.value=cx;
  save();if(currentTab()==="chat")renderChat();
}
function currentTab(){const r=location.hash.replace(/^#\/?/,"");const p=r.split("/").filter(Boolean);return VIEWS[p[0]]?p[0]:"chat"}

/* ================= 一起听歌 ================= */
let playlist=[],plIndex=-1,plMode="sequential";let audio;
function musicReset(){try{audio&&audio.pause()}catch(e){}playlist=[];plIndex=-1}
function fmtTime(s){if(!isFinite(s)||s<=0)return "0:00";s=Math.round(s);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function playSrc(id){return "https://music.163.com/song/media/outer/url?id="+id+".mp3"}
async function fetchVia(url){const strategies=[
  ()=>fetch("https://r.jina.ai/"+encodeURIComponent(url),{headers:{"Accept":"text/plain","X-Return-Format":"text"}}),
  ()=>fetch("https://api.allorigins.win/raw?url="+encodeURIComponent(url)),
  ()=>fetch("https://corsproxy.io/?url="+encodeURIComponent(url)),
  ()=>fetch("https://cors.eu.org/"+url),
  ()=>fetch(url)
];for(const s of strategies){try{const r=await s();if(r.ok){const t=await r.text();const clean=t.replace(/^```(json)?\s*/,"").replace(/\s*```$/,"");try{return JSON.parse(clean)}catch(e){continue}}}catch(e){}}throw new Error("api-unreachable")}
function isVipSong(s){return s.fee>0||(s.privilege&&s.privilege.st>0)}
function addSong(id){if(playlist.find(t=>t.id===id)){toast("已在歌单中");return}playlist.push({id,title:"歌曲 #"+id,artist:"正在获取…",dur:0,vip:false});renderMusic();toast("已加入歌曲 #"+id);
  fetchVia("https://music.163.com/api/v3/song/detail?id="+id+"&ids=["+id+"]").then(d=>{const s=d.songs&&d.songs[0];if(!s)return;const t=playlist.find(x=>x.id===id);if(!t)return;t.title=s.name;t.artist=(s.ar||[]).map(a=>a.name).join(" / ");t.dur=Math.round((s.dt||0)/1000);t.vip=isVipSong(s);if(settings.excludeVip&&t.vip){const i=playlist.indexOf(t);playlist.splice(i,1);toast("已跳过VIP歌曲："+t.title)}renderMusic()}).catch(()=>{})
}
async function resolvePlaylist(id){
  toast("正在读取歌单…");
  let ids=[];
  try{
    const d=await fetchVia("https://music.163.com/api/v6/playlist/detail?id="+id+"&n=1000");
    ids=((d.playlist&&d.playlist.trackIds)||[]).map(t=>t.id);
  }catch(e){toast("歌单信息读取失败：当前网络访问不了网易云接口（可尝试换网络/开代理），或改用手动逐首添加");return}
  if(!ids.length){toast("歌单为空或解析不到歌曲");return}
  let added=0,skipped=0;
  try{
    const meta=await fetchVia("https://music.163.com/api/v3/song/detail?ids="+encodeURIComponent("["+ids.slice(0,1000).join(",")+"]"));
    (meta.songs||[]).forEach(s=>{if(playlist.find(x=>x.id===s.id))return;const vip=isVipSong(s);if(settings.excludeVip&&vip){skipped++;return}playlist.push({id:s.id,title:s.name||"歌曲 #"+s.id,artist:(s.ar||[]).map(a=>a.name).join(" / "),dur:Math.round((s.dt||0)/1000),vip});added++});
  }catch(e){
    ids.slice(0,1000).forEach(iid=>{if(playlist.find(x=>x.id===iid))return;playlist.push({id:iid,title:"歌曲 #"+iid,artist:"",dur:0,vip:false});added++});
  }
  renderMusic();
  toast(added>0?("已导入歌单 "+added+" 首"+(skipped>0?("，跳过VIP "+skipped+" 首"):"")):"歌单为空或读取失败");
}
function parseLink(l){
  const pl=l.match(/(?:playlist\?id=|playlist\/|#\/playlist\?id=)(\d+)/);
  const so=l.match(/(?:song\?id=|song\/|#\/song\?id=|song\/media\/outer\/url\?id=)(\d+)/);
  if(pl)resolvePlaylist(pl[1]);else if(so)addSong(so[1]);else if(/^\d+$/.test(l.trim()))addSong(l.trim());else toast("无法识别链接");
}
function importLinks(raw){const lines=raw.split("\n").map(s=>s.trim()).filter(Boolean);if(!lines.length){toast("先粘贴链接");return}lines.forEach(parseLink)}
function playIndex(i){
  if(!playlist.length)return;plIndex=((i%playlist.length)+playlist.length)%playlist.length;
  const t=playlist[plIndex];if(!audio)audio=new Audio();
  audio.src=playSrc(t.id);audio.play().catch(()=>{});renderMusic();
}
function playPause(){if(!playlist.length){toast("歌单为空，先导入歌曲");return}if(!audio||audio.paused)playIndex(plIndex<0?0:plIndex);else{audio.pause();renderMusic()}}
function nextTrack(){if(!playlist.length)return;let ni;if(plMode==="random")ni=randInt(0,playlist.length-1);else if(plMode==="single")ni=plIndex<0?0:plIndex;else ni=plIndex<0?0:(plIndex+1)%playlist.length;playIndex(ni)}
function prevTrack(){if(!playlist.length)return;const ni=plIndex<0?0:(plIndex-1+playlist.length)%playlist.length;playIndex(ni)}

function renderMusic(){
  const el=document.getElementById("music");
  const importHtml='<div class="m-import"><textarea id="mInput" rows="3" placeholder="粘贴网易云歌曲或歌单链接，每行一个…"></textarea><div class="m-hint">支持：音乐链接 music.163.com/song?id=… / 歌单链接 music.163.com/playlist?id=… / 纯歌曲ID</div><div class="m-import-btn"><button class="m-do" id="mImport">导入</button><button class="m-clear" id="mClear">清空歌单</button></div><div class="m-vip-line"><button class="vip-toggle'+(settings.excludeVip?" on":"")+'" id="vipToggle">去除VIP歌曲</button><span class="m-vhint">'+(settings.excludeVip?"已开启：导入时自动跳过VIP/付费歌曲":"已关闭：保留所有歌曲（VIP歌曲仅能试听约30秒）")+'</span></div></div>';
  const qhead='<div class="q-head"><h3>播放列表（'+playlist.length+'）</h3><div class="q-modes"><button class="'+(plMode==="sequential"?"on":"")+'" data-m="sequential">顺序</button><button class="'+(plMode==="random"?"on":"")+'" data-m="random">随机</button><button class="'+(plMode==="single"?"on":"")+'" data-m="single">单曲</button></div></div>';
  let q='';
  if(!playlist.length){q='<div class="empty" style="height:120px"><div class="big">歌单还是空的。粘贴一首网易云歌曲或歌单链接试试。</div></div>'}else{
    playlist.forEach((t,i)=>{q+='<div class="track'+(i===plIndex?" cur":"")+'" data-i="'+i+'"><span class="track-num">'+(i+1)+'</span><div class="track-info"><div class="track-title">'+esc(t.title)+(t.vip?'<span class="track-vip">VIP</span>':'')+'</div><div class="track-artist">'+esc(t.artist)+'</div></div><span class="track-dur">'+fmtTime(t.dur)+'</span><button class="track-del" data-del="'+i+'" aria-label="删除"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>'});
  }
  el.innerHTML=importHtml+'<div class="queue">'+qhead+q+'</div>';
  el.querySelector("#mImport").addEventListener("click",()=>{const v=document.getElementById("mInput").value;document.getElementById("mInput").value="";importLinks(v)});
  el.querySelector("#mClear").addEventListener("click",()=>{musicReset();renderMusic()});
  const vt=el.querySelector("#vipToggle");if(vt)vt.addEventListener("click",()=>{
    settings.excludeVip=!settings.excludeVip;save();
    if(settings.excludeVip){const removed=playlist.filter(t=>t.vip).length;playlist=playlist.filter(t=>!t.vip);if(removed)toast("已移除 "+removed+" 首VIP歌曲");}
    renderMusic();
  });
  el.querySelectorAll(".q-modes button").forEach(b=>b.addEventListener("click",()=>{plMode=b.dataset.m;renderMusic()}));
  el.querySelectorAll(".track").forEach(r=>r.addEventListener("click",e=>{if(e.target.closest(".track-del"))return;playIndex(parseInt(r.dataset.i))}));
  el.querySelectorAll(".track-del").forEach(b=>b.addEventListener("click",()=>{const i=parseInt(b.dataset.del);playlist.splice(i,1);if(plIndex>=playlist.length)plIndex=playlist.length-1;if(plIndex===i)audio&&audio.pause();renderMusic()}));
  renderNowBar();
  const badge=document.getElementById("musicBadge");if(badge)badge.textContent="歌单 "+playlist.length+" 首";
}
function renderNowBar(){
  const bar=document.getElementById("nowBar");
  const t=playlist[plIndex>=0?plIndex:0];
  if(!t){bar.innerHTML='<div class="m-now-title" style="color:var(--ink-faint)">尚未播放 · 从上方导入歌曲或歌单</div><div class="controls"><span class="ctl" style="background:transparent;visibility:hidden"></span><button class="ctl main" id="np-main"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button><span class="ctl" style="background:transparent;visibility:hidden"></span></div>';bindNow(bar);return}
  const playing=audio&&!audio.paused;
  const cur=audio?audio.currentTime:0;const dur=t.dur||(audio&&audio.duration)||0;
  bar.innerHTML='<div class="m-now-title">'+esc(t.title)+'</div><div class="m-now-artist">'+esc(t.artist)+'</div><div class="progress"><span class="time">'+fmtTime(cur)+'</span><div class="pbar" id="pbar"><i id="pfill"></i></div><span class="time">'+fmtTime(dur)+'</span></div><div class="controls"><button class="ctl" id="np-prev"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM20 6l-9 6 9 6z"/></svg></button><button class="ctl main" id="np-main">'+(playing?'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>':'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>')+'</button><button class="ctl" id="np-next"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM4 6l9 6-9 6z"/></svg></button></div>';
  if(playing&&audio&&audio.duration&&t.dur){const pct=(audio.currentTime/audio.duration)*100;bar.querySelector("#pfill").style.width=pct+"%";}
  bar.querySelector("#pbar").addEventListener("click",e=>{if(!audio||!audio.duration)return;const r=e.currentTarget.getBoundingClientRect();audio.currentTime=((e.clientX-r.left)/r.width)*audio.duration});
  bindNow(bar);
}
function bindNow(bar){
  const m=bar.querySelector("#np-main");if(m)m.addEventListener("click",playPause);
  const pv=bar.querySelector("#np-prev");if(pv)pv.addEventListener("click",prevTrack);
  const nx=bar.querySelector("#np-next");if(nx)nx.addEventListener("click",nextTrack);
}
function initAudio(){
  if(!audio)audio=new Audio();
  audio.addEventListener("timeupdate",()=>{renderNowBar()});
  audio.addEventListener("loadedmetadata",()=>{const t=playlist[plIndex];if(t&&!t.dur&&audio.duration)t.dur=Math.round(audio.duration);renderMusic()});
  audio.addEventListener("ended",()=>{nextTrack()});
}
/* ================= 字卡库 ================= */
const drawer=document.getElementById("drawer"),backdrop=document.getElementById("backdrop");
const groupsEl=document.getElementById("groups"),chipsEl=document.getElementById("catChips");
const countEl=document.getElementById("cardCount"),catSelect=document.getElementById("newCat");
function totalCount(){const c=activePartner().cards;return Object.keys(c).reduce((s,k)=>s+c[k].length,0)}
function renderCatSelect(){catSelect.innerHTML="";catsOf(activePartner()).forEach(c=>{const o=document.createElement("option");o.value=c;o.textContent=c;catSelect.appendChild(o)})}
function renderChips(){chipsEl.innerHTML="";catsOf(activePartner()).forEach(c=>{const chip=document.createElement("button");chip.className="chip"+(onCats(activeId).indexOf(c)>=0?" on":"");chip.textContent=c+" "+(activePartner().cards[c]||[]).length;chip.addEventListener("click",()=>{const a=onCats(activeId);const i=a.indexOf(c);i>=0?a.splice(i,1):a.push(c);save();renderChips()});chipsEl.appendChild(chip)})}
function renderGroups(){groupsEl.innerHTML="";const c=activePartner().cards;catsOf(activePartner()).forEach(cat=>{const list=c[cat];if(!list||!list.length)return;const g=document.createElement("div");g.className="group";const t=document.createElement("div");t.className="group-title";t.textContent=cat;const cw=document.createElement("div");cw.className="cards";list.forEach((w,i)=>{const cd=document.createElement("div");cd.className="card";const txt=document.createElement("div");txt.className="txt";txt.textContent=w;const del=document.createElement("button");del.className="del";del.setAttribute("aria-label","删除");del.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';del.addEventListener("click",()=>{list.splice(i,1);save();renderAll()});cd.appendChild(txt);cd.appendChild(del);cw.appendChild(cd)});g.appendChild(t);g.appendChild(cw);groupsEl.appendChild(g)})}
function renderAll(){document.getElementById("drawerTitle").textContent="字卡库 · "+activePartner().name;renderChips();renderGroups();renderCatSelect();countEl.textContent=totalCount()+" 张字卡"}
function openDrawer(){renderAll();drawer.classList.add("open");backdrop.classList.add("show")}
function closeDrawer(){drawer.classList.remove("open");backdrop.classList.remove("show")}
const newCard=document.getElementById("newCard");
function addCards(){const lines=newCard.value.split(/\n/).map(s=>s.trim()).filter(Boolean);if(!lines.length){toast("先写几句话吧");return}const cat=catSelect.value;if(!activePartner().cards[cat])activePartner().cards[cat]=[];lines.forEach(w=>activePartner().cards[cat].push(w));newCard.value="";save();renderAll();toast("已添加 "+lines.length+" 条到「"+cat+"」")}
document.getElementById("btnAdd").addEventListener("click",addCards);
newCard.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.metaKey&&!e.ctrlKey){e.preventDefault();addCards()}});
document.getElementById("btnNewCat").addEventListener("click",()=>{const name=prompt("新分类名称：");if(!name||!name.trim())return;const c=name.trim().slice(0,12);const p=activePartner();if(p.cards[c]){toast("这个分类已存在");return}p.cards[c]=[];onCats(activeId).push(c);save();renderAll();catSelect.value=c;toast("已新建分类「"+c+"」")});

/* ================= 入口 ================= */
function init(){
  load();initAudio();
  document.getElementById("btnPlus").addEventListener("click",openDrawer);
  document.getElementById("btnClose").addEventListener("click",closeDrawer);
  backdrop.addEventListener("click",closeDrawer);
  route();updateSend();scrollBottom();
  if(!histories[activeId]||histories[activeId].length===0){
    const greet="你好呀，我是 "+activePartner().name+"～我把开场白留在了「"+catsOf(activePartner())[0]+"」里，你可以从右上角打开字卡库随意增改，我只会用你写下的句子回复你哦。";
    setTimeout(()=>{if(!histories[activeId])histories[activeId]=[];histories[activeId].push({side:"them",text:greet,time:timeNow()});renderChat();scrollBottom();save()},300);
  }
}
init();
</script>
