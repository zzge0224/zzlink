<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>字卡聊天 · 增强版</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2307C160'/%3E%3Cpath d='M14 22a6 6 0 0 1 6-6h24a6 6 0 0 1 6 6v16a6 6 0 0 1-6 6H28l-9 7v-7h-5a6 6 0 0 1-6-6z' fill='white'/%3E%3C/svg%3E">
<style>
/* ============================================================
   字卡聊天 · 微信风格 · 移动优先 · 增强版
   ============================================================ */
:root{
  --bg:#EDEDED; --page:#F6F6F6; --card:#FFFFFF;
  --green:#07C160; --green-d:#06AD56;
  --bubble-me:#95EC69; --bubble-bot:#FFFFFF;
  --text:#191919; --text2:#8A8A8A; --text3:#BFBFBF;
  --line:#E7E7E7; --danger:#FA5151; --like:#FA5151;
  --input-bg:#F1F2F5; --sheet-bg:#F7F8FA; --hover:#F1F3F7; --track:#E5E8EE; --frame:#E4E4E8;
  --nav-h:48px; --tab-h:56px;
  --radius:12px;
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC","Segoe UI",Roboto,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--font);font-size:15px;color:var(--text);background:var(--frame);overflow:hidden}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
input{font-family:inherit;border:none;outline:none}
::-webkit-scrollbar{width:0;height:0}

/* ---------- 手机外框 ---------- */
#app{
  position:relative;max-width:430px;margin:0 auto;height:100dvh;
  background:var(--page);overflow:hidden;display:flex;flex-direction:column;
}
@media (min-width:560px){
  body{display:flex;align-items:center;justify-content:center}
  #app{height:calc(100dvh - 32px);max-height:920px;border-radius:26px;
    box-shadow:0 18px 60px rgba(0,0,0,.22),0 2px 8px rgba(0,0,0,.08);
    border:1px solid rgba(255,255,255,.25)}
}

/* ---------- 状态栏（仅桌面外框显示） ---------- */
.statusbar{display:none}
@media (min-width:560px){
  .statusbar{display:flex;align-items:center;justify-content:space-between;
    height:26px;padding:0 18px;flex-shrink:0;font-size:12px;font-weight:600;color:#111}
  .statusbar .sb-right{display:flex;align-items:center;gap:6px}
  .statusbar svg{display:block}
}

/* ---------- 视图系统 ---------- */
.view{position:absolute;inset:0;z-index:10;display:none;flex-direction:column;background:var(--page)}
.view.active{display:flex;animation:viewIn .22s ease}
@keyframes viewIn{from{opacity:.4;transform:translateX(14px)}to{opacity:1;transform:none}}
#view-chat.active{animation:chatIn .2s ease}
@keyframes chatIn{from{transform:translateX(60px);opacity:.6}to{transform:none;opacity:1}}
.body{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
body:not(.no-tab) .view .body{padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom))}
body.no-tab .tabbar{display:none}
@media (min-width:560px){ .view{top:26px} }

/* ---------- 导航栏 ---------- */
.nav{height:var(--nav-h);flex-shrink:0;display:flex;align-items:center;gap:4px;
  padding:0 10px;background:var(--card);border-bottom:1px solid var(--line);z-index:5}
.nav h1{flex:1;font-size:17px;font-weight:600;text-align:center;letter-spacing:.5px}
.nav .nav-title-left{flex:1;font-size:17px;font-weight:600;padding-left:4px}
.nav .nav-right{display:flex;gap:4px}
.nav-title-center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;min-width:0}
.nav-title-center h1{font-size:16px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.chat-head-sub{font-size:11px;color:var(--text2);margin-top:1px;display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.chat-head-sub i{font-style:normal;color:var(--text3)}
.icon-btn{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;
  border-radius:50%;color:#111;transition:background .15s}
.icon-btn:active{background:rgba(0,0,0,.06)}
.icon-btn svg{width:22px;height:22px}

/* ---------- 底部标签栏 ---------- */
.tabbar{flex-shrink:0;margin-top:auto;height:calc(var(--tab-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);background:var(--card);
  border-top:1px solid var(--line);display:flex;z-index:20;position:relative}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--text2);font-size:10.5px;letter-spacing:.5px}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--green)}

/* ---------- 通用列表行 ---------- */
.cell{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--card);
  border-bottom:1px solid var(--line);cursor:pointer;transition:background .12s}
.cell:active{background:var(--hover)}
.cell-main{flex:1;min-width:0}
.cell-title{font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell-sub{font-size:12.5px;color:var(--text2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell-tail{font-size:11px;color:var(--text3);flex-shrink:0}
.cell-arrow{color:#C9C9C9;flex-shrink:0}

/* ---------- 头像 ---------- */
.avatar{border-radius:6px;display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:600;flex-shrink:0;user-select:none;font-size:calc(var(--s,40px)*0.42);
  background-size:cover;background-position:center}

/* ---------- 空状态 ---------- */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:72px 32px;color:var(--text2)}
.empty-icon{width:76px;height:76px;border-radius:22px;background:var(--icon-bg,#EEF1F4);color:var(--icon-fg,#B9C2CC);
  display:flex;align-items:center;justify-content:center;margin-bottom:18px}
.empty-icon svg{width:38px;height:38px}
.empty-title{font-size:16px;font-weight:600;color:var(--text)}
.empty-desc{font-size:13px;color:var(--text2);margin-top:8px;line-height:1.6}
.btn-primary{margin-top:22px;background:var(--green);color:#fff;font-size:15px;
  padding:10px 30px;border-radius:8px;font-weight:500;transition:background .15s}
.btn-primary:active{background:var(--green-d)}

/* ---------- 聊天列表 ---------- */
.chatlist-cell .cell-title{display:flex;align-items:center;gap:8px}
.chatlist-cell .preview{font-size:13px;color:var(--text2);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chatlist-cell .preview.me-prefix{color:#8F9BA8}
.online-dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block}

/* ---------- 聊天窗口 ---------- */
.chat-body{background:var(--bg);padding:10px 0 14px;display:flex;flex-direction:column}
.msg-day{text-align:center;font-size:11px;color:#B5B5B5;margin:12px 0 6px}
.msg{display:flex;align-items:flex-start;margin:5px 0;padding:0 12px;animation:msgIn .18s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg.bot{justify-content:flex-start}
.msg.me{justify-content:flex-end}
.bubble{max-width:74%;padding:9px 12px;border-radius:6px;font-size:15px;line-height:1.5;
  word-break:break-word;white-space:pre-wrap;position:relative;cursor:default;user-select:text}
.msg.bot .bubble{background:var(--bubble-bot);border-top-left-radius:2px;
  box-shadow:0 1px 1.5px rgba(0,0,0,.05)}
.msg.me .bubble{background:var(--bubble-me);border-top-right-radius:2px}
.bubble.emoji-bubble{padding:6px;background:transparent!important;box-shadow:none!important}
.bubble.emoji-bubble img{width:100px;height:100px;object-fit:contain;border-radius:8px}
.msg .avatar{margin:0 8px;--s:38px}
.msg-time{font-size:10px;color:#B5B5B5;text-align:center;margin:2px 0}
.typing{display:inline-flex;gap:4px;align-items:center;padding:12px 14px}
.typing i{width:5px;height:5px;border-radius:50%;background:#A8A8A8;animation:tp 1s ease-in-out infinite}
.typing i:nth-child(2){animation-delay:.18s}
.typing i:nth-child(3){animation-delay:.36s}
@keyframes tp{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-4px);opacity:1}}
.chat-input{flex-shrink:0;display:flex;align-items:center;gap:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  background:var(--card);border-top:1px solid var(--line);z-index:6}
.chat-input input{flex:1;min-width:0;height:38px;background:var(--bg);border-radius:8px;
  padding:0 12px;font-size:16px}
.send-btn{width:38px;height:38px;border-radius:50%;background:var(--green);color:#fff;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s}
.send-btn:active{background:var(--green-d)}
.send-btn svg{width:19px;height:19px}
.send-btn.add{background:#E9ECEF;color:#5A6672;border-radius:10px}
.send-btn.add:active{background:#DDE1E6}

/* ---------- 表情面板 ---------- */
.emoji-panel{position:absolute;left:0;right:0;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom));
  background:var(--card);border-top:1px solid var(--line);padding:12px;display:none;z-index:8;max-height:220px;overflow-y:auto}
.emoji-panel.show{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.emoji-item{width:100%;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--sheet-bg);cursor:pointer;
  display:flex;align-items:center;justify-content:center}
.emoji-item img{width:100%;height:100%;object-fit:contain}
.emoji-add{border:2px dashed #DDD;display:flex;align-items:center;justify-content:center;color:#999;font-size:24px}

/* ---------- 联系人页 ---------- */
.contact-cell .cell-main{padding-left:2px}
.contact-cell .icon-btn{color:#9AA2AC}
.section-hint{font-size:12px;color:var(--text3);padding:10px 16px 4px;letter-spacing:.3px}

/* ---------- 联系人详情页 ---------- */
.cd-head{padding:28px 20px;background:var(--card);display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--line)}
.cd-info{flex:1}
.cd-name{font-size:20px;font-weight:600}
.cd-status{font-size:13px;color:var(--text2);margin-top:6px}
.cd-set-group{background:var(--card);margin-top:10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}

/* ---------- 我的页 ---------- */
.me-head{background:linear-gradient(135deg,#0FB768 0%,#07C160 55%,#0AAD8B 100%);
  padding:26px 22px 22px;display:flex;align-items:center;gap:16px;color:#fff}
.me-avatar{--s:64px;border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.18);cursor:pointer}
.me-info{flex:1;min-width:0}
.me-name{font-size:21px;font-weight:700;letter-spacing:.5px}
.me-sig{font-size:12.5px;opacity:.85;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-stats{display:flex;background:var(--card);border-bottom:1px solid var(--line)}
.me-stats .st{flex:1;display:flex;flex-direction:column;align-items:center;padding:14px 0 12px;gap:3px;cursor:pointer}
.me-stats .st:active{background:#F6F6F6}
.me-stats .st b{font-size:19px;font-weight:700}
.me-stats .st span{font-size:11px;color:var(--text2)}
.menu-list{background:var(--card);margin-top:10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.menu-list .cell .cell-title{font-size:15.5px}
.menu-list .cell .icon-cell{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.menu-list .cell .icon-cell svg{width:16px;height:16px}
.menu-list .cell.danger .cell-title{color:var(--danger)}
.menu-badge{font-size:12px;color:var(--text2);background:var(--input-bg);padding:2px 9px;border-radius:10px}

/* ---------- 设置页 ---------- */
.set-group{background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:10px}
.set-title{font-size:12px;color:var(--text3);padding:12px 16px 2px;letter-spacing:.5px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px}
.set-row + .set-row{border-top:1px solid #F2F2F2}
.set-row .lbl{font-size:15px}
.set-row .lbl small{display:block;font-size:11.5px;color:var(--text3);margin-top:2px;font-weight:400}
.stepper{display:flex;align-items:center;gap:2px}
.stepper button{width:30px;height:30px;border-radius:8px;background:var(--input-bg);color:#333;
  font-size:18px;display:flex;align-items:center;justify-content:center;line-height:1}
.stepper button:active{background:#E6E8EB}
.stepper span{min-width:40px;text-align:center;font-size:15px;font-weight:600}
.set-row input[type=number],.set-row input[type=text]{width:96px;height:34px;background:var(--input-bg);
  border-radius:8px;padding:0 10px;font-size:15px;text-align:center}
.set-row input[type=text]{text-align:left;width:200px}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}
.set-hint{font-size:11.5px;color:var(--text3);line-height:1.7;padding:0 16px 12px}
.btn-danger-ghost{margin:22px 16px 8px;width:calc(100% - 32px);padding:12px;border-radius:10px;
  background:var(--card);color:var(--danger);font-size:15px;border:1px solid #F5D6D6}
.btn-danger-ghost:active{background:#FFF5F5}

/* ---------- 字卡库页 ---------- */
.cards-tip{font-size:12.5px;color:var(--text3);padding:12px 16px 4px;line-height:1.7}
.cards-wrap{flex:1;overflow-y:auto;padding:8px 14px 16px;display:flex;flex-direction:column;gap:8px}
.card-chip{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:10px;
  padding:10px 8px 10px 14px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card-chip .chip-text{flex:1;font-size:15px;min-width:0;word-break:break-all}
.card-chip .chip-del{width:30px;height:30px;border-radius:8px;color:#C2C8CF;flex-shrink:0;
  display:flex;align-items:center;justify-content:center}
.card-chip .chip-del:active{background:var(--input-bg);color:var(--danger)}
.card-chip .chip-del svg{width:17px;height:17px}
.card-count{font-size:11.5px;color:var(--text3);text-align:right;padding:0 16px 2px}

/* ---------- 音乐页 ---------- */
.import-box{background:var(--card);margin:12px;border-radius:14px;padding:14px 16px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.import-title{font-size:14px;font-weight:600;margin-bottom:10px}
.import-row{display:flex;gap:8px}
.import-row input{flex:1;min-width:0;height:38px;background:var(--input-bg);border-radius:8px;
  padding:0 12px;font-size:14px}
.btn-primary.sm{padding:0 18px;height:38px;border-radius:8px;font-size:14px;margin:0;flex-shrink:0}
.import-hint{font-size:11.5px;color:var(--text3);margin-top:8px;line-height:1.6}
.import-hint.err{color:var(--danger)}
.pl-card{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#0FB768 0%,#07C160 55%,#0AAD8B 100%);
  margin:0 12px;padding:16px;border-radius:14px;box-shadow:0 6px 18px rgba(7,193,96,.28)}
.pl-cover{width:58px;height:58px;border-radius:10px;object-fit:cover;flex-shrink:0;background:rgba(255,255,255,.3);border:2px solid rgba(255,255,255,.55)}
.pl-info{flex:1;min-width:0}
.pl-name{font-size:16px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-meta{font-size:12px;color:rgba(255,255,255,.85);margin-top:4px}
.pl-meta .vip-tag{margin-left:2px}
.vip-clear{margin-top:8px;display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:#fff;background:rgba(255,255,255,.22);border-radius:12px;padding:4px 10px}
.vip-clear:active{background:rgba(255,255,255,.34)}
.vip-clear svg{width:12px;height:12px}
.song-list{flex:1;overflow-y:auto;background:var(--card);margin:10px 12px 0;border-radius:14px;padding:4px 0 8px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.song-row{display:flex;align-items:center;gap:10px;padding:11px 16px;cursor:pointer;transition:background .12s}
.song-row:active{background:var(--hover)}
.song-idx{width:22px;text-align:center;font-size:13px;color:var(--text3);flex-shrink:0}
.song-row.on .song-idx{color:var(--green)}
.song-main{flex:1;min-width:0}
.song-name{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song-row.on .song-name{color:var(--green);font-weight:600}
.song-art{font-size:12px;color:var(--text2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song-dur{font-size:12.5px;color:var(--text2);flex-shrink:0;display:flex;align-items:center;gap:6px}
.vip-tag{font-size:10px;color:#fff;background:#FA9D3B;padding:1px 5px;border-radius:4px}
.like-btn{width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:#CCC}
.like-btn.liked{color:var(--like)}
.like-btn svg{width:18px;height:18px}
.song-del{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text3);flex-shrink:0}
.song-del:active{background:var(--hover);color:var(--danger)}
.song-del svg{width:13px;height:13px}
.eq{display:flex;gap:2px;align-items:flex-end;height:13px;width:18px;justify-content:center}
.eq i{width:3px;background:var(--green);border-radius:1px;animation:eqb 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.22s}
.eq i:nth-child(3){animation-delay:.44s}
@keyframes eqb{0%,100%{height:4px}50%{height:13px}}

/* ---------- 朋友圈 ---------- */
.moment-item{background:var(--card);padding:16px;border-bottom:8px solid var(--bg)}
.moment-head{display:flex;gap:12px;align-items:flex-start}
.moment-avatar{--s:42px;border-radius:6px;flex-shrink:0}
.moment-author{font-size:15px;font-weight:600;color:#576B95}
.moment-content{font-size:15px;line-height:1.6;margin:8px 0 0 54px}
.moment-time{font-size:11.5px;color:var(--text3);margin-top:8px}
.moment-actions{display:flex;gap:16px;margin-top:10px;margin-left:54px;font-size:13px}
.moment-actions span{color:#576B95;cursor:pointer}
.moment-comments{margin-top:10px;margin-left:54px;background:var(--sheet-bg);border-radius:6px;padding:8px 10px;font-size:13.5px}
.moment-comments .cmt{margin:3px 0;line-height:1.5}
.moment-comments .cmt b{color:#576B95}
.moment-comments .cmt-del{margin-left:6px;color:var(--text3);font-size:13px;background:none;padding:0 4px}
.moment-likes{color:#576B95;padding-bottom:3px;margin-bottom:4px;border-bottom:1px solid var(--hover);font-size:13px}
.moment-cover{margin:8px 0 0 54px;border-radius:8px;overflow;height:180px}
.moment-cover img{width:100%;height:100%;object-fit:cover}

/* ---------- 播放器 ---------- */
.player{flex-shrink:0;background:linear-gradient(120deg,#232327,#2d2540);color:#fff;
  margin-top:10px;padding:12px 16px calc(14px + env(safe-area-inset-bottom));border-radius:16px 16px 0 0}
.progress{height:18px;display:flex;align-items:center;cursor:pointer;position:relative}
.progress .track{flex:1;height:3px;background:rgba(255,255,255,.18);border-radius:2px;position:relative;overflow:visible}
.progress .fill{position:absolute;left:0;top:0;height:3px;background:var(--green);border-radius:2px;width:0%}
.progress .knob{position:absolute;top:50%;left:0;width:12px;height:12px;border-radius:50%;
  background:#fff;border:2px solid var(--green);transform:translate(-50%,-50%);box-shadow:0 1px 3px rgba(0,0,0,.15);pointer-events:none}
.cell-arrow svg{display:block;transform:rotate(180deg);color:#C9C9C9}
.p-time{display:flex;justify-content:space-between;font-size:10.5px;color:rgba(255,255,255,.6);margin-top:2px}
.player-main{display:flex;align-items:center;gap:12px;margin-top:8px}
.now-info{flex:1;min-width:0}
.now-name{font-size:14.5px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now-art{font-size:11.5px;color:rgba(255,255,255,.65);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.controls{display:flex;align-items:center;gap:6px}
.ctl{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;gap:3px}
.ctl:active{background:rgba(255,255,255,.14)}
.ctl svg{width:21px;height:21px}
.ctl .mode-label{font-size:10px;color:rgba(255,255,255,.85)}
.ctl.play-main{width:48px;height:48px;background:var(--green);color:#fff;box-shadow:0 3px 12px rgba(7,193,96,.45)}
.ctl.play-main:active{background:var(--green-d)}
.ctl.play-main svg{width:22px;height:22px}
.ctl.mode{width:auto;padding:0 8px;height:28px;border-radius:14px;background:var(--input-bg);font-size:11px;color:#555;gap:4px}
.ctl.mode svg{width:14px;height:14px}

/* ---------- 部署说明页 ---------- */
.about-wrap{padding:14px 16px 30px}
.about-step{display:flex;gap:12px;margin-bottom:14px}
.about-num{width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;
  font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.about-body{flex:1;min-width:0}
.about-body h3{font-size:15px;font-weight:600;margin-bottom:5px}
.about-body p{font-size:13px;color:#5A5A5A;line-height:1.75}
.about-body code{background:var(--input-bg);border-radius:4px;padding:1px 6px;font-size:12.5px;color:#0B6A42;font-family:ui-monospace,Consolas,monospace}
.about-tip{background:#F0F9F3;border-radius:10px;padding:12px 14px;font-size:12.5px;color:#0F7A45;line-height:1.8;margin-top:4px}
.about-warn{background:#FFF7E8;border-radius:10px;padding:12px 14px;font-size:12.5px;color:#B26A00;line-height:1.8;margin-top:10px}

/* ---------- 浮层：toast / 对话框 / 动作面板 / 弹窗 ---------- */
#toast{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);z-index:200;
  background:rgba(17,17,17,.86);color:#fff;font-size:13.5px;padding:9px 18px;border-radius:9px;
  max-width:80%;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s;line-height:1.5}
#toast.show{opacity:1}
.overlay{position:absolute;inset:0;z-index:150;background:rgba(0,0,0,.45);display:none;
  align-items:center;justify-content:center;animation:fadeIn .18s}
.overlay.show{display:flex}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.dlg-card{width:78%;max-width:300px;background:#fff;border-radius:13px;padding:22px 20px 16px;text-align:center;animation:popIn .2s ease}
@keyframes popIn{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.dlg-title{font-size:16.5px;font-weight:600}
.dlg-text{font-size:13.5px;color:#666;margin-top:9px;line-height:1.65}
.dlg-btns{display:flex;gap:10px;margin-top:20px}
.dlg-btns .btn{flex:1;padding:10px;border-radius:9px;font-size:15px;background:var(--input-bg);color:#333}
.dlg-btns .btn:active{background:#E7E9EC}
.dlg-btns .btn.danger{background:var(--danger);color:#fff}
.dlg-btns .btn.danger:active{background:#E04444}
.dlg-btns .btn.primary{background:var(--green);color:#fff}
.dlg-btns .btn.primary:active{background:var(--green-d)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--sheet-bg);border-radius:14px 14px 0 0;
  overflow:hidden;animation:sheetUp .22s ease;z-index:160;padding-bottom:env(safe-area-inset-bottom)}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
.sheet .sh-title{font-size:12px;color:var(--text3);text-align:center;padding:11px 0 4px}
.sheet .sh-item{background:#fff;padding:14px;text-align:center;font-size:15.5px;border-bottom:1px solid #F2F2F2}
.sheet .sh-item:active{background:#F5F5F5}
.sheet .sh-item.danger{color:var(--danger)}
.sheet .sh-cancel{background:#fff;margin-top:7px;padding:14px;text-align:center;font-size:15.5px;font-weight:500}
.sheet .sh-cancel:active{background:#F5F5F5}
.modal{position:absolute;inset:0;z-index:170;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center}
.modal.show{display:flex;animation:fadeIn .18s}
.modal-card{width:86%;max-width:340px;background:#fff;border-radius:14px;padding:20px;animation:popIn .2s ease;max-height:82%;overflow-y:auto}
.modal-card h2{font-size:16.5px;font-weight:600;text-align:center;margin-bottom:16px}
.m-field{margin-bottom:13px}
.m-field label{display:block;font-size:12.5px;color:var(--text2);margin-bottom:6px}
.m-field input{width:100%;height:38px;background:var(--input-bg);border-radius:8px;padding:0 12px;font-size:15px}
.m-field textarea{width:100%;min-height:80px;background:var(--input-bg);border-radius:8px;padding:10px 12px;font-size:15px;resize:vertical}
.color-palette{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.cp-item{width:34px;height:34px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:transform .12s}
.cp-item:active{transform:scale(.9)}
.cp-item.on{border-color:#333;transform:scale(1.08)}
.m-btns{display:flex;gap:10px;margin-top:18px}
.ev-form{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.ev-form input{flex:1;height:38px;background:var(--input-bg);border-radius:8px;padding:0 10px;font-size:14px;min-width:0}
.ev-form input[type=date]{flex:0 0 128px;color:var(--text2)}
.ev-form .btn{flex-shrink:0;padding:0 14px;height:38px;border-radius:8px;font-size:14px}
.ev-list{max-height:230px;overflow-y:auto;margin-top:8px}
.ev-row{display:flex;align-items:center;gap:8px;padding:9px 4px;border-bottom:1px solid var(--line)}
.ev-row:last-child{border-bottom:none}
.ev-info{flex:1;min-width:0}
.ev-name{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev-detail{font-size:11.5px;color:var(--text2);margin-top:2px}
.ev-toggle{flex-shrink:0;font-size:11px;color:var(--text2);border:1px solid var(--line);border-radius:12px;padding:3px 8px}
.ev-toggle.on{background:var(--green);border-color:var(--green);color:#fff}
.ev-del{flex-shrink:0;width:26px;height:26px;border-radius:50%;background:var(--input-bg);color:var(--text2);font-size:12px;display:flex;align-items:center;justify-content:center}
.ev-del:active{background:var(--danger);color:#fff}
.ev-empty{font-size:13px;color:var(--text2);text-align:center;padding:22px 0}
.ev-tip{font-size:11px;color:var(--text3);margin-top:6px}
.m-btns .btn{flex:1;padding:11px;border-radius:9px;font-size:15px}
.m-btns .btn.primary{background:var(--green);color:#fff}
.m-btns .btn.primary:active{background:var(--green-d)}
.m-btns .btn.plain{background:var(--input-bg);color:#333}
.m-btns .btn.plain:active{background:#E7E9EC}
.toggle{width:46px;height:26px;border-radius:13px;background:#E5E5E5;position:relative;transition:background .2s;cursor:pointer}
.toggle.on{background:var(--green)}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.on::after{transform:translateX(20px)}

/* ---------- 加载指示 ---------- */
.loading-dots{display:inline-flex;gap:5px;align-items:center;margin-right:8px}
.loading-dots i{width:5px;height:5px;border-radius:50%;background:#fff;animation:tp 1s ease-in-out infinite}
.loading-dots i:nth-child(2){animation-delay:.18s}
.loading-dots i:nth-child(3){animation-delay:.36s}

/* ---------- 美化主题模板 ---------- */
body[data-theme="pink"]{
  --green:#F06C9B; --green-d:#E0558B; --bubble-me:#FFD6E5; --bg:#F2E2E9; --page:#FFF8FA;
  --card:#FFFFFF; --line:#F0DDE5; --text:#3A2330; --text2:#A98A97; --text3:#C9B0BC;
  --input-bg:#FFF0F4; --sheet-bg:#FFF8FA; --hover:#FFF0F4; --track:#F5DDE5; --frame:#E8D5DC;
  --icon-bg:#FFE9F0; --icon-fg:#E8A0BC;
}
body[data-theme="blue"]{
  --green:#3B82F6; --green-d:#2F6FE0; --bubble-me:#BFDBFE; --bg:#E3EDF9; --page:#F5F9FF;
  --card:#FFFFFF; --line:#DFEAF7; --text:#172554; --text2:#7A8FB0; --text3:#A9BCD6;
  --input-bg:#EDF3FB; --sheet-bg:#F5F9FF; --hover:#EDF3FB; --track:#D8E5F5; --frame:#D6E2F0;
  --icon-bg:#E3EEFB; --icon-fg:#7FA6DC;
}
body[data-theme="orange"]{
  --green:#F59E0B; --green-d:#E08C00; --bubble-me:#FDE8C8; --bg:#F8EFDF; --page:#FFFBF2;
  --card:#FFFFFF; --line:#F2E4CB; --text:#3D2B10; --text2:#A08A5F; --text3:#C2AC82;
  --input-bg:#FFF5E5; --sheet-bg:#FFFBF2; --hover:#FFF5E5; --track:#F0E2C8; --frame:#EDE0C8;
  --icon-bg:#FDF0D8; --icon-fg:#D9A94E;
}
body[data-theme="purple"]{
  --green:#8B5CF6; --green-d:#7A4BE8; --bubble-me:#DDD0FB; --bg:#EDE7F7; --page:#F9F6FF;
  --card:#FFFFFF; --line:#E6DDF5; --text:#2E1A5E; --text2:#9581BC; --text3:#B7A7D6;
  --input-bg:#F3EEFC; --sheet-bg:#F9F6FF; --hover:#F3EEFC; --track:#E4DAF5; --frame:#DFD6EF;
  --icon-bg:#EFE8FC; --icon-fg:#A78BEA;
}
body[data-theme="dark"]{
  --bg:#1C1C1E; --page:#242426; --card:#2C2C2E;
  --green:#30D158; --green-d:#28B84C; --bubble-me:#1E4D2E; --bubble-bot:#3A3A3C;
  --text:#F2F2F7; --text2:#98989E; --text3:#6E6E73;
  --line:#3A3A3C; --danger:#FF6B6B; --like:#FF6B6B;
  --input-bg:#3A3A3C; --sheet-bg:#2C2C2E; --hover:#3A3A3C; --track:#4A4A4C; --frame:#151517;
  --icon-bg:#3A3A3C; --icon-fg:#98989E;
}
body[data-theme="dark"] .me-head{background:linear-gradient(135deg,#1F7A45 0%,#1E9E58 55%,#18875F 100%)}
body[data-theme="dark"] .dlg-card{background:#2C2C2E}
body[data-theme="dark"] .dlg-text{color:#B0B0B6}
body[data-theme="dark"] .dlg-btns .btn{background:#3A3A3C}
body[data-theme="dark"] .sheet .sh-item{background:#2C2C2E;border-color:#3A3A3C}
body[data-theme="dark"] .sheet .sh-cancel{background:#2C2C2E;color:#F2F2F7}
body[data-theme="dark"] .modal-card{background:#2C2C2E}
body[data-theme="dark"] .modal-card h2{color:#F2F2F7}
body[data-theme="dark"] .m-field label{color:#98989E}
body[data-theme="dark"] .moment-comments{background:#3A3A3C}
body[data-theme="dark"] .chat-body .msg.bot .bubble{color:#F2F2F7}
body[data-theme="dark"] .card-chip{background:#2C2C2E;color:#F2F2F7}
body[data-theme="dark"] .song-row.on .song-name{color:#30D158}
body[data-theme="dark"] .cell:active{background:#333}

/* ---------- 表情包管理页 ---------- */
.emoji-manage-wrap{flex:1;overflow-y:auto;padding:12px 14px 20px}
.emoji-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.emoji-card{position:relative;aspect-ratio:1;border-radius:10px;background:var(--card);
  display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.emoji-card img{width:100%;height:100%;object-fit:contain;padding:6px}
.emoji-card .emoji-del{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;
  background:rgba(0,0,0,.55);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center}
.emoji-import-btn{width:100%;margin-top:12px;background:var(--green);color:#fff;font-size:15px;
  padding:12px;border-radius:10px;font-weight:500}
.emoji-count{font-size:11.5px;color:var(--text3);text-align:right;padding:0 16px 2px}

/* ---------- 主题选择 ---------- */
.theme-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px 16px 16px}
.theme-item{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 8px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:7px;transition:border-color .15s}
.theme-item.on{border-color:var(--green)}
.theme-swatch{width:38px;height:38px;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.theme-name{font-size:12px;color:var(--text);font-weight:500}
.theme-desc{font-size:10.5px;color:var(--text3);text-align:center;line-height:1.4}

/* ---------- 字卡分组 ---------- */
.card-groups{display:flex;gap:8px;overflow-x:auto;padding:10px 14px 4px;flex-shrink:0}
.card-groups::-webkit-scrollbar{display:none}
.cg{flex-shrink:0;display:inline-flex;align-items:center;gap:5px;background:var(--card);
  border:1px solid var(--line);border-radius:16px;padding:6px 12px;font-size:13px;color:var(--text2);white-space:nowrap}
.cg em{font-style:normal;font-size:11px;color:var(--text3)}
.cg.on{background:var(--green);border-color:var(--green);color:#fff}
.cg.on em{color:rgba(255,255,255,.85)}
.cg.add{border-style:dashed;color:var(--green);font-size:16px;padding:4px 12px}
.cg-more{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;font-size:14px;line-height:1;color:inherit;opacity:.65;margin-left:2px;flex-shrink:0}
.cg-more:active{background:rgba(0,0,0,.18)}
.cg.on .cg-more{color:rgba(255,255,255,.9)}
.card-chip.sel{box-shadow:0 0 0 2px var(--green)}
.chip-check{width:26px;height:26px;border-radius:6px;border:2px solid #CBD5E0;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff}
.card-chip.sel .chip-check{background:var(--green);border-color:var(--green)}
.chip-check svg{width:16px;height:16px}
.batch-bar{flex-shrink:0;display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--card);border-top:1px solid var(--line)}
.batch-bar .bb{flex:1;height:38px;border-radius:9px;background:var(--input-bg);color:var(--text);font-size:14px}
.batch-bar .bb.danger{background:var(--danger);color:#fff}
.batch-bar .bb-count{font-size:13px;color:var(--text2);white-space:nowrap}
.head-btn{display:inline-flex;align-items:center;gap:4px;background:var(--green);color:#fff;font-size:12.5px;
  padding:6px 11px;border-radius:15px;font-weight:500;flex-shrink:0}
.head-btn:active{background:var(--green-d)}
.head-btn svg{width:14px;height:14px}
.head-btn.ghost{background:var(--input-bg);color:var(--text)}

/* ---------- 播放悬浮窗（网易云风格迷你条） ---------- */
.mini-player{position:absolute;left:12px;right:12px;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 10px);
  z-index:24;display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:15px;
  background:linear-gradient(120deg,#232327,#2d2540);color:#fff;box-shadow:0 10px 26px rgba(0,0,0,.35);cursor:pointer}
.mini-player.hidden{display:none}
.mini-cover{width:42px;height:42px;border-radius:9px;object-fit:cover;flex-shrink:0;background:#3a3a44}
.mini-info{flex:1;min-width:0}
.mini-name{font-size:13.5px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-art{font-size:11px;color:rgba(255,255,255,.6);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-progress{height:3px;background:rgba(255,255,255,.18);border-radius:2px;margin-top:7px;overflow:hidden}
.mini-fill{height:100%;width:0;background:#07C160;border-radius:2px}
.mini-ctl{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.mini-ctl:active{background:rgba(255,255,255,.15)}
.mini-ctl svg{width:20px;height:20px}
.mini-close{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mini-close:active{background:rgba(255,255,255,.28)}
.mini-close svg{width:11px;height:11px}

/* ---------- 网易云风格播放页 ---------- */
#view-nowplaying{background:linear-gradient(180deg,#E8E4F2 0%,#F6F6F6 40%);transition:background .4s}
body[data-theme="dark"] #view-nowplaying{background:linear-gradient(180deg,#2a2438 0%,#1C1C1E 40%)}
#view-nowplaying .nav{background:transparent;border-bottom-color:transparent}
.np-body{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding:20px 24px 30px}
.np-disc{position:relative;width:248px;height:248px;margin:26px auto 30px;flex-shrink:0}
.np-disc::before{content:'';position:absolute;inset:8px;border-radius:50%;box-shadow:0 0 0 6px rgba(0,0,0,.08),0 16px 40px rgba(0,0,0,.3)}
.np-disc .np-cover{width:100%;height:100%;border-radius:50%;object-fit:cover;box-shadow:0 14px 36px rgba(0,0,0,.3);
  border:6px solid #fff;display:block;position:relative}
.np-disc.playing .np-cover{animation:npSpin 18s linear infinite}
@keyframes npSpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.np-disc .np-hole{position:absolute;left:50%;top:50%;width:54px;height:54px;transform:translate(-50%,-50%);
  border-radius:50%;background:var(--page);box-shadow:inset 0 0 5px rgba(0,0,0,.3),0 0 0 3px rgba(0,0,0,.05)}
.np-disc .np-arm{position:absolute;right:-14px;top:-16px;width:76px;height:76px;z-index:2;transform-origin:18px 12px;
  transition:transform .3s;pointer-events:none}
.np-disc.paused .np-arm{transform:rotate(-18deg)}
.np-arm svg{width:100%;height:100%}
.np-song{font-size:19px;font-weight:600;color:var(--text);text-align:center;margin-top:6px}
.np-art{font-size:13px;color:var(--text2);margin-top:6px;text-align:center}
.np-lyric{width:100%;max-height:150px;overflow:hidden;margin-top:22px;text-align:center;
  font-size:14px;color:var(--text3);line-height:2;position:relative}
.np-lyric::after{content:'';position:absolute;left:0;right:0;bottom:0;height:46px;
  background:linear-gradient(transparent,var(--page))}
.np-lyric p{transition:opacity .2s}
.np-lyric p.on{color:var(--green);font-weight:600}
.np-progress{width:100%;margin-top:22px}
.np-time{display:flex;justify-content:space-between;font-size:10.5px;color:var(--text3);margin-top:4px}
.np-controls{display:flex;align-items:center;justify-content:center;gap:22px;margin-top:20px}
.npc{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text)}
.npc:active{background:var(--hover)}
.npc svg{width:24px;height:24px}
.npc.like.liked{color:var(--like)}
.npc.big{width:64px;height:64px;background:var(--green);color:#fff;box-shadow:0 6px 18px rgba(7,193,96,.4)}
.npc.big:active{background:var(--green-d)}
.npc.big svg{width:28px;height:28px}
.np-jam{display:flex;align-items:center;gap:8px;margin-top:26px;width:100%;justify-content:center;flex-wrap:wrap}
.jam-pill{display:inline-flex;align-items:center;gap:6px;background:var(--input-bg);border-radius:16px;
  padding:7px 14px;font-size:12.5px;color:var(--text)}
.jam-pill .dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
.jam-pill.off .dot{background:var(--text3)}

/* ============================================================
   黎宸视觉改版 · 星夜雾蓝 / 柔和玻璃感
   仅覆盖视觉样式，保留原有交互与功能逻辑
   ============================================================ */
:root{
  --bg:#edf0f8;
  --page:#f7f8fc;
  --card:#ffffff;
  --green:#6579d8;
  --green-d:#5267c4;
  --bubble-me:#dce4ff;
  --bubble-bot:#ffffff;
  --text:#252b43;
  --text2:#858ba3;
  --text3:#b0b5c8;
  --line:#e8eaf3;
  --danger:#e66d82;
  --like:#e66d82;
  --input-bg:#f0f2f9;
  --sheet-bg:#f8f9fd;
  --hover:#f0f2fb;
  --track:#e4e8f5;
  --frame:#dfe3ef;
  --radius:16px;
}
body{
  background:
    radial-gradient(ellipse at 15% 8%,rgba(144,158,232,.24),transparent 34%),
    radial-gradient(ellipse at 88% 90%,rgba(231,190,211,.22),transparent 32%),
    #e6e9f3;
  letter-spacing:.05px;
}
#app{
  background:var(--page);
  box-shadow:0 24px 80px rgba(49,57,98,.13);
}
@media (min-width:560px){
  #app{border:1px solid rgba(255,255,255,.8);border-radius:30px;overflow:hidden}
}
.nav{
  background:rgba(255,255,255,.92);
  backdrop-filter:blur(18px);

<script>
'use strict';
/* ============================================================
   工具函数
   ============================================================ */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad2 = n => String(n).padStart(2, '0');
const randInt = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const rand = (a, b) => a + Math.random() * (b - a);
const sleep = ms => new Promise(r => setTimeout(r, ms));
function fmtClock(ts){ const d = new Date(ts); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }
function fmtDay(ts){
  const d = new Date(ts), n = new Date();
  const s0 = x => new Date(x).setHours(0, 0, 0, 0);
  const diff = (s0(n) - s0(d)) / 864e5;
  if (diff < 1) return '今天 ' + fmtClock(ts);
  if (diff < 2) return '昨天 ' + fmtClock(ts);
  if (diff < 7) return '星期' + '日一二三四五六'[d.getDay()] + ' ' + fmtClock(ts);
  return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + fmtClock(ts);
}
function fmtListTime(ts){
  const d = new Date(ts), n = new Date();
  const s0 = x => new Date(x).setHours(0, 0, 0, 0);
  const diff = (s0(n) - s0(d)) / 864e5;
  if (diff < 1) return fmtClock(ts);
  if (diff < 2) return '昨天';
  if (diff < 7) return '星期' + '日一二三四五六'[d.getDay()];
  return (d.getMonth() + 1) + '/' + d.getDate();
}
function fmtDur(sec){ sec = Math.max(0, Math.round(sec || 0)); return (sec / 60 | 0) + ':' + pad2(sec % 60); }

/* ============================================================
   本地存储与默认数据
   ============================================================ */
const LS = {
  get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
const DEFAULT_CARDS = [
  '好的呀～','嗯嗯，我在听','哈哈哈哈笑死我了','真的假的？','有点道理哦',
  '那你觉得呢？','等我一下下','收到收到！','好哒没问题','哇，好棒！',
  '我也是这么想的','今天天气不错呢','你在说什么呀','我猜也是～','冲鸭！！','已阅，点个赞'
];
const DEFAULT_CONTACTS = [
  {id:'c1', name:'小卡', color:0, sig:'今天也要元气满满', statusTexts:['在线','摸鱼中','刚睡醒'], customSettings:null, avatarUrl:'', chatBg:''},
  {id:'c2', name:'阿豆', color:1, sig:'字卡收藏家', statusTexts:['忙工作中','看书ing'], customSettings:null, avatarUrl:'', chatBg:''},
  {id:'c3', name:'夜猫子', color:2, sig:'凌晨三点在线', statusTexts:['熬夜中','喝奶茶'], customSettings:null, avatarUrl:'', chatBg:''}
];
const AV_COLORS = [
  ['#FF9F6E','#FF6B6B'], ['#5AD8A6','#2FBFA0'], ['#7C9CFF','#5B6BF0'], ['#F6A5C0','#F0579B'],
  ['#FFD166','#F4A340'], ['#8FD3F4','#4BA6E0'], ['#B39DDB','#7E6BD6'], ['#A0D2A8','#5FBF77']
];
const THEMES = [
  {k:'default', name:'微信绿', desc:'经典微信配色', bg:'#07C160'},
  {k:'pink', name:'樱花粉', desc:'少女心满满', bg:'#F06C9B'},
  {k:'blue', name:'深海蓝', desc:'清爽海洋风', bg:'#3B82F6'},
  {k:'orange', name:'暖阳橙', desc:'温暖活力感', bg:'#F59E0B'},
  {k:'purple', name:'暮光紫', desc:'浪漫高级感', bg:'#8B5CF6'},
  {k:'dark', name:'暗夜黑', desc:'护眼夜间模式', bg:'#1F2937'}
];
function themeInfo(){ return THEMES.find(x => x.k === state.settings.theme) || THEMES[0]; }
function applyTheme(){
  const k = state.settings.theme || 'default';
  document.body.setAttribute('data-theme', THEMES.some(t => t.k === k) ? k : 'default');
}
function setTheme(k){
  state.settings.theme = k;
  save();
  applyTheme();
  render();
  toast('已切换为「' + themeInfo().name + '」主题');
}
/* ============================================================
   字卡分组（兼容旧版 wc_cards 数组）
   ============================================================ */
function initCardGroups(){
  const g = LS.get('wc_cardGroups', null);
  if (g && Array.isArray(g) && g.length) return g;
  const old = LS.get('wc_cards', null);
  const cards = Array.isArray(old) && old.length ? old.slice() : DEFAULT_CARDS.slice();
  return [{id:'g_default', name:'默认', cards: cards}];
}
function allCards(){
  return state.cardGroups.reduce((a, g) => a.concat(g.cards || []), []);
}
function currentGroupObj(){
  if (!state.currentGroup || state.currentGroup === 'all') return null;
  return state.cardGroups.find(g => g.id === state.currentGroup) || null;
}
const DEFAULT_MOMENTS = [
  {id:'m1', authorId:'c1', text:DEFAULT_CARDS[randInt(0, DEFAULT_CARDS.length-1)] + ' ' + DEFAULT_CARDS[randInt(0, DEFAULT_CARDS.length-1)], time: Date.now() - 3600*1000*2, likes:['我'], comments:[]}
];

/* ============================================================
   全局状态
   ============================================================ */
const state = {
  profile: LS.get('wc_profile', {name:'我', color:6, sig:'这个人很懒，什么都没写', avatarUrl:'', bgImage:''}),
  cardGroups: initCardGroups(),
  currentGroup: 'all',
  contacts: LS.get('wc_contacts', DEFAULT_CONTACTS),
  chats: LS.get('wc_chats', {}),
  settings: LS.get('wc_settings', {minReplies:1, maxReplies:3, minDelay:1, maxDelay:4, theme:'default', miniPlayer:true}),
  music: LS.get('wc_music', null),
  apiBase: LS.get('wc_apiBase', ''),
  moments: LS.get('wc_moments', DEFAULT_MOMENTS),
  emojis: LS.get('wc_emojis', []),
  jam: LS.get('wc_jam', null),
  lastReplyIdx: {},
  typingChat: null,
  importing: false,
  importErr: '',
  playingLoading: false,
  errCount: 0,
  vipSongs: LS.get('wc_vipSongs', [])
};
function save(){
  LS.set('wc_profile', state.profile);
  LS.set('wc_cardGroups', state.cardGroups);
  LS.set('wc_contacts', state.contacts);
  LS.set('wc_chats', state.chats);
  LS.set('wc_settings', state.settings);
  LS.set('wc_music', state.music);
  LS.set('wc_apiBase', state.apiBase);
  LS.set('wc_moments', state.moments);
  LS.set('wc_emojis', state.emojis);
  LS.set('wc_vipSongs', state.vipSongs);
  LS.set('wc_jam', state.jam);
}

/* ============================================================
   头像
   ============================================================ */
function avatarHtml(o, size){
  size = size || 40;
  if (o.avatarUrl) {
    return '<div class="avatar" style="width:' + size + 'px;height:' + size + 'px;--s:' + size + 'px;background-image:url(' + o.avatarUrl + ')"></div>';
  }
  const p = AV_COLORS[(o.color % AV_COLORS.length + AV_COLORS.length) % AV_COLORS.length] || AV_COLORS[0];
  const ch = (o.name || '?').trim().charAt(0) || '?';
  return '<div class="avatar" style="width:' + size + 'px;height:' + size + 'px;--s:' + size + 'px;background:linear-gradient(135deg,' + p[0] + ',' + p[1] + ')">' + esc(ch) + '</div>';
}

/* ============================================================
   Toast / 对话框 / 动作面板
   ============================================================ */
let toastTimer;
function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}
function confirmDialog(o){
  return new Promise(res => {
    const ov = $('#dialogOverlay');
    ov.innerHTML = '<div class="dlg-card"><div class="dlg-title">' + esc(o.title || '提示') + '</div>' +
      (o.text ? '<div class="dlg-text">' + esc(o.text) + '</div>' : '') +
      '<div class="dlg-btns"><button class="btn" data-act="cancel">取消</button>' +
      '<button class="btn ' + (o.danger ? 'danger' : 'primary') + '" data-act="ok">' + esc(o.okText || '确定') + '</button></div></div>';
    ov.classList.add('show');
    ov.querySelector('[data-act=cancel]').onclick = () => { ov.classList.remove('show'); res(false); };
    ov.querySelector('[data-act=ok]').onclick = () => { ov.classList.remove('show'); res(true); };
  });
}
function openSheet(opts){
  const title = Array.isArray(opts) ? '' : (opts.title || '');
  const items = Array.isArray(opts) ? opts : (opts.items || []);
  const ov = $('#sheetOverlay');
  ov.innerHTML = '<div class="sheet">' + (title ? '<div class="sh-title">' + esc(title) + '</div>' : '') +
    items.map((it, i) => '<div class="sh-item' + (it.danger ? ' danger' : '') + '" data-i="' + i + '">' + esc(it.label) + '</div>').join('') +
    '<div class="sh-cancel" data-act="cancel">取消</div></div>';
  ov.classList.add('show');
  ov.querySelectorAll('.sh-item').forEach(el => {
    el.onclick = () => { ov.classList.remove('show'); const fn = items[+el.dataset.i].fn; if (fn) fn(); };
  });
  ov.querySelector('[data-act=cancel]').onclick = () => ov.classList.remove('show');
}

/* ============================================================
   空状态
   ============================================================ */
function emptyHtml(kind, title, desc, btn){
  const icons = {
    chats: '<svg><use href="#i-chat" xlink:href="#i-chat"/></svg>',
    contacts: '<svg><use href="#i-contacts" xlink:href="#i-contacts"/></svg>',
    music: '<svg><use href="#i-music" xlink:href="#i-music"/></svg>',
    cards: '<svg><use href="#i-card" xlink:href="#i-card"/></svg>',
    moments: '<svg><use href="#i-moments" xlink:href="#i-moments"/></svg>'
  };
  return '<div class="empty"><div class="empty-icon">' + (icons[kind] || '') + '</div>' +
    '<div class="empty-title">' + esc(title) + '</div>' +
    (desc ? '<div class="empty-desc">' + esc(desc) + '</div>' : '') +
    (btn ? '<button class="btn-primary" data-action="' + esc(btn.action) + '">' + esc(btn.label) + '</button>' : '') +
    '</div>';
}

/* ============================================================
   路由
   ============================================================ */
let currentRoute = {name: 'chats', param: null};
function parseHash(){
  const h = (location.hash || '#/chats').replace(/^#\/?/, '');
  const parts = h.split('/');
  return {name: parts[0] || 'chats', param: parts[1] || null};
}
function go(h){ location.hash = h; }
function route(){
  currentRoute = parseHash();
  render();
}
function render(){
  const tabRoutes = ['chats', 'contacts', 'moments', 'music', 'me'];
  $$('.view').forEach(v => v.classList.remove('active'));
  let v = null;
  if (currentRoute.name === 'chat' && currentRoute.param) v = $('#view-chat');
  else if (currentRoute.name === 'contacts') v = $('#view-contacts');
  else if (currentRoute.name === 'music') v = $('#view-music');
  else if (currentRoute.name === 'nowplaying') v = $('#view-nowplaying');
  else if (currentRoute.name === 'me') v = $('#view-me');
  else if (currentRoute.name === 'settings') v = $('#view-settings');
  else if (currentRoute.name === 'cards') v = $('#view-cards');
  else if (currentRoute.name === 'emojis') v = $('#view-emojis');
  else if (currentRoute.name === 'moments') v = $('#view-moments');
  else if (currentRoute.name === 'contact-detail' && currentRoute.param) v = $('#view-contact-detail');
  else if (currentRoute.name === 'about') v = $('#view-about');
  else v = $('#view-chats');
  v.classList.add('active');
  // 渲染各视图内容
  if (currentRoute.name === 'chat' && currentRoute.param) renderChat();
  else if (currentRoute.name === 'contacts') { renderContacts(); }
  else if (currentRoute.name === 'music') renderMusic();
  else if (currentRoute.name === 'nowplaying') renderNowPlaying();
  else if (currentRoute.name === 'me') renderMe();
  else if (currentRoute.name === 'settings') renderSettings();
  else if (currentRoute.name === 'cards') renderCards();
  else if (currentRoute.name === 'emojis') renderEmojis();
  else if (currentRoute.name === 'moments') renderMoments();
  else if (currentRoute.name === 'contact-detail' && currentRoute.param) renderContactDetail();
  else if (currentRoute.name === 'about') renderAbout();
  else renderChatList();
  // 标签栏状态
  const isTab = tabRoutes.indexOf(currentRoute.name) >= 0;
  document.body.classList.toggle('no-tab', !isTab);
  $$('#tabbar .tab').forEach(t => t.classList.toggle('on', t.dataset.route === currentRoute.name));
  // 列表页回到顶部
  if (currentRoute.name !== 'chat') {
    const b = v.querySelector('.body');
    if (b) b.scrollTop = 0;
  } else {
    scrollChatToBottom();
  }
  updateMiniPlayer();
}

/* ============================================================
   聊天列表
   ============================================================ */
function renderChatList(){
  const list = $('#chatList');
  if (!state.contacts.length) {
    list.innerHTML = emptyHtml('chats', '还没有联系人', '先添加一个联系人，再开始聊天吧', {action:'add-contact', label:'添加联系人'});
    return;
  }
  const rows = state.contacts.map(c => {
    const msgs = state.chats[c.id] || [];
    const last = msgs[msgs.length - 1];
    return {c, last};
  }).sort((a, b) => {
    const ta = a.last ? a.last.time : 0, tb = b.last ? b.last.time : 0;

function getContact(id){ return state.contacts.find(c => c.id === id) || null; }

function daysUntil(dateStr){
  if (!dateStr) return null;
  const m = String(dateStr).match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (!m) return null;
  const t = new Date(+m[1], +m[2] - 1, +m[3]);
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((t - today) / 86400000);
}
function eventText(ev){
  const d = daysUntil(ev.date);
  if (d === null) return ev.name + ' · ' + ev.date;
  if (d === 0) return '今天是 ' + ev.name;
  if (d > 0) return '距 ' + ev.name + ' 还有 ' + d + ' 天';
  return ev.name + ' 已过去 ' + (-d) + ' 天';
}

function msgHtml(c, m){

  if (m.type === 'emoji') {

  ]);

function copyText(t){
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).catch(() => fallbackCopy(t));
  } else fallbackCopy(t);
}
function fallbackCopy(t){
  const ta = document.createElement('textarea');
  ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch(e){}
  document.body.removeChild(ta);
}

/* ============================================================
   聊天引擎：发送与随机回复
   ============================================================ */
function sendMessage(){
  const input = $('#chatInput');
  const text = input.value.trim();
  if (!text) return;
  const cid = currentRoute.param;
  if (!getContact(cid)) return;
  const msgs = state.chats[cid] || (state.chats[cid] = []);
  msgs.push({id: uid(), role: 'me', text: text, time: Date.now()});
  if (msgs.length > 200) msgs.splice(0, msgs.length - 200);
  save();
  input.value = '';
  renderChat();
  scheduleReply(cid);
}
function sendEmoji(src){
  const cid = currentRoute.param;
  if (!getContact(cid)) return;
  const msgs = state.chats[cid] || (state.chats[cid] = []);
  msgs.push({id: uid(), role: 'me', type: 'emoji', src: src, time: Date.now()});
  if (msgs.length > 200) msgs.splice(0, msgs.length - 200);
  save();
  renderChat();
  $('#emojiPanel').classList.remove('show');
  scheduleReply(cid);
}
function scheduleReply(cid){ replyQueue.push(cid); pumpReplies(); }
const replyQueue = [];
let replying = false;
async function pumpReplies(){
  if (replying) return;
  replying = true;
  while (replyQueue.length) {
    const cid = replyQueue.shift();
    await runReply(cid);
  }
  replying = false;
}
async function runReply(cid){
  if (!getContact(cid)) return;
  const c = getContact(cid);
  const s = c.customSettings || state.settings;
  const delayMs = rand(Math.min(s.minDelay, s.maxDelay), Math.max(s.minDelay, s.maxDelay)) * 1000;
  await sleep(delayMs);
  if (!getContact(cid)) return;
  const inView = currentRoute.name === 'chat' && currentRoute.param === cid;
  if (inView) {
    state.typingChat = cid;
    renderChat();
  }
  await sleep(rand(700, 1600));
  const n = randInt(Math.min(s.minReplies, s.maxReplies), Math.max(s.minReplies, s.maxReplies));
  const msgs = state.chats[cid] || (state.chats[cid] = []);
  for (let i = 0; i < n; i++) {
    // 15%概率随机发表情包
    if (state.emojis.length && Math.random() < 0.15) {
      const emoji = state.emojis[randInt(0, state.emojis.length-1)];
      msgs.push({id: uid(), role: 'bot', type: 'emoji', src: emoji, time: Date.now()});
    } else {
      msgs.push({id: uid(), role: 'bot', text: pickCard(cid), time: Date.now()});
    }
    if (msgs.length > 200) msgs.splice(0, msgs.length - 200);
    save();
    if (currentRoute.name === 'chat' && currentRoute.param === cid) renderChat();
    if (i < n - 1) await sleep(rand(600, 1500));
  }
  state.typingChat = null;
  if (currentRoute.name === 'chat' && currentRoute.param === cid) renderChat();
}
function pickCard(cid){
  const arr = allCards();
  if (!arr.length) return '（字卡库是空的，去加一些吧）';
  let i = randInt(0, arr.length - 1);
  if (arr.length > 1 && i === state.lastReplyIdx[cid]) i = (i + 1) % arr.length;
  state.lastReplyIdx[cid] = i;
  return arr[i];
}

// 压缩图片为 jpeg dataURL，避免大图导致 localStorage 超限
function compressImage(file, maxSize, quality, cb){
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width * scale));
      const h = Math.max(1, Math.round(img.height * scale));
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      try { cb(canvas.toDataURL('image/jpeg', quality)); }
      catch (err) { cb(null); }
    };
    img.onerror = () => cb(null);
    img.src = e.target.result;
  };
  reader.onerror = () => cb(null);
  reader.readAsDataURL(file);
}
function importEmojis(files){
  if (!files || !files.length) return;
  let added = 0;
  files.forEach(file => {
    if (!/^image\//.test(file.type)) return;
    const reader = new FileReader();
    reader.onload = ev => {
      state.emojis.push(ev.target.result);
      added++;
      if (added === files.filter(f => /^image\//.test(f.type)).length) {
        save();
        renderEmojis();
        toast('已导入 ' + added + ' 个表情包');
      }
    };
    reader.readAsDataURL(file);
  });
}

   一起听歌：网易云歌单导入与播放器
   ============================================================ */
const MODES = [
  {k: 'seq', label: '顺序播放', icon: '#i-next'},
  {k: 'loop', label: '列表循环', icon: '#i-loop'},
  {k: 'rand', label: '随机播放', icon: '#i-shuffle'},
  {k: 'one', label: '单曲循环', icon: '#i-loop1'}
];
function modeInfo(){ return MODES.find(x => x.k === (state.music && state.music.mode)) || MODES[0]; }
function parsePlaylistId(raw){
  const s = String(raw || '').trim();
  let m = s.match(/[?&#]id=(\d+)/);
  if (m) return m[1];
  m = s.match(/\/playlist\/(\d+)/);
  if (m) return m[1];
  if (/163|music\.com|music\.126/.test(s)) {
    m = s.match(/(\d{6,})/);
    if (m) return m[1];
  }
  return null;
}
async function tryFetch(url, timeout){
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), timeout || 8000);
  try {
    const r = await fetch(url, {signal: ctrl.signal});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}
function normalizePlaylist(j){
  if (!j) return null;
  if (j.songs && Array.isArray(j.songs)) {
    const songs = j.songs.filter(x => x && x.id).map(x => ({
      id: x.id, name: x.name || '未知歌曲',
      artists: ((x.ar || x.artists) || []).map(a => a.name || a).join('/') || '未知歌手',
      dt: x.dt || x.duration || 0,
      liked: false
    }));
    return {name: (j.playlist && j.playlist.name) || '网易云歌单', cover: (j.playlist && j.playlist.coverImgUrl) || '', songs: songs};
  }
  if (j.playlist && Array.isArray(j.playlist.tracks)) {
    const songs = j.playlist.tracks.filter(x => x && x.id).map(x => ({
      id: x.id, name: x.name || '未知歌曲',
      artists: ((x.ar || x.artists) || []).map(a => a.name || a).join('/') || '未知歌手',
      dt: x.dt || x.duration || 0,
      liked: false
    }));
    return {name: j.playlist.name || '网易云歌单', cover: j.playlist.coverImgUrl || '', songs: songs};
  }
  return null;
}
function fixUrl(u){
  if (u && u.indexOf('http://') === 0 && /\.126\.net/.test(u)) u = 'https://' + u.slice(7);
  return u;
}
function buildNodes(id){
  const enc = encodeURIComponent;
  const official = 'https://music.163.com/api/v6/playlist/detail?id=' + id + '&n=1000';
  const nodes = [];
  if (state.apiBase) {
    const base = state.apiBase.replace(/\/+$/, '');
    nodes.push({build: () => base + '/playlist/track/all?id=' + id + '&limit=1000&offset=0'});
  }
  nodes.push({build: () => 'https://neteasecloudmusicapi.ivelly.com/playlist/track/all?id=' + id + '&limit=1000&offset=0'});
  nodes.push({build: () => 'https://api.allorigins.win/raw?url=' + enc(official)});
  nodes.push({build: () => 'https://api.codetabs.com/v1/proxy?quest=' + enc(official)});
  nodes.push({build: () => 'https://neteasecloudmusicapi.ivelly.com/playlist/detail?id=' + id});
  return nodes;
}
async function fetchPlaylist(id){
  const nodes = buildNodes(id);
  let lastMsg = '接口均不可用';
  for (const n of nodes) {
    try {
      const j = await tryFetch(n.build(), 9000);
      const norm = normalizePlaylist(j);
      if (norm && norm.songs && norm.songs.length) return norm;
    } catch (e) {
      lastMsg = (e && e.name === 'AbortError') ? '请求超时' : '网络错误';
    }
  }
  throw new Error(lastMsg + '，可稍后重试，或在设置中配置自建 API');
}
async function getSongUrl(id){
  const bases = [state.apiBase, 'https://neteasecloudmusicapi.ivelly.com'].filter(Boolean).map(b => b.replace(/\/+$/, ''));
  for (const b of bases) {
    try {
      const j = await tryFetch(b + '/song/url/v1?id=' + id, 6000);
      const u = j && j.data && j.data[0] && j.data[0].url;
      if (u) return fixUrl(u);
    } catch (e) {}
    try {
      const j = await tryFetch(b + '/song/url?id=' + id, 6000);
      const u = j && j.data && j.data[0] && j.data[0].url;
      if (u) return fixUrl(u);
    } catch (e) {}
  }
  return 'https://music.163.com/song/media/outer/url?id=' + id + '.mp3';
}

      c.likedSongs.push({id: song.id, name: song.name, artists: song.artists});

      if (currentRoute.name === 'nowplaying') renderJamBox();

function delSong(i){
  if (!state.music || !state.music.songs) return;
  const s = state.music.songs[i];
  if (!s) return;
  confirmDialog({title:'删除歌曲', text:'确定从歌单中删除「' + s.name + '」吗？', okText:'删除', danger:true}).then(ok => {
    if (!ok) return;
    const wasCur = state.music.index === i;
    state.music.songs.splice(i, 1);
    if (state.music.index > i) state.music.index--;
    if (state.music.index >= state.music.songs.length) state.music.index = Math.max(0, state.music.songs.length - 1);
    if (wasCur || !state.music.songs.length) {
      audio.pause(); audio.removeAttribute('src'); audio.load();
      state.music.index = 0;
    }
    state.vipSongs = state.vipSongs.filter(id => state.music.songs.some(x => x.id === id));
    save(); renderMusic(); updateMiniPlayer(); renderNowPlaying();
    toast('已删除「' + s.name + '」');
  });
}

async function doImport(){
  const input = $('#plInput');
  const raw = input ? input.value.trim() : '';
  if (!raw) { toast('请先粘贴歌单链接'); return; }
  const id = parsePlaylistId(raw);
  if (!id) { toast('未能识别歌单链接，请检查后重试'); return; }
  state.importing = true;
  state.importErr = '';
  renderMusic();
  try {
    const data = await fetchPlaylist(id);
    const oldMode = state.music ? state.music.mode : 'seq';
    state.music = {listId: id, name: data.name, cover: data.cover, songs: data.songs, mode: oldMode, index: 0};
    state.vipSongs = [];
    save();
    renderMusic();
    toast('已导入「' + data.name + '」，共 ' + data.songs.length + ' 首，播放时自动识别VIP试听歌曲');
  } catch (e) {
    state.importErr = e.message || '未知错误';
    renderMusic();
    toast('导入失败：' + state.importErr);
  } finally {
    state.importing = false;
  }
}
/* ---------- 播放器 ---------- */
const audio = $('#audio');
function updatePlayIcon(){
  const ic = $('#playIcon');
  if (!ic) return;
  const paused = audio.paused || audio.ended || !audio.src;
  ic.setAttribute('href', paused ? '#i-play' : '#i-pause');
  ic.setAttribute('xlink:href', paused ? '#i-play' : '#i-pause');
}
function setPlayingUi(){
  const d = $('#durTime');
  if (d && state.music && state.music.songs[state.music.index]) {
    d.textContent = fmtDur((state.music.songs[state.music.index].dt || 0) / 1000);
  }
  updatePlayIcon();
}
async function playAt(i){
  const m = state.music;
  if (!m || !m.songs || !m.songs.length) return;
  if (i < 0 || i >= m.songs.length) return;
  m.index = i;
  save();
  renderMusic();
  const song = m.songs[i];
  let url = null;
  try { url = await getSongUrl(song.id); } catch (e) { url = null; }
  if (!url) { toast('暂时无法获取播放地址'); return; }
  audio.src = url;
  audio.play().catch(() => {});
}
function togglePlay(){
  if (!state.music || !state.music.songs || !state.music.songs.length) return;
  if (!audio.src) { playAt(state.music.index || 0); return; }
  if (audio.paused) audio.play().catch(() => {});
  else audio.pause();
}
function nextTrack(){
  const m = state.music;
  if (!m || !m.songs || !m.songs.length) return;
  // 优先播放红心歌曲
  const liked = m.songs.map((s,i)=>s.liked?i:-1).filter(i=>i>=0);
  const n = m.songs.length;
  if (m.mode === 'rand') {
    let i;
    if (liked.length && Math.random()<0.4) { i = liked[randInt(0, liked.length-1)]; }
    else { do { i = randInt(0, n - 1); } while (n > 1 && i === m.index); }
    playAt(i); return;
  }
  playAt((m.index + 1) % n);
}
function prevTrack(){
  const m = state.music;
  if (!m || !m.songs || !m.songs.length) return;
  if (audio.currentTime > 3) { audio.currentTime = 0; return; }
  const n = m.songs.length;
  playAt((m.index - 1 + n) % n);
}
function onEnded(){
  const m = state.music;
  if (!m || !m.songs || !m.songs.length) return;
  const n = m.songs.length;
  if (m.mode === 'one') { playAt(m.index); return; }
  if (m.mode === 'rand') {
    let i;
    const liked = m.songs.map((s,i)=>s.liked?i:-1).filter(i=>i>=0);
    if (liked.length && Math.random()<0.4) { i = liked[randInt(0, liked.length-1)]; }
    else { do { i = randInt(0, n - 1); } while (n > 1 && i === m.index); }
    playAt(i); return;
  }
  const ni = m.index + 1;
  if (m.mode === 'loop') { playAt(ni % n); return; }
  // 顺序播放：播完最后一首回到第一首继续（自动连播）
  if (ni >= n) { playAt(0); return; }
  playAt(ni);
}
function onAudioError(){
  state.errCount++;
  if (state.errCount >= 3) {
    state.errCount = 0;
    toast('连续播放失败，已停止播放');
    audio.removeAttribute('src');
    audio.load();
    setPlayingUi();
    return;
  }
  const m = state.music;
  const song = m && m.songs[m.index];
  toast('「' + (song ? song.name : '歌曲') + '」暂时无法播放，已自动跳过');
  onEnded();
}
function cycleMode(){
  const m = state.music;
  if (!m) { toast('请先导入歌单'); return; }
  const i = MODES.findIndex(x => x.k === m.mode);
  m.mode = MODES[(i + 1) % MODES.length].k;
  save();
  renderMusic();
  toast('已切换为' + MODES.find(x => x.k === m.mode).label);
}
async function clearPlaylist(){
  if (!state.music) return;
  const ok = await confirmDialog({title: '移除歌单', text: '确定移除当前歌单吗？', okText: '移除', danger: true});
  if (!ok) return;
  audio.pause();
  audio.removeAttribute('src');
  audio.load();
  state.music = null;
  state.vipSongs = [];
  save();
  renderMusic();
  toast('已移除歌单');
}
// 播放后检测VIP歌曲（实际时长小于60秒判定为30s试听）
audio.addEventListener('loadedmetadata', () => {
  const d = $('#durTime');
  if (d && audio.duration) d.textContent = fmtDur(audio.duration);
  const m = state.music;
  if (m && m.songs[m.index] && audio.duration > 0 && audio.duration < 65) {
    const sid = m.songs[m.index].id;
    if (!state.vipSongs.includes(sid)) {
      state.vipSongs.push(sid);
      save();
      toast('检测到VIP试听歌曲：' + m.songs[m.index].name);
      renderMusic();
    }
  }
});
// 联系人随机红心歌曲
setInterval(() => {
  if (state.music && state.music.songs && state.music.songs.length && Math.random()<0.2) {
    const idx = randInt(0, state.music.songs.length-1);
    state.music.songs[idx].liked = true;
    save();
    if (currentRoute.name === 'music') renderMusic();
  }
}, 1000 * 60 * 5);

audio.addEventListener('timeupdate', () => {
  const f = $('#progressFill'), k = $('#progressKnob'), t = $('#curTime');
  if (!f || !audio.duration) return;
  const p = audio.currentTime / audio.duration;
  f.style.width = (p * 100) + '%';
  if (k) k.style.left = (p * 100) + '%';
  if (t) t.textContent = fmtDur(audio.currentTime);
  const nf = $('#npProgressFill'), nk = $('#npProgressKnob'), nt = $('#npCurTime');
  if (nf) { nf.style.width = (p * 100) + '%'; if (nk) nk.style.left = (p * 100) + '%'; if (nt) nt.textContent = fmtDur(audio.currentTime); }
  const mf = $('#miniFill');
  if (mf) mf.style.width = (p * 100) + '%';
});
audio.addEventListener('playing', () => { state.errCount = 0; updatePlayIcon(); updateMiniPlayer(); renderNowPlaying(); });
audio.addEventListener('pause', () => { updatePlayIcon(); updateMiniPlayer(); renderNowPlaying(); });
audio.addEventListener('ended', () => { updatePlayIcon(); updateMiniPlayer(); onEnded(); });
audio.addEventListener('error', onAudioError);

        const p = $('#emojiPanel');
        if (p.classList.contains('show')) p.classList.remove('show');
        setTimeout(() => $('#emojiBtn').click(), 150);
      });
    };
  };
  // 消息长按 / 点击菜单
  const body = $('#chatBody');
  let lpTimer = null, longPressed = false;
  body.addEventListener('pointerdown', e => {
    const b = e.target.closest('[data-msg-menu]');
    if (!b) return;
    longPressed = false;
    lpTimer = setTimeout(() => { longPressed = true; openMsgMenu(b.dataset.msgMenu); }, 480);
  });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => body.addEventListener(ev, () => clearTimeout(lpTimer)));
  body.addEventListener('click', e => {
    const b = e.target.closest('[data-msg-menu]');
    if (!b) return;
    if (longPressed) { longPressed = false; return; }
    openMsgMenu(b.dataset.msgMenu);
  });
}
function updateStatusClock(){
  const el = $('#statusTime');

function init(){

}

<script>

/* 星夜增强交互 */
(function(){
  const $x = s => document.querySelector(s);
  const app = $x('#app');
  // 拖拽/缩小迷你播放器；位置和形态保存在本机
  const mini=$x('#miniPlayer');
  if(mini){
    const saved=(()=>{try{return JSON.parse(localStorage.getItem('wc_mini_layout')||'{}')}catch(e){return {}}})();
    if(saved.compact) mini.classList.add('compact');
    if(saved.left!=null){mini.style.left=saved.left+'px';mini.style.top=saved.top+'px';mini.style.right='auto';mini.style.bottom='auto'}
    const resize=document.createElement('button');resize.className='mini-resize';resize.type='button';resize.title='缩小 / 还原';resize.textContent='↙';mini.appendChild(resize);
    resize.addEventListener('click',e=>{e.stopPropagation();mini.classList.toggle('compact');resize.textContent=mini.classList.contains('compact')?'↗':'↙';saveMini()});
    let drag=null;
    mini.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;drag={x:e.clientX,y:e.clientY,left:mini.offsetLeft,top:mini.offsetTop,moved:false};mini.setPointerCapture?.(e.pointerId);mini.classList.add('dragging')});
    mini.addEventListener('pointermove',e=>{if(!drag)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>4)drag.moved=true;if(!drag.moved)return;let w=mini.offsetWidth,h=mini.offsetHeight,rect=app.getBoundingClientRect();mini.style.left=Math.max(0,Math.min(rect.width-w,drag.left+dx))+'px';mini.style.top=Math.max(0,Math.min(rect.height-h,drag.top+dy))+'px';mini.style.right='auto';mini.style.bottom='auto'});
    mini.addEventListener('pointerup',()=>{if(drag&&drag.moved)saveMini();drag=null;mini.classList.remove('dragging')});
    function saveMini(){const r=mini.getBoundingClientRect(),a=app.getBoundingClientRect();localStorage.setItem('wc_mini_layout',JSON.stringify({left:Math.round(r.left-a.left),top:Math.round(r.top-a.top),compact:mini.classList.contains('compact')}))}
    // 内部点击控件照常触发，拖动后不误开播放页

  }
