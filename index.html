<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>字笺 · ZiJian</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app" data-theme="classic">
    <header class="app-header">
      <button id="btn-back" class="btn-back hidden" title="返回">‹</button>
      <div class="header-center">
        <div id="header-avatar" class="header-avatar hidden" title="双击拍一拍"></div>
        <h1 id="page-title">聊天</h1>
      </div>
      <div class="header-right">
        <button id="btn-chat-more" class="btn-header-more hidden" title="更多">⋯</button>
      </div>
    </header>

    <main class="app-main">
      <section id="page-chat" class="page active">
        <div id="chat-list-view">
          <div id="chat-list" class="chat-list"></div>
          <div id="chat-list-empty" class="empty-state">
            <div class="empty-icon">💬</div>
            <p>选择联系人开始聊天</p>
            <p class="hint">字卡会以纸笺形式回复</p>
          </div>
        </div>
        <div id="chat-detail-view" class="hidden">
          <div id="message-list" class="message-list"></div>
          <div id="quote-bar" class="quote-bar hidden">
            <div class="quote-bar-content">
              <span class="quote-bar-label">引用</span>
              <span id="quote-bar-text" class="quote-bar-text"></span>
            </div>
            <button id="quote-bar-close" class="quote-bar-close">✕</button>
          </div>
          <div id="attach-panel" class="attach-panel hidden">
            <button class="attach-btn" data-action="photo"><span class="attach-icon">🖼️</span><span>照片</span></button>
            <button class="attach-btn" data-action="transfer"><span class="attach-icon">💸</span><span>转账</span></button>
            <button class="attach-btn" data-action="redpacket"><span class="attach-icon">🧧</span><span>红包</span></button>
          </div>
          <div id="sticker-panel" class="sticker-panel hidden"></div>
          <div class="composer">
            <button id="btn-attach" class="btn-attach">+</button>
            <button id="btn-sticker" class="btn-attach" title="表情">☺</button>
            <textarea id="msg-input" placeholder="说点什么..." rows="1"></textarea>
            <button id="btn-send" class="btn-send">发送</button>
          </div>
        </div>
      </section>

      <section id="page-contacts" class="page">
        <div class="contacts-layout">
          <div class="contacts-list" id="contacts-list"></div>
          <div class="cards-panel" id="cards-panel">
            <div class="empty-state small"><p>选择一位联系人查看字卡库</p></div>
          </div>
        </div>
      </section>

      <section id="page-interact" class="page">
        <div class="discover-page">
          <div class="discover-list">
            <button class="discover-item" id="btn-goto-moments">
              <span class="discover-icon">🌈</span>
              <span class="discover-label">朋友圈</span>
              <span class="discover-arrow">›</span>
            </button>
            <button class="discover-item" id="btn-goto-music">
              <span class="discover-icon">🎵</span>
              <span class="discover-label">音乐</span>
              <span class="discover-arrow">›</span>
            </button>
          </div>
          <div id="music-subpage" class="music-subpage hidden">
            <div class="music-page-toolbar">
              <button class="btn-xs" id="btn-music-back">‹ 返回</button>
              <button class="btn-primary" id="btn-import-song">＋ 导入歌曲</button>
            </div>
            <div id="song-list" class="song-list"></div>
            <div id="song-list-empty" class="empty-state">
              <div class="empty-icon">🎵</div>
              <p>还没有歌曲</p>
              <p class="hint">粘贴网易云链接导入</p>
            </div>
          </div>
        </div>
      </section>

      <section id="page-me" class="page">
        <div class="me-content">
          <div class="me-profile-card">
            <div class="me-profile-row">
              <div class="avatar-large" id="me-avatar" style="background:#3D9A62" title="点击更换头像">昕</div>
              <div class="me-profile-info">
                <h2 id="me-name">昕</h2>
                <p class="me-id">字笺 · 纸上心意</p>
                <p class="me-hint">点击头像更换</p>
              </div>
            </div>
            <div class="me-balance-row">
              <div class="me-balance-left">
                <span class="me-balance-label">星币</span>
                <span class="me-balance-num"><span id="user-balance">888</span> ★</span>
              </div>
              <button class="btn-sm" id="btn-edit-balance">充值/修改</button>
            </div>
          </div>
          <div class="me-menu">
            <button class="me-menu-item" id="btn-manage-stickers"><span class="mm-icon">😊</span><span>表情包</span><span class="mm-arrow">›</span></button>
            <button class="me-menu-item" id="btn-moments-cover"><span class="mm-icon">🖼️</span><span>朋友圈封面</span><span class="mm-arrow">›</span></button>
            <button class="me-menu-item" id="btn-export-data"><span class="mm-icon">📦</span><span>导出备份</span><span class="mm-arrow">›</span></button>
            <button class="me-menu-item" id="btn-import-data"><span class="mm-icon">📥</span><span>导入备份</span><span class="mm-arrow">›</span></button>
          </div>
          <div class="theme-section">
            <div class="section-label">主题皮肤</div>
            <div class="theme-grid" id="theme-grid">
              <button class="theme-card active" data-theme="classic"><div class="theme-preview classic-preview"></div><span>经典绿</span></button>
              <button class="theme-card" data-theme="dark"><div class="theme-preview dark-preview"></div><span>暗夜黑</span></button>
              <button class="theme-card" data-theme="cream"><div class="theme-preview cream-preview"></div><span>奶油白</span></button>
              <button class="theme-card" data-theme="lavender"><div class="theme-preview lavender-preview"></div><span>淡紫</span></button>
            </div>
          </div>
          <div class="stats">
            <div class="stat-item"><span class="stat-num" id="stat-contacts">0</span><span class="stat-label">联系人</span></div>
            <div class="stat-item"><span class="stat-num" id="stat-cards">0</span><span class="stat-label">字卡</span></div>
            <div class="stat-item"><span class="stat-num" id="stat-songs">0</span><span class="stat-label">歌曲</span></div>
          </div>
          <button class="btn-outline" id="btn-reset-data">重置示例数据</button>
        </div>
      </section>
    </main>

    <nav class="tab-bar">
      <button class="tab-item active" data-page="chat"><span class="tab-icon">💬</span><span class="tab-label">聊天</span></button>
      <button class="tab-item" data-page="contacts"><span class="tab-icon">📇</span><span class="tab-label">联系人</span></button>
      <button class="tab-item" data-page="interact"><span class="tab-icon">✨</span><span class="tab-label">互动</span></button>
      <button class="tab-item" data-page="me"><span class="tab-icon">👤</span><span class="tab-label">我</span></button>
    </nav>
  </div>

  <div id="listen-page" class="listen-page hidden">
    <div class="listen-top">
      <button id="listen-back" class="listen-back">‹</button>
      <div class="listen-with" id="listen-with-name">一起听</div>
      <div class="listen-spacer"></div>
    </div>
    <div class="listen-cover-wrap">
      <div class="listen-cover-ring"><div id="listen-cover" class="listen-cover"></div></div>
    </div>
    <div class="listen-meta">
      <div id="listen-title" class="listen-title">歌名</div>
      <div id="listen-artist" class="listen-artist">歌手</div>
    </div>
    <div class="listen-lyrics-wrap"><div id="listen-lyrics" class="listen-lyrics"><div class="lyric-line">暂无歌词</div></div></div>
    <div class="listen-progress-wrap">
      <span id="listen-cur">0:00</span>
      <input type="range" id="listen-seek" class="listen-seek" min="0" max="100" value="0" step="0.1" />
      <span id="listen-dur">0:00</span>
    </div>
    <div class="listen-controls">
      <button id="listen-mode" class="listen-side-btn" title="播放模式">顺序</button>
      <button id="listen-prev" class="listen-side-btn" title="上一首">⏮</button>
      <button id="listen-play" class="listen-play-btn">▶</button>
      <button id="listen-next" class="listen-side-btn" title="下一首">⏭</button>
      <button id="listen-mini" class="listen-side-btn" title="收起为悬浮窗">⤵</button>
    </div>
    <div id="listen-toast" class="listen-toast hidden"></div>
    <audio id="listen-audio" preload="metadata"></audio>
  </div>

  <!-- 一起听悬浮窗 -->
  <div id="float-player" class="float-player hidden">
    <div id="float-cover" class="float-cover">🎵</div>
    <div class="float-info">
      <div id="float-title" class="float-title">未播放</div>
      <div id="float-artist" class="float-artist"></div>
    </div>
    <button id="float-play" class="float-btn">▶</button>
    <button id="float-expand" class="float-btn" title="展开">▲</button>
    <button id="float-close" class="float-btn" title="关闭">✕</button>
  </div>

  <div id="pick-contact-overlay" class="modal-overlay hidden">
    <div class="modal">
      <h3>选择一起听的联系人</h3>
      <div id="pick-contact-list" class="pick-contact-list"></div>
      <div class="modal-actions"><button class="btn-ghost" id="pick-contact-cancel">取消</button></div>
    </div>
  </div>

  <div id="msg-action-menu" class="msg-action-menu hidden"><button data-action="quote">引用</button></div>

  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal modal-wide">
      <h3 id="modal-title">导入歌曲</h3>
      <div id="modal-body"></div>
      <div class="modal-actions">
        <button class="btn-ghost" id="modal-cancel">取消</button>
        <button class="btn-primary" id="modal-confirm">确定</button>
      </div>
    </div>
  </div>

  <input type="file" id="file-avatar" accept="image/*" class="hidden" />
  <input type="file" id="file-bg" accept="image/*" class="hidden" />
  
  <!-- 朋友圈 -->
  <div id="moments-page" class="moments-page hidden">
    <div class="moments-top transparent">
      <button id="moments-back" class="listen-back">‹</button>
      <h2>朋友圈</h2>
      <button id="moments-post" class="btn-xs">发表</button>
      <button id="moments-refresh" class="btn-xs">刷新</button>
    </div>
    <div class="moments-scroll">
      <div class="moments-cover" id="moments-cover">
        <div class="moments-cover-user">
          <span class="moments-cover-name" id="moments-cover-name">昕</span>
          <div class="moments-cover-avatar" id="moments-cover-avatar">昕</div>
        </div>
      </div>
      <div id="moments-list" class="moments-list"></div>
    </div>
    <div id="moment-comment-bar" class="moment-comment-bar hidden">
      <input type="text" id="moment-comment-input" placeholder="发表评论：" />
      <button id="moment-comment-sticker" class="mcb-btn" title="表情">☺</button>
      <button id="moment-comment-send" class="mcb-send">发送</button>
    </div>
  </div>
  <input type="file" id="file-moments-cover" accept="image/*" class="hidden" />

  <!-- 红包打开 -->
  <div id="rp-open-overlay" class="rp-open-overlay hidden">
    <div class="rp-open-card">
      <div>红包</div>
      <div class="rp-open-amount" id="rp-open-amount">0</div>
      <div class="rp-open-note" id="rp-open-note"></div>
      <button class="rp-open-close" id="rp-open-close">收下</button>
    </div>
  </div>

  <input type="file" id="file-backup" accept="application/json,.json" class="hidden" />
  <input type="file" id="file-cards-txt" accept=".txt,text/plain" class="hidden" />
  <input type="file" id="file-chat-photo" accept="image/*" class="hidden" />
  <input type="file" id="file-moment-photo" accept="image/*" class="hidden" />
  <input type="file" id="file-stickers" accept="image/*" multiple class="hidden" />

  
  <div id="chat-settings-page" class="chat-settings-page hidden">
    <div class="moments-top">
      <button id="chat-settings-back" class="listen-back">‹</button>
      <h2>聊天设置</h2>
      <div style="width:40px"></div>
    </div>
    <div class="chat-settings-body" id="chat-settings-body"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
