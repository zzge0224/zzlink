<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>字笺 · ZiJian</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- 顶部标题栏 -->
    <header class="app-header">
      <button id="btn-back" class="btn-back hidden" title="返回">‹</button>
      <h1 id="page-title">聊天</h1>
      <div class="header-right"></div>
    </header>

    <!-- 主内容区 -->
    <main class="app-main">
      <!-- 聊天页 -->
      <section id="page-chat" class="page active">
        <!-- 会话列表（未选中联系人时） -->
        <div id="chat-list-view">
          <div id="chat-list" class="chat-list"></div>
          <div id="chat-list-empty" class="empty-state">
            <div class="empty-icon">💬</div>
            <p>选择联系人开始聊天</p>
            <p class="hint">字卡会以纸笺形式回复</p>
          </div>
        </div>

        <!-- 单聊视图 -->
        <div id="chat-detail-view" class="hidden">
          <div id="message-list" class="message-list"></div>
          <div class="composer">
            <textarea id="msg-input" placeholder="说点什么..." rows="1"></textarea>
            <button id="btn-send" class="btn-send">发送</button>
          </div>
        </div>
      </section>

      <!-- 联系人页 -->
      <section id="page-contacts" class="page">
        <div class="contacts-layout">
          <div class="contacts-list" id="contacts-list"></div>
          <div class="cards-panel" id="cards-panel">
            <div class="empty-state small">
              <p>选择一位联系人查看字卡库</p>
            </div>
          </div>
        </div>
      </section>

      <!-- 我页 -->
      <section id="page-me" class="page">
        <div class="me-content">
          <div class="avatar-large" style="background:#3D9A62">昕</div>
          <h2>昕</h2>
          <p class="subtitle">字笺 · 纸上心意</p>
          <div class="stats">
            <div class="stat-item">
              <span class="stat-num" id="stat-contacts">0</span>
              <span class="stat-label">联系人</span>
            </div>
            <div class="stat-item">
              <span class="stat-num" id="stat-cards">0</span>
              <span class="stat-label">字卡总数</span>
            </div>
          </div>
          <button class="btn-outline" id="btn-reset-data">重置示例数据</button>
        </div>
      </section>
    </main>

    <!-- 底部 Tab 导航 -->
    <nav class="tab-bar">
      <button class="tab-item active" data-page="chat">
        <span class="tab-icon">💬</span>
        <span class="tab-label">聊天</span>
      </button>
      <button class="tab-item" data-page="contacts">
        <span class="tab-icon">📇</span>
        <span class="tab-label">联系人</span>
      </button>
      <button class="tab-item" data-page="me">
        <span class="tab-icon">👤</span>
        <span class="tab-label">我</span>
      </button>
    </nav>
  </div>

  <!-- 通用弹窗（字卡编辑 / 回复设置） -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal">
      <h3 id="modal-title">添加字卡</h3>
      <div id="modal-body">
        <textarea id="modal-input" placeholder="输入字卡内容..." rows="4"></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn-ghost" id="modal-cancel">取消</button>
        <button class="btn-primary" id="modal-confirm">确定</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
