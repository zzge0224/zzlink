<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>字卡聊天站</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%234CBF78'/%3E%3Cpath d='M20 30c0-9 5-15 12-15s12 6 12 15-5 15-12 15c-2 0-4-.4-5.6-1.1L20 46l1.6-6A13 13 0 0 1 20 30z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@600;700;900&family=Noto+Sans+SC:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#dfe6de;
  --panel:#f6f8f5;
  --panel-2:#eef2ec;
  --ink:#23332b;
  --ink-soft:#6b7a72;
  --ink-faint:#9aa89f;
  --green:#4cbf78;
  --green-deep:#2e9c5f;
  --green-soft:#bfe8cf;
  --accent:#e88f5a;
  --bubble-in:#ffffff;
  --line:rgba(35,51,43,.08);
  --radius:16px;
  --shadow:0 18px 50px rgba(35,51,43,.18);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"Noto Sans SC",-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(1200px 800px at 85% -10%, rgba(76,191,120,.16), transparent 60%),
    radial-gradient(1000px 700px at -10% 110%, rgba(232,143,90,.14), transparent 55%),
    var(--bg);
  overflow:hidden;
}
/* ===== 舞台 ===== */
.stage{height:100dvh;display:flex;align-items:center;justify-content:center;padding:0}
.app{
  position:relative;width:100%;max-width:480px;height:100dvh;
  background:var(--panel);display:flex;flex-direction:column;
  box-shadow:var(--shadow);overflow:hidden;
}
@media(min-width:560px){
  body{padding:26px 16px}
  .stage{height:calc(100dvh - 52px)}
  .app{height:calc(100dvh - 52px);border-radius:28px}
}

/* ===== 顶栏 ===== */
.topbar{
  flex:0 0 auto;display:flex;align-items:center;gap:12px;
  padding:14px 16px 12px;
  background:linear-gradient(180deg,#eef5ef,#f4f8f4);
  border-bottom:1px solid var(--line);
  position:relative;z-index:5;
}
.person{display:flex;align-items:center;gap:12px;min-width:0}
.avatar{width:44px;height:44px;border-radius:50%;flex:0 0 auto;overflow:hidden;box-shadow:0 4px 10px rgba(35,51,43,.12)}
.avatar svg{width:100%;height:100%;display:block}
.person-txt{min-width:0}
.person-name{
  font-family:"Noto Serif SC",serif;font-weight:700;font-size:17px;
  display:flex;align-items:center;gap:6px;white-space:nowrap;
}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;box-shadow:0 0 0 3px rgba(76,191,120,.18)}
.person-sub{font-size:12px;color:var(--ink-soft);margin-top:1px;white-space:nowrap}
.top-actions{margin-left:auto;display:flex;gap:8px}
.iconbtn{
  width:40px;height:40px;border:none;background:transparent;border-radius:12px;
  display:flex;align-items:center;justify-content:center;color:var(--ink);
  cursor:pointer;transition:.18s;
}
.iconbtn:active{background:rgba(76,191,120,.14);transform:scale(.92)}
.iconbtn svg{width:21px;height:21px}

/* ===== 聊天区 ===== */
.chat{flex:1 1 auto;overflow-y:auto;padding:16px 14px 8px;scroll-behavior:smooth;
  background:
    radial-gradient(600px 400px at 10% 0%, rgba(191,232,207,.4), transparent 60%),
    var(--panel-2);
}
.day-tag{text-align:center;margin:6px 0 14px}
.day-tag span{
  font-size:11px;color:var(--ink-soft);background:rgba(35,51,43,.06);
  padding:4px 12px;border-radius:999px;
}
.msg{display:flex;gap:10px;margin-bottom:14px;align-items:flex-end;animation:bubble .28s ease both}
@keyframes bubble{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.msg .mini-avatar{width:34px;height:34px;border-radius:50%;flex:0 0 auto;overflow:hidden;box-shadow:0 2px 6px rgba(35,51,43,.14)}
.msg .mini-avatar svg{width:100%;height:100%;display:block}
.msg.me{flex-direction:row-reverse}
.msg-row{max-width:76%;display:flex;flex-direction:column}
.msg-row .meta{font-size:10px;color:var(--ink-faint);margin:3px 6px 0;order:2}
.msg.me .msg-row{align-items:flex-end}
.msg.me .meta{order:2;text-align:right}
.bubble{
  position:relative;padding:10px 13px;border-radius:16px;font-size:15px;line-height:1.55;
  word-break:break-word;white-space:pre-wrap;box-shadow:0 2px 6px rgba(35,51,43,.06);
}
.bubble::before{content:"";position:absolute;bottom:10px;width:9px;height:9px;transform:rotate(45deg)}
.msg.them .bubble{background:var(--bubble-in);border-top-left-radius:4px;order:1}
.msg.them .bubble::before{left:-4px;background:var(--bubble-in)}
.msg.me .bubble{
  background:linear-gradient(135deg,var(--green) 0%,var(--green-deep) 100%);
  color:#fff;border-top-right-radius:4px;order:1;
}
.msg.me .bubble::before{right:-4px;background:var(--green-deep)}
.cat-tag{
  font-size:10px;color:var(--green-deep);background:var(--green-soft);
  padding:1px 8px;border-radius:999px;margin:0 0 5px 2px;order:0;align-self:flex-start;
  letter-spacing:.02em;
}
.msg.me .cat-tag{align-self:flex-end;margin:0 2px 5px 0}

/* 正在输入 */
.typing .bubble{padding:11px 14px}
.typing .dots{display:flex;gap:4px;align-items:center}
.typing .dots i{width:7px;height:7px;border-radius:50%;background:var(--ink-soft);animation:bounce 1.2s infinite}
.typing .dots i:nth-child(2){animation-delay:.18s}
.typing .dots i:nth-child(3){animation-delay:.36s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-5px);opacity:1}}

.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--ink-soft);text-align:center;padding:0 30px}
.empty .big{font-size:13px;line-height:1.9;max-width:300px}

/* ===== 输入栏 ===== */
.inputbar{flex:0 0 auto;padding:10px 12px calc(12px + env(safe-area-inset-bottom));
  background:#fff;border-top:1px solid var(--line);display:flex;align-items:flex-end;gap:8px}
.plus{
  flex:0 0 auto;width:40px;height:40px;border:none;border-radius:50%;
  background:var(--panel-2);color:var(--green-deep);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.18s;
}
.plus:active{transform:scale(.92);background:var(--green-soft)}
.plus svg{width:22px;height:22px}
.in-wrap{flex:1 1 auto;display:flex;align-items:flex-end;background:var(--panel-2);border-radius:22px;padding:6px 12px;min-height:44px}
.in-wrap textarea{
  flex:1;border:none;outline:none;background:transparent;resize:none;
  font-family:inherit;font-size:16px;line-height:1.5;color:var(--ink);max-height:120px;min-height:30px;padding:3px 0;
}
.send{
  flex:0 0 auto;height:40px;min-width:72px;border:none;border-radius:20px;
  background:linear-gradient(135deg,var(--green),var(--green-deep));color:#fff;
  font-size:14px;font-weight:600;cursor:pointer;transition:.18s;display:flex;align-items:center;justify-content:center;
}
.send:active{transform:scale(.95)}
.send:disabled{opacity:.45;cursor:not-allowed}

/* ===== 字卡库抽屉 ===== */
.drawer{
  position:fixed;inset:auto 0 0 0;max-height:84dvh;background:var(--panel);
  border-radius:24px 24px 0 0;box-shadow:0 -10px 40px rgba(35,51,43,.25);
  transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);
  display:flex;flex-direction:column;z-index:30;padding:10px 0 0;
}
.drawer.open{transform:none}
.drag{width:44px;height:5px;border-radius:3px;background:rgba(35,51,43,.14);margin:0 auto 4px}
.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:8px 18px 4px}
.drawer-head h2{font-family:"Noto Serif SC",serif;font-size:17px;font-weight:700}
.drawer-head .count{font-size:12px;color:var(--ink-soft);font-family:"Noto Sans SC"}
.drawer-close{width:34px;height:34px;border:none;background:transparent;color:var(--ink-soft);cursor:pointer;border-radius:10px;display:flex;align-items:center;justify-content:center}
.drawer-close:active{background:var(--panel-2)}
.drawer-close svg{width:20px;height:20px}
.drawer-body{flex:1 1 auto;overflow-y:auto;padding:10px 16px 20px}
.d-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{
  border:1px solid var(--line);background:#fff;color:var(--ink-soft);
  font-size:12px;padding:6px 12px;border-radius:999px;cursor:pointer;transition:.15s;
}
.chip.on{background:var(--green);border-color:var(--green);color:#fff;font-weight:500}
.group{margin-bottom:16px}
.group-title{font-size:12px;color:var(--ink-faint);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.group-title::after{content:"";flex:1;height:1px;background:var(--line)}
.cards{display:flex;flex-direction:column;gap:8px}
.card{
  display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);
  border-radius:14px;padding:10px 12px;animation:cardin .2s ease both;
}
@keyframes cardin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card .txt{flex:1;font-size:14px;line-height:1.5;min-width:0;word-break:break-word}
.card .del{
  flex:0 0 auto;width:30px;height:30px;border:none;background:transparent;color:var(--ink-faint);
  cursor:pointer;border-radius:8px;display:flex;align-items:center;justify-content:center;transition:.15s;
}
.card .del:active{background:rgba(232,143,90,.12);color:var(--accent)}
.card .del svg{width:17px;height:17px}
.add-box{background:#fff;border:1.5px dashed rgba(76,191,120,.5);border-radius:14px;padding:12px;margin-top:4px}
.add-box textarea{
  width:100%;border:none;outline:none;background:var(--panel-2);border-radius:10px;
  font-family:inherit;font-size:16px;padding:10px 12px;resize:none;min-height:52px;line-height:1.5;color:var(--ink);
}
.add-meta{display:flex;gap:8px;align-items:center;margin-top:10px}
.add-meta select{
  flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;
  font-family:inherit;font-size:14px;color:var(--ink);padding:9px 10px;outline:none;
}
.add-btn{
  border:none;border-radius:10px;background:linear-gradient(135deg,var(--green),var(--green-deep));
  color:#fff;font-size:14px;font-weight:600;padding:9px 18px;cursor:pointer;transition:.18s;white-space:nowrap;
}
.add-btn:active{transform:scale(.95)}
.add-cat-add{flex:0 0 auto;width:40px;border:1px solid var(--line);background:#fff;border-radius:10px;color:var(--green-deep);cursor:pointer;font-size:20px}
.backdrop{position:fixed;inset:0;background:rgba(35,51,43,.34);opacity:0;pointer-events:none;transition:opacity .3s;z-index:20}
.backdrop.show{opacity:1;pointer-events:auto}

/* toast */
.toast{
  position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(8px);
  background:rgba(35,51,43,.88);color:#fff;font-size:13px;padding:9px 16px;border-radius:12px;
  opacity:0;transition:.25s;z-index:40;pointer-events:none;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(min-width:560px){
  .drawer{inset:auto 0;left:auto;top:0;right:0;height:100%;max-height:100%;width:360px;border-radius:0 24px 24px 0}
  .drag{display:none}
}
</style>
</head>
<body>
<div class="stage">
  <div class="app">
    <!-- 顶栏 -->
    <header class="topbar">
      <div class="person">
        <div class="avatar">
          <svg viewBox="0 0 64 64"><defs><linearGradient id="ga" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6bd08f"/><stop offset="1" stop-color="#2e9c5f"/></linearGradient></defs><rect width="64" height="64" fill="url(#ga)"/><circle cx="32" cy="26" r="9" fill="#fff" opacity=".95"/><path d="M14 52c2-10 10-15 18-15s16 5 18 15z" fill="#fff" opacity=".95"/></svg>
        </div>
        <div class="person-txt">
          <div class="person-name"><span class="status-dot"></span>字卡酱</div>
          <div class="person-sub">随机回复 · 你的专属话搭子</div>
        </div>
      </div>
      <div class="top-actions">
        <button class="iconbtn" id="btnClear" aria-label="清空对话" title="清空对话">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M9 7V5h6v2M7 7l1 12h8l1-12M10 11v5M14 11v5"/></svg>
        </button>
        <button class="iconbtn" id="btnOpen" aria-label="字卡库" title="字卡库">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h7v14H4zM13 5h7v8h-7z"/></svg>
        </button>
      </div>
    </header>

    <!-- 聊天区 -->
    <main class="chat" id="chat"></main>

    <!-- 输入栏 -->
    <footer class="inputbar">
      <button class="plus" id="btnPlus" aria-label="打开字卡库">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <div class="in-wrap">
        <textarea id="input" rows="1" placeholder="对字卡酱说点什么…" enterkeyhint="send"></textarea>
      </div>
      <button class="send" id="btnSend">发送</button>
    </footer>
  </div>
</div>

<!-- 字卡库抽屉 -->
<div class="backdrop" id="backdrop"></div>
<aside class="drawer" id="drawer" aria-label="字卡库">
  <div class="drag"></div>
  <div class="drawer-head">
    <h2>我的字卡库</h2>
    <span class="count" id="cardCount">0 张字卡</span>
    <button class="drawer-close" id="btnClose" aria-label="关闭">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="drawer-body">
    <div class="d-actions" id="catChips"></div>
    <div id="groups"></div>
    <div class="add-box">
      <textarea id="newCard" rows="2" placeholder="写一句想让字卡酱回复的话…"></textarea>
      <div class="add-meta">
        <select id="newCat"></select>
        <button class="add-cat-add" id="btnNewCat" aria-label="新建分类" title="新建分类">+</button>
        <button class="add-btn" id="btnAdd">添加字卡</button>
      </div>
    </div>
  </div>
</aside>
<div class="toast" id="toast"></div>

<script>
/* ================= 数据 ================= */
const seed = {
  "开场问候": ["你好呀，想我了吗？", "嗨～终于等到你上线", "今天过得怎么样？", "见到你真开心～", "嘘……我一直在这里等你哦"],
  "日常回应": ["真的吗？好有意思！", "嗯嗯，然后呢？", "你说得对诶，我也是这么想的", "哇，这听起来好棒！", "哈哈，被你逗笑了", "我也这么觉得！"],
  "小惊喜": ["偷偷告诉你，我今天想你了", "送你一颗小星星", "你就是我的小幸运", "现在，是只属于你的时刻～", "世界那么大，还是想和你聊天"]
};
const CATS = ["开场问候", "日常回应", "小惊喜"];

let cards = JSON.parse(JSON.stringify(seed)); // {cat:[words]}
let onCats = new Set(CATS);                   // 参与随机回复的分类
let messages = [];                            // {id,side,text,cat}
let busy = false;

/* ================= 渲染：聊天 ================= */
const chatEl = document.getElementById("chat");
function dayTag(){
  const d = document.createElement("div");
  d.className = "day-tag";
  const s = document.createElement("span");
  s.textContent = "今天";
  d.appendChild(s);
  return d;
}
function svgAvatar(){
  return '<svg viewBox="0 0 64 64"><defs><linearGradient id="ga" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6bd08f"/><stop offset="1" stop-color="#2e9c5f"/></linearGradient></defs><rect width="64" height="64" fill="url(#ga)"/><circle cx="32" cy="26" r="9" fill="#fff" opacity=".95"/><path d="M14 52c2-10 10-15 18-15s16 5 18 15z" fill="#fff" opacity=".95"/></svg>';
}
function meAvatar(){
  return '<svg viewBox="0 0 64 64"><defs><linearGradient id="gum" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0a97a"/><stop offset="1" stop-color="#e47a5a"/></linearGradient></defs><rect width="64" height="64" fill="url(#gum)"/><circle cx="32" cy="25" r="9" fill="#fff" opacity=".95"/><path d="M15 51c2-9 9-14 17-14s15 5 17 14z" fill="#fff" opacity=".95"/></svg>';
}
function timeNow(){
  const d = new Date();
  return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
}
function renderMessages(){
  chatEl.innerHTML = "";
  chatEl.appendChild(dayTag());
  if(messages.length === 0){
    const e = document.createElement("div");
    e.className = "empty";
    e.innerHTML = '<div style="font-family:Noto Serif SC,serif;font-size:15px;color:var(--ink)">开始你们的对话吧</div><div class="big">在下方输入一句话发送，字卡酱会从你的字卡库里随机抽一张来回复你。<br>点右上角打开「字卡库」，随时增删属于你自己的句子。</div>';
    chatEl.appendChild(e);
    return;
  }
  messages.forEach(m => {
    const row = document.createElement("div");
    row.className = "msg " + m.side;
    const av = document.createElement("div");
    av.className = "mini-avatar";
    av.innerHTML = m.side === "me" ? meAvatar() : svgAvatar();
    const col = document.createElement("div");
    col.className = "msg-row";
    if(m.cat && m.side === "them"){ const t=document.createElement("span"); t.className="cat-tag"; t.textContent=m.cat; col.appendChild(t); }
    const b = document.createElement("div");
    b.className = "bubble"; b.textContent = m.text;
    const meta = document.createElement("span");
    meta.className = "meta"; meta.textContent = m.time;
    col.appendChild(b); col.appendChild(meta);
    row.appendChild(av); row.appendChild(col);
    chatEl.appendChild(row);
  });
}
function scrollBottom(){ requestAnimationFrame(()=>{ chatEl.scrollTop = chatEl.scrollHeight; }); }
function showTyping(){
  const row = document.createElement("div");
  row.className = "msg them typing"; row.id = "typing";
  const av = document.createElement("div"); av.className="mini-avatar"; av.innerHTML = svgAvatar();
  const col = document.createElement("div"); col.className="msg-row";
  const b = document.createElement("div"); b.className="bubble";
  b.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>';
  col.appendChild(b); row.appendChild(av); row.appendChild(col);
  chatEl.appendChild(row); scrollBottom();
}
function hideTyping(){ const t=document.getElementById("typing"); if(t) t.remove(); }

/* ================= 随机回复 ================= */
let lastPick = null;
function pickCard(){
  const pool = [];
  CATS.forEach(c => { if(onCats.has(c)) (cards[c]||[]).forEach(w => pool.push({text:w,cat:c})); });
  if(pool.length === 0) return {text:"（字卡库还没有可用的句子，去右上角添几句吧）",cat:null};
  let pick = pool[Math.floor(Math.random()*pool.length)];
  let guard = 0;
  while(pick.text === lastPick && pool.length > 1 && guard < 8){ pick = pool[Math.floor(Math.random()*pool.length)]; guard++; }
  lastPick = pick.text;
  return pick;
}
function send(text){
  if(busy) return;
  busy = true;
  messages.push({id:Date.now(), side:"me", text, time:timeNow()});
  renderMessages(); scrollBottom();
  const el = document.getElementById("input"); if(el) el.value = "";
  autoGrow();
  showTyping();
  const delay = 900 + Math.random()*800;
  setTimeout(()=>{
    hideTyping();
    const p = pickCard();
    messages.push({id:Date.now(), side:"them", text:p.text, cat:p.cat, time:timeNow()});
    renderMessages(); scrollBottom();
    busy = false;
  }, delay);
}

/* ================= 输入 ================= */
const input = document.getElementById("input");
const sendBtn = document.getElementById("btnSend");
function autoGrow(){ input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 120) + "px"; }
function canSend(){ return input.value.trim().length > 0 && !busy; }
function onInput(){ sendBtn.disabled = !canSend(); autoGrow(); }
input.addEventListener("input", onInput);
input.addEventListener("keydown", e => {
  if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); if(canSend()) send(input.value.trim()); }
});
sendBtn.addEventListener("click", ()=>{ if(canSend()) send(input.value.trim()); });

/* ================= 字卡库渲染 ================= */
const groupsEl = document.getElementById("groups");
const chipsEl = document.getElementById("catChips");
const countEl = document.getElementById("cardCount");
const catSelect = document.getElementById("newCat");
function totalCount(){ return CATS.reduce((s,c)=> s + (cards[c]||[]).length, 0); }
function renderCatSelect(){
  catSelect.innerHTML = "";
  CATS.forEach(c => { const o=document.createElement("option"); o.value=c; o.textContent=c; catSelect.appendChild(o); });
}
function renderChips(){
  chipsEl.innerHTML = "";
  CATS.forEach(c => {
    const chip = document.createElement("button");
    chip.className = "chip" + (onCats.has(c) ? " on" : "");
    chip.textContent = c + " " + (cards[c]||[]).length;
    chip.addEventListener("click", ()=>{
      onCats.has(c) ? onCats.delete(c) : onCats.add(c);
      renderChips();
    });
    chipsEl.appendChild(chip);
  });
}
function renderGroups(){
  groupsEl.innerHTML = "";
  CATS.forEach(c => {
    const list = cards[c] || [];
    if(list.length === 0) return;
    const g = document.createElement("div");
    g.className = "group";
    const t = document.createElement("div"); t.className = "group-title"; t.textContent = c;
    const cw = document.createElement("div"); cw.className = "cards";
    list.forEach((w, i) => {
      const cd = document.createElement("div"); cd.className = "card";
      const txt = document.createElement("div"); txt.className = "txt"; txt.textContent = w;
      const del = document.createElement("button"); del.className = "del"; del.setAttribute("aria-label","删除");
      del.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
      del.addEventListener("click", ()=>{ cards[c].splice(i,1); if(cards[c].length===0 && CATS.indexOf(c)>2){} renderAll(); });
      cd.appendChild(txt); cd.appendChild(del);
      cw.appendChild(cd);
    });
    g.appendChild(t); g.appendChild(cw);
    groupsEl.appendChild(g);
  });
}
function renderAll(){ renderChips(); renderGroups(); renderCatSelect(); countEl.textContent = totalCount() + " 张字卡"; }

/* ================= 字卡操作 ================= */
const newCard = document.getElementById("newCard");
function addCard(){
  const text = newCard.value.trim();
  if(!text){ toast("先写一句话吧"); return; }
  const cat = catSelect.value;
  if(!cards[cat]) cards[cat] = [];
  cards[cat].push(text);
  newCard.value = "";
  renderAll();
  toast("已加入「" + cat + "」");
}
document.getElementById("btnAdd").addEventListener("click", addCard);
newCard.addEventListener("keydown", e => { if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); addCard(); } });
document.getElementById("btnNewCat").addEventListener("click", ()=>{
  const name = prompt("新分类名称：");
  if(!name || !name.trim()) return;
  const c = name.trim().slice(0, 12);
  if(CATS.indexOf(c) >= 0){ toast("这个分类已存在"); return; }
  CATS.push(c);
  if(!cards[c]) cards[c] = [];
  onCats.add(c);
  catSelect.value = c;
  renderAll();
  toast("已新建分类「" + c + "」");
});

/* ================= 抽屉 / 清空 ================= */
const drawer = document.getElementById("drawer");
const backdrop = document.getElementById("backdrop");
function openDrawer(){ renderAll(); drawer.classList.add("open"); backdrop.classList.add("show"); }
function closeDrawer(){ drawer.classList.remove("open"); backdrop.classList.remove("show"); }
document.getElementById("btnOpen").addEventListener("click", openDrawer);
document.getElementById("btnPlus").addEventListener("click", openDrawer);
document.getElementById("btnClose").addEventListener("click", closeDrawer);
backdrop.addEventListener("click", closeDrawer);
document.getElementById("btnClear").addEventListener("click", ()=>{
  messages = []; busy = false; renderMessages(); scrollBottom(); toast("对话已清空");
});

/* toast */
let toastTimer;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove("show"), 1800);
}

/* ================= 初始化 ================= */
renderMessages();
renderAll();
onInput();
scrollBottom();

/* 欢迎语 */
setTimeout(()=>{
  const greet = "你好呀，我是字卡酱～我把开场白留在了「开场问候」里，你可以从右上角打开字卡库随意增改，我只会用你写下的句子回复你哦。";
  messages.push({id:Date.now(), side:"them", text:greet, time:timeNow()});
  renderMessages(); scrollBottom();
}, 400);
</script>
